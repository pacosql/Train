<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Orto Redes · ideas de posts</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Orto Redes" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #000; --s1: #0b0b0b; --s2: #141414; --line: #232323; --line2: #333;
      --text: #f4f4f2; --muted: #8b8b88; --dim: #5c5c5a;
      --red: #ff3b30; --ok: #f4f4f2;
      --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
      --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.5;
      padding: max(18px, env(safe-area-inset-top)) 16px 56px; -webkit-font-smoothing: antialiased; }
    .wrap { max-width: 640px; margin: 0 auto; }
    a { color: inherit; }
    header { padding: 8px 0 22px; border-bottom: 1px solid var(--line); }
    .marca { font-family: var(--serif); font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
    .marca b { color: var(--text); font-weight: 600; }
    h1 { font-family: var(--serif); font-weight: 400; font-size: 34px; line-height: 1.1; letter-spacing: -0.5px; margin: 14px 0 10px; }
    h1 em { font-style: italic; color: var(--muted); }
    .lead { color: var(--muted); font-size: 15px; margin: 0; max-width: 520px; }

    nav.tabs { position: sticky; top: 0; z-index: 5; background: rgba(0,0,0,.92); backdrop-filter: blur(10px);
      display: flex; gap: 22px; overflow-x: auto; padding: 14px 0 0; margin: 0 -16px 0; padding-left: 16px; padding-right: 16px;
      border-bottom: 1px solid var(--line); scrollbar-width: none; }
    nav.tabs::-webkit-scrollbar { display: none; }
    nav.tabs button { background: none; border: 0; color: var(--dim); font: 500 14px var(--sans); letter-spacing: .3px;
      padding: 0 0 12px; border-bottom: 1px solid transparent; margin-bottom: -1px; cursor: pointer; white-space: nowrap; }
    nav.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--text); }
    nav.tabs button .n { color: var(--dim); font-size: 12px; margin-left: 4px; }

    .intro { padding: 26px 0 6px; color: var(--muted); font-size: 14.5px; }
    .intro strong { color: var(--text); font-weight: 500; }

    /* ---------- Tarjeta de idea ---------- */
    article.idea { border-bottom: 1px solid var(--line); padding: 34px 0 38px; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
    .chip { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted);
      border: 1px solid var(--line2); border-radius: 999px; padding: 3px 10px; }
    .chip.solid { background: var(--text); color: #000; border-color: var(--text); }
    .num { font-family: var(--serif); color: var(--dim); font-size: 13px; margin-right: 4px; }
    h2 { font-family: var(--serif); font-weight: 400; font-size: 26px; line-height: 1.15; margin: 4px 0 8px; letter-spacing: -.3px; }
    .resumen { color: var(--muted); margin: 0 0 22px; font-size: 15px; }

    /* ---------- Maqueta (carrusel de fotogramas) ---------- */
    .stage { margin: 0 -16px; padding: 0 16px; display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory;
      scrollbar-width: none; padding-bottom: 4px; }
    .stage::-webkit-scrollbar { display: none; }
    .frame { flex: none; scroll-snap-align: start; position: relative; overflow: hidden; border-radius: 6px;
      background: #000; border: 1px solid var(--line2); display: flex; flex-direction: column; justify-content: center;
      padding: 22px; color: #fff; }
    .r45 { width: 264px; height: 330px; }
    .r11 { width: 290px; height: 290px; }
    .r916 { width: 216px; height: 384px; padding: 20px 18px; }
    .frame.white { background: #f4f4f2; color: #000; border-color: #f4f4f2; }
    .frame.white .k, .frame.white .foot { color: #6b6b68; }
    .frame .k { position: absolute; top: 18px; left: 22px; right: 22px; font-size: 9.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
    .frame .foot { position: absolute; bottom: 14px; left: 22px; right: 22px; font-size: 9.5px; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--dim); display: flex; justify-content: space-between; }
    .frame .big { font-family: var(--serif); font-size: 27px; line-height: 1.15; letter-spacing: -.3px; }
    .frame .mid { font-family: var(--serif); font-size: 20px; line-height: 1.22; }
    .frame .sm { font-size: 12px; line-height: 1.45; color: #bdbdba; margin-top: 12px; }
    .frame.white .sm { color: #444; }
    .frame .huge { font-family: var(--serif); font-size: 64px; line-height: 1; letter-spacing: -2px; }
    .err { text-decoration: underline wavy var(--red); text-decoration-thickness: 1.5px; text-underline-offset: 5px; }
    .tach { text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 2px; color: #777; }
    .red { color: var(--red); }
    .center { text-align: center; }
    .list { list-style: none; margin: 0; padding: 0; font-size: 12.5px; }
    .list li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid #222; }
    .frame.white .list li { border-color: #ddd; }
    .list li span:last-child { color: #8b8b88; }
    .btnfake { margin-top: 16px; display: inline-block; border: 1px solid currentColor; border-radius: 999px; padding: 7px 14px;
      font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; }
    .swipe { position: absolute; right: 16px; bottom: 34px; font-size: 10px; letter-spacing: 1.5px; color: var(--dim); text-transform: uppercase; }

    /* Opciones / quiz tocables */
    .quiz { display: grid; gap: 7px; margin-top: 14px; }
    .quiz .opt { border: 1px solid #3a3a3a; border-radius: 8px; padding: 8px 11px; font-size: 13.5px; cursor: pointer;
      background: rgba(255,255,255,.03); color: inherit; text-align: left; font-family: var(--serif); display: flex; justify-content: space-between; }
    .quiz .opt .pct { font-family: var(--sans); font-size: 11px; color: var(--muted); }
    .quiz.done .opt.ok { border-color: #fff; background: #fff; color: #000; }
    .quiz.done .opt.ko.picked { border-color: var(--red); color: var(--red); }
    .quiz.two { grid-template-columns: 1fr 1fr; }
    .quiz.two .opt { justify-content: center; font-family: var(--sans); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; font-size: 12px; }
    .sticker { background: #fff; color: #000; border-radius: 12px; padding: 12px; margin-top: 14px; }
    .sticker .q { font-weight: 700; font-size: 13px; text-align: center; margin-bottom: 8px; }
    .sticker .quiz .opt { border-color: #ddd; background: #f3f3f3; font-family: var(--sans); }
    .sticker .quiz.done .opt.ok { background: #000; color: #fff; border-color: #000; }
    .slider { height: 6px; border-radius: 3px; background: linear-gradient(90deg, #ddd, #000); margin: 10px 4px 4px; position: relative; }
    .slider::after { content: "✍️"; position: absolute; left: 72%; top: -11px; font-size: 18px; }

    /* Chrome de vídeo / story */
    .rail { position: absolute; right: 9px; bottom: 62px; display: grid; gap: 12px; text-align: center; font-size: 9px; color: #ddd; }
    .rail i { display: block; font-style: normal; font-size: 17px; filter: grayscale(1) brightness(1.6); }
    .bars { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 3px; }
    .bars span { flex: 1; height: 2px; background: rgba(255,255,255,.3); border-radius: 1px; }
    .bars span.on { background: #fff; }
    .vcap { position: absolute; left: 14px; right: 50px; bottom: 16px; font-size: 10.5px; line-height: 1.35; color: #ddd; }
    .vcap b { color: #fff; }
    .tc { position: absolute; top: 14px; right: 14px; font: 600 10px var(--sans); background: rgba(255,255,255,.12); padding: 2px 7px; border-radius: 4px; }
    .scene { font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--red); margin-bottom: 10px; }
    .cartel { background: #f4f4f2; color: #111; padding: 14px 12px; font: 700 17px/1.2 "Marker Felt", "Comic Sans MS", var(--sans); transform: rotate(-2deg); text-align: center; border-radius: 2px; }
    .fbpost { width: 300px; height: auto; min-height: 300px; padding: 0; justify-content: flex-start; background: #0b0b0b; }
    .fbhead { display: flex; gap: 8px; align-items: center; padding: 12px 14px 8px; font-size: 12px; }
    .fbhead .av { width: 28px; height: 28px; border-radius: 50%; background: #fff; color: #000; font: 700 11px var(--serif); display: grid; place-items: center; }
    .fbhead small { display: block; color: var(--dim); font-size: 10px; }
    .fbtext { padding: 0 14px 10px; font-size: 13px; color: #ddd; }
    .fbbg { background: #f4f4f2; color: #000; min-height: 190px; display: grid; place-items: center; padding: 22px; font: 400 23px/1.2 var(--serif); text-align: center; }
    .fbactions { display: flex; justify-content: space-around; border-top: 1px solid #222; padding: 9px 0; font-size: 11px; color: var(--muted); margin-top: auto; }
    .fbpoll { padding: 0 14px 12px; }

    .dots { display: flex; gap: 5px; justify-content: center; margin-top: 12px; }
    .dots span { width: 5px; height: 5px; border-radius: 50%; background: var(--line2); transition: background .2s; }
    .dots span.on { background: var(--text); }
    .hint { text-align: center; color: var(--dim); font-size: 11.5px; margin-top: 6px; }

    /* ---------- Texto explicativo ---------- */
    .cols { display: grid; gap: 22px; margin-top: 26px; }
    @media (min-width: 600px) { .cols { grid-template-columns: 1fr 1fr; } }
    h3 { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); font-weight: 500; margin: 0 0 8px; }
    ol, ul.plain { margin: 0; padding-left: 18px; font-size: 14.5px; }
    ol li, ul.plain li { margin-bottom: 6px; }
    ol li::marker { color: var(--dim); font-family: var(--serif); }
    .box { border: 1px solid var(--line2); border-radius: 6px; padding: 14px 16px; margin-top: 22px; }
    .box p { margin: 0; font-size: 14px; }
    .caption { font-family: var(--serif); font-size: 15.5px; white-space: pre-line; color: #e2e2df; }
    .kpis { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 18px; font-size: 13px; color: var(--muted); }
    .kpis b { color: var(--text); font-weight: 500; }

    .votos { display: flex; gap: 10px; margin-top: 22px; align-items: center; }
    .votos button { background: none; border: 1px solid var(--line2); color: var(--text); border-radius: 999px; padding: 8px 16px;
      font: 500 13px var(--sans); cursor: pointer; }
    .votos button.on { background: var(--text); color: #000; border-color: var(--text); }
    .votos button:disabled { opacity: .5; cursor: default; }
    .votos .tot { color: var(--dim); font-size: 12px; margin-left: auto; }

    /* ---------- Estrategia ---------- */
    section.est h2 { margin-top: 34px; }
    section.est p { color: #cfcfcc; font-size: 15px; }
    .regla { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 16px 0; border-bottom: 1px solid var(--line); }
    .regla .n { font-family: var(--serif); font-size: 24px; color: var(--dim); line-height: 1; }
    .regla b { font-weight: 500; display: block; margin-bottom: 2px; }
    .regla span { color: var(--muted); font-size: 14px; }
    .funnel { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin: 18px 0; }
    .funnel div { background: var(--bg); padding: 14px 16px; display: grid; grid-template-columns: 90px 1fr; gap: 12px; font-size: 14px; }
    .funnel div b { font-family: var(--serif); font-weight: 400; font-size: 16px; }
    .funnel div span { color: var(--muted); }
    table.cal { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 12px; }
    table.cal td, table.cal th { text-align: left; padding: 9px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
    table.cal th { font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); font-weight: 500; }
    table.cal td:first-child { color: var(--muted); white-space: nowrap; }

    footer.build { text-align: center; color: var(--dim); font-size: 11px; margin-top: 40px; font-family: ui-monospace, monospace; }
    .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #fff; color: #000; padding: 9px 16px;
      border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="marca"><b>Ortografía 10</b> · redes</div>
      <h1>Ideas de publicaciones <em>para una cuenta de ortografía</em></h1>
      <p class="lead">Cada idea trae su maqueta (desliza y toca las opciones), cómo producirla, por qué se comparte y cómo lleva a la gente a la app. Marca las que te gusten.</p>
    </header>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <main id="main"></main>
    <footer class="build"><a href="../">Train</a> · build __BUILD_ID__</footer>
  </div>
  <div class="toast" id="toast"></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
      navigator.serviceWorker.addEventListener("message", (e) => { if (e.data && e.data.type === "new-version") location.reload(); });
    }
  </script>
</body>
</html>

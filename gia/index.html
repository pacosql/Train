<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GIA · Entrenador</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#23285c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GIA" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f2f2f7; --surface: #fff; --surface-2: #e9e9f2; --text: #171a2b; --text-2: #5d6178;
      --line: #dcdce8; --accent: #2f3a8f; --accent-2: #dfe2ff; --ok: #138a52; --ko: #cc3b3b; --warn: #c98a0b;
      --stage: #dde2ec; --btn-a: #3d5a80; --btn-b: #263c5c; --card: #fff; --glyph: #1d3f72;
      --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1020; --surface: #1a1b30; --surface-2: #25274a; --text: #eceefa; --text-2: #9ea2c0;
        --line: #2c2f55; --accent: #9aa6ff; --accent-2: #2b3170; --ok: #3fcf8a; --ko: #ff7b7b; --warn: #f2b938;
        --stage: #262b3d; --btn-a: #4a6a96; --btn-b: #2c4466; --card: #f4f4fb; --glyph: #1d3f72;
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .wrap { max-width: 820px; margin: 0 auto; padding: calc(12px + var(--safe-top)) 16px calc(40px + var(--safe-bottom)); }
    h1 { font-size: 21px; margin: 4px 0 12px; display: flex; align-items: center; gap: 8px; }
    h1 .back { margin-left: auto; }
    h2 { font-size: 17px; margin: 18px 0 8px; }
    h3 { font-size: 15px; margin: 12px 0 6px; }
    p { line-height: 1.45; }
    .muted { color: var(--text-2); font-size: 13px; }
    .num { font-variant-numeric: tabular-nums; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin: 10px 0; }
    .hero { background: linear-gradient(135deg, #23285c, #3b4bb0); color: #fff; border: 0; }
    .hero .muted { color: #cfd3ff; }
    .hero b.big { font-size: 34px; display: block; line-height: 1.1; margin: 4px 0; }
    .grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    button, .btn { font: inherit; border: 0; border-radius: 12px; padding: 12px 14px; cursor: pointer;
      background: var(--surface-2); color: var(--text); text-align: left; }
    button.primary { background: var(--accent); color: #fff; font-weight: 600; }
    @media (prefers-color-scheme: dark) { button.primary { color: #11142e; } }
    button.big { display: block; width: 100%; padding: 16px; font-size: 16px; margin: 8px 0; }
    button.big small { display: block; font-weight: 400; opacity: .8; font-size: 13px; margin-top: 2px; }
    button.link { background: none; padding: 6px 8px; color: var(--accent); }
    button:disabled { opacity: .5; cursor: default; }
    .task-btn { display: flex; flex-direction: column; gap: 4px; }
    .task-btn .e { font-size: 22px; }
    .task-btn .p { font-size: 12px; color: var(--text-2); }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--accent-2); color: var(--accent); }
    .pill.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
    .pill.ko { background: color-mix(in srgb, var(--ko) 18%, transparent); color: var(--ko); }
    .pill.warn { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .spacer { flex: 1; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    td, th { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: left; }
    th { color: var(--text-2); font-weight: 600; }
    .hidden { display: none !important; }
    ul.tips { padding-left: 18px; margin: 6px 0; } ul.tips li { margin: 4px 0; line-height: 1.4; }
    label.chk { display: flex; gap: 8px; align-items: center; font-size: 14px; margin: 8px 0; }

    /* ---- Escenario de práctica ---- */
    #juego { position: fixed; inset: 0; background: var(--bg); z-index: 10; display: flex; flex-direction: column; }
    .topbar { display: flex; align-items: center; gap: 10px; padding: calc(8px + var(--safe-top)) 14px 8px; }
    .topbar .t { font-weight: 700; }
    .timer { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; flex: 1; }
    .timer > div { height: 100%; background: var(--accent); width: 100%; transition: width .25s linear; }
    .clock { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 44px; text-align: right; }
    .stage-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 12px; }
    .stage { background: var(--stage); border-radius: 6px; width: min(640px, 100%); min-height: 330px; padding: 26px 18px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; position: relative; user-select: none; }
    .stage.flash-ok { box-shadow: 0 0 0 4px var(--ok); }
    .stage.flash-ko { box-shadow: 0 0 0 4px var(--ko); }
    .stmt { background: #fff; color: #1b4f86; border-radius: 6px; padding: 26px 18px; width: min(440px, 100%); text-align: center; font-weight: 700; font-size: 19px; }
    .gbtns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .gbtn { background: var(--btn-a); color: #fff; border-radius: 3px; min-width: 64px; padding: 14px 18px;
      font-size: 22px; text-align: center; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
    .gbtn:active { filter: brightness(1.25); }
    .gbtn:disabled { pointer-events: none; opacity: .75; }
    .gbtn.blank { min-width: 120px; height: 58px; }
    .gbtn.word { min-width: 150px; font-size: 19px; padding: 18px 14px; }
    .gbtn.name { min-width: 120px; font-size: 19px; }
    .gbtn.numb { min-width: 120px; font-size: 22px; padding: 16px; }
    .hint { color: #1b4f86; font-size: 13px; font-weight: 600; }
    @media (prefers-color-scheme: dark) { .hint { color: #c9d3ff; } }
    .letters { display: grid; grid-template-columns: repeat(4, 64px); row-gap: 8px; text-align: center; font-size: 38px; font-weight: 700; color: #000;
      font-family: Verdana, "DejaVu Sans", Tahoma, sans-serif; }
    @media (prefers-color-scheme: dark) { .letters { color: #fff; } }
    .rcards { display: flex; gap: 18px; }
    .rcard { background: var(--card); border-radius: 4px; width: 80px; padding: 8px 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .rcard span { display: block; width: 62px; height: 62px; line-height: 62px; text-align: center; font-size: 54px; font-weight: 800; color: var(--glyph);
      font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif; }
    .feedback { min-height: 22px; font-size: 14px; text-align: center; max-width: 520px; }
    .feedback.ok { color: var(--ok); } .feedback.ko { color: var(--ko); }
    @media (prefers-color-scheme: dark) { .feedback.ok { color: #8dffc6; } .feedback.ko { color: #ffb3b3; } }
    .ribbon { position: absolute; top: 8px; left: 10px; font-size: 12px; font-weight: 700; color: #1b4f86; }
    @media (prefers-color-scheme: dark) { .ribbon { color: #c9d3ff; } }
    svg text { fill: var(--text-2); font-size: 10px; }
    .bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
    .bar > div { height: 100%; background: var(--accent); }
    .footer { text-align: center; margin-top: 30px; font-size: 11px; color: var(--text-2); }
  </style>
</head>
<body>
  <div class="wrap" id="app"></div>

  <div id="juego" class="hidden">
    <div class="topbar">
      <span class="t" id="j-titulo"></span>
      <div class="timer"><div id="j-bar"></div></div>
      <span class="clock" id="j-clock"></span>
      <button class="link" id="j-salir">Salir</button>
    </div>
    <div class="stage-wrap"><div class="stage" id="stage"></div></div>
  </div>

  <script src="config.js"></script>
  <script src="palabras.js"></script>
  <script>
  "use strict";
  const CFG = window.GIA_CONFIG;
  const BUILD = "__BUILD_ID__";
  const $app = document.getElementById("app");
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const rnd = (n) => Math.floor(Math.random() * n);
  const pick = (a) => a[rnd(a.length)];
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // ===================================================================
  // Las cinco tareas. Duraciones y curvas de percentil son ORIENTATIVAS:
  // Thomas no publica tiempos exactos ni baremos. Las curvas se anclan en
  // los dos informes de ejemplo públicos (ver guía) y la rutina horaria
  // puede recalibrarlas.
  // ===================================================================
  const TAREAS = {
    razonamiento: { nombre: "Razonamiento", emoji: "🧩", dur: 300, pen: 1, obj: 44, seg: 6,
      curva: [[0, 1], [20, 5], [30, 18], [38, 44], [44, 80], [51, 93], [58, 99]],
      instr: "Verás una frase que compara a dos personas. Léela, pulsa la pantalla y la frase desaparecerá: aparecerá una pregunta y dos nombres. Pulsa el nombre correcto.",
      tips: ["Mientras lees, quédate con UN dato: quién tiene MÁS del adjetivo de la frase.",
        "«A es menos fuerte que B» y «A no es tan fuerte como B» → el fuerte es B.",
        "Si preguntan por el contrario (débil), es el otro. Cuidado con «¿quién es MENOS…?».",
        "Los nombres de los botones no salen en el orden de la frase.",
        "Un fallo resta un acierto: medio segundo para fijar el dato compensa."] },
    perceptiva: { nombre: "Velocidad perceptiva", emoji: "🔤", dur: 120, pen: 0.25, obj: 46, seg: 2.2,
      curva: [[0, 1], [25, 3], [35.75, 13], [39, 24], [43.5, 54], [48, 72], [54, 88], [60, 96]],
      instr: "Cuatro columnas con una letra arriba y otra abajo (una fila en mayúsculas, otra en minúsculas). Cuenta en cuántas columnas es la MISMA letra y pulsa el número (0 a 4).",
      tips: ["Recorre siempre igual: de izquierda a derecha, columna a columna.",
        "Si casi todas coinciden, cuenta las que NO y resta de 4.",
        "Ojo con b/d/p/q, i/l/j, m/n, u/v, h/n.",
        "Deja el ratón sobre la fila de botones."] },
    numerica: { nombre: "Velocidad numérica", emoji: "🔢", dur: 120, pen: 0.5, obj: 16, seg: 6.5,
      curva: [[0, 1], [6, 8], [9, 20], [12, 40], [15.5, 57], [19, 85], [23, 96], [27, 99]],
      instr: "Tres números. Localiza el mayor y el menor y pulsa el que esté MÁS LEJOS del número que queda (el del medio por valor).",
      tips: ["La respuesta es siempre el mayor o el menor, nunca el del medio.",
        "Ordénalos de cabeza, calcula los dos huecos y pulsa el extremo del hueco grande.",
        "12, 3, 5 → 3·5·12, huecos 2 y 7 → 12."] },
    palabras: { nombre: "Significado de palabras", emoji: "📖", dur: 180, pen: 0.5, obj: 32, seg: 4.5,
      curva: [[0, 1], [15, 8], [22, 25], [28, 52], [34, 84], [37, 96], [41, 99]],
      instr: "Tres palabras: dos están relacionadas (sinónimos, contrarios o de la misma familia) y una sobra. Pulsa la que sobra.",
      tips: ["Los contrarios cuentan como relacionados: «arriba / abajo / calle» → calle.",
        "No busques matices: la intrusa suele ser de otro campo por completo.",
        "Primera impresión y clic."] },
    espacial: { nombre: "Visualización espacial", emoji: "🔄", dur: 120, pen: 0.5, obj: 12, seg: 7.5,
      curva: [[0, 1], [4, 5], [6.5, 15], [9, 34], [12, 72], [15, 88], [18, 96]],
      instr: "Dos tarjetas, cada una con dos R giradas. Cuenta en cuántas tarjetas el símbolo de abajo es el MISMO que el de arriba (girado), no su imagen en espejo. Pulsa 0, 1 o 2.",
      tips: ["Clasifica cada R como «normal» o «espejo»: recorre el palo recto desde el pie hasta la cabeza; si la barriga queda a tu DERECHA es normal, a tu izquierda es espejo.",
        "La tarjeta cuenta si los dos son del mismo tipo (normal-normal o espejo-espejo).",
        "Compara solo en vertical, nunca entre tarjetas."] },
  };
  const ORDEN = ["razonamiento", "perceptiva", "numerica", "palabras", "espacial"];
  // Ajustes del usuario (duraciones configurables y reloj visible). El percentil
  // siempre se calcula escalando a la duración de referencia (TAREAS[t].dur).
  const AJ_DEF = { reloj: true, dur: {} };
  const ajustes = () => { try { return { ...AJ_DEF, ...(JSON.parse(localStorage.getItem("gia_ajustes")) || {}) }; } catch (e) { return { ...AJ_DEF }; } };
  const durDe = (t) => Number(ajustes().dur[t]) || TAREAS[t].dur;

  function percentil(tarea, netaNorm) {
    const c = TAREAS[tarea].curva;
    if (netaNorm <= c[0][0]) return c[0][1];
    for (let i = 1; i < c.length; i++) {
      if (netaNorm <= c[i][0]) {
        const [x0, y0] = c[i - 1], [x1, y1] = c[i];
        return Math.round(y0 + (y1 - y0) * (netaNorm - x0) / (x1 - x0));
      }
    }
    return c[c.length - 1][1];
  }
  function banda(p) {
    if (p >= 86) return ["Alto", "ok"];
    if (p >= 66) return ["Por encima de la media", "ok"];
    if (p >= 35) return ["Media", "warn"];
    if (p >= 16) return ["Por debajo de la media", "ko"];
    return ["Bajo", "ko"];
  }

  // ===================================================================
  // Generadores de preguntas. Cada uno devuelve
  //   { s: subtipo, q: texto corto, opciones: [{v, label}], correcta: v, expl, ... }
  // El "foco" del plan sesga qué subtipos salen más (peso por subtipo).
  // ===================================================================
  const H = ["Pedro", "Pablo", "Raúl", "Iván", "Óscar", "Mario", "Jorge", "Diego", "Luis", "Hugo", "Carlos", "Javier", "Andrés", "Tomás", "Rubén", "Sergio"];
  const M = ["Alba", "Rosa", "Carmen", "Sara", "Laura", "Irene", "Nuria", "Elena", "Marta", "Ana", "Lucía", "Paula", "Eva", "Clara", "Julia", "Sonia"];
  // [positivo m, positivo f, contrario m, contrario f]
  const ADJ = [
    ["fuerte", "fuerte", "débil", "débil"], ["pesado", "pesada", "ligero", "ligera"], ["alto", "alta", "bajo", "baja"],
    ["rápido", "rápida", "lento", "lenta"], ["contento", "contenta", "triste", "triste"], ["rico", "rica", "pobre", "pobre"],
    ["joven", "joven", "viejo", "vieja"], ["feliz", "feliz", "triste", "triste"], ["listo", "lista", "torpe", "torpe"],
    ["valiente", "valiente", "miedoso", "miedosa"], ["simpático", "simpática", "antipático", "antipática"],
  ];
  function genRazonamiento(params) {
    const fem = Math.random() < 0.5;
    const [x, y] = shuffle(fem ? M : H).slice(0, 2);
    const g = fem ? 1 : 0;
    const par = pick(ADJ);
    const ladoFrase = rnd(2); // 0: adjetivo positivo, 1: contrario
    const adjF = par[ladoFrase * 2 + g], adjOtro = par[(1 - ladoFrase) * 2 + g];
    const formas = ["mas", "menos", "notan"];
    const forma = pick(formas);
    let frase, masAdj; // masAdj = quién tiene MÁS de adjF
    if (forma === "mas") { frase = `${x} es más ${adjF} que ${y}.`; masAdj = x; }
    else if (forma === "menos") { frase = `${x} es menos ${adjF} que ${y}.`; masAdj = y; }
    else { frase = `${x} no es tan ${adjF} como ${y}.`; masAdj = y; }
    const contrario = Math.random() < 0.5;
    const qMenos = Math.random() < (params.qMenos ?? 0.25);
    const adjQ = contrario ? adjOtro : adjF;
    let resp = contrario ? (masAdj === x ? y : x) : masAdj;
    if (qMenos) resp = resp === x ? y : x;
    const pregunta = `¿Quién es ${qMenos ? "menos" : "más"} ${adjQ}?`;
    const s = `${forma}-${contrario ? "contrario" : "mismo"}${qMenos ? "-qmenos" : ""}`;
    const fuerteEs = masAdj;
    const expl = `«${frase}» → más ${adjF}: ${fuerteEs}. ${contrario ? `Más ${adjOtro}: ${fuerteEs === x ? y : x}. ` : ""}${qMenos ? `Te preguntan por MENOS ${adjQ}: ${resp}.` : `Respuesta: ${resp}.`}`;
    return { s, q: `${frase} ${pregunta}`, frase, pregunta, opciones: shuffle([x, y]).map((v) => ({ v, label: v })), correcta: resp, expl };
  }

  const CONF = { b: "dpqh", d: "bpq", p: "bdq", q: "pdbg", i: "jlt", l: "ijt", j: "ilg", m: "nwh", n: "mhu", u: "vn", v: "uwy", h: "nb", c: "eoa", e: "co", o: "ac", a: "oe", g: "qy", f: "tj", t: "fi", w: "vm", y: "vg", r: "n", k: "h", x: "z", z: "x", s: "z" };
  const LET = "abcdefghijklmnopqrstuvwxyz";
  function genPerceptiva(params) {
    const k = rnd(5);
    const pos = shuffle([0, 1, 2, 3]).slice(0, k);
    const top = shuffle(LET.split("")).slice(0, 4);
    const bot = top.map((l, i) => {
      if (pos.includes(i)) return l;
      let cand;
      for (let t = 0; t < 20; t++) {
        cand = Math.random() < (params.confusables ?? 0.5) && CONF[l] ? pick(CONF[l].split("")) : pick(LET.split(""));
        // I mayúscula y l minúscula son indistinguibles en sans-serif: nunca en la misma columna.
        if (cand !== l && !((l === "i" && cand === "l") || (l === "l" && cand === "i"))) break;
      }
      return cand;
    });
    const upTop = Math.random() < 0.5;
    const a = top.map((c) => (upTop ? c.toUpperCase() : c)), b = bot.map((c) => (upTop ? c : c.toUpperCase()));
    const conf = top.some((l, i) => !pos.includes(i) && CONF[l] && CONF[l].includes(bot[i]));
    const x = top.map((l, i) => (pos.includes(i) ? null : `${l}/${bot[i]}`)).filter(Boolean).join(",");
    return { s: `n${k}`, conf, x, q: `${a.join("")}/${b.join("")}`, arriba: a, abajo: b,
      opciones: [0, 1, 2, 3, 4].map((v) => ({ v, label: String(v) })), correcta: k,
      expl: `Coinciden ${k}: ${a.map((c, i) => (pos.includes(i) ? `${c}${b[i]}✓` : `${c}${b[i]}✗`)).join(" ")}` };
  }

  function genNumerica(params) {
    // Menor entre 1 y 40, dos huecos distintos entre 1 y 12, sin empates.
    const [lo, hi] = params.rango || [1, 40];
    const maxH = params.maxHueco || 12;
    for (;;) {
      const a = lo + rnd(hi - lo + 1), g1 = 1 + rnd(maxH), g2 = 1 + rnd(maxH);
      if (g1 === g2) continue;
      const m = a + g1, z = m + g2;
      const ns = shuffle([a, m, z]);
      const resp = g2 > g1 ? z : a;
      const dif = Math.abs(g1 - g2);
      return { s: `${resp === z ? "mayor" : "menor"}-d${dif >= 3 ? 3 : dif}`, x: `huecos ${Math.min(g1, g2)}/${Math.max(g1, g2)}`, q: ns.join(" "), nums: ns,
        opciones: ns.map((v) => ({ v, label: String(v) })), correcta: resp,
        expl: `Orden ${a}·${m}·${z}. Huecos: ${a}→${m} = ${g1}, ${m}→${z} = ${g2}. Más lejos: ${resp}.` };
    }
  }

  let BANCO = (window.GIA_PALABRAS || []).map(([a, b, intruso, relacion, nivel]) => ({ a, b, intruso, relacion, nivel: nivel || 1 }));
  const usadas = new Set();
  function genPalabras() {
    let w;
    for (let t = 0; t < 30; t++) { w = pick(BANCO); if (!usadas.has(w.intruso + w.a)) break; }
    usadas.add(w.intruso + w.a);
    if (usadas.size > BANCO.length * 0.8) usadas.clear();
    const rel = { sin: "significan lo mismo", ant: "son contrarios", fam: "son de la misma familia" }[w.relacion] || "están relacionadas";
    return { s: w.relacion, x: `nivel ${w.nivel || 1}`, q: `${w.a} · ${w.b} · ${w.intruso}`, palabra: w.intruso,
      opciones: shuffle([w.a, w.b, w.intruso]).map((v) => ({ v, label: v })), correcta: w.intruso,
      expl: `«${w.a}» y «${w.b}» ${rel}; sobra «${w.intruso}».` };
  }

  function genEspacial() {
    const cards = [0, 1].map(() => {
      const m1 = Math.random() < 0.5, r1 = pick([0, 90, 180, 270]);
      const same = Math.random() < 0.5;
      const m2 = same ? m1 : !m1;
      let r2 = pick([0, 90, 180, 270]);
      if (r2 === r1) r2 = (r1 + pick([90, 180, 270])) % 360;
      return { top: { m: m1, r: r1 }, bot: { m: m2, r: r2 }, same };
    });
    const k = cards.filter((c) => c.same).length;
    const espejos = cards.some((c) => c.same && c.top.m);
    const tipo = (g) => (g.m ? "espejo" : "normal");
    const x = cards.map((c) => `${tipo(c.top)}-${tipo(c.bot)} ${(c.bot.r - c.top.r + 360) % 360}°`).join(", ");
    return { s: `n${k}${espejos ? "-ee" : ""}`, x, q: cards.map((c) => `${tipo(c.top)}${c.top.r}/${tipo(c.bot)}${c.bot.r}`).join(" | "), cards,
      opciones: [0, 1, 2].map((v) => ({ v, label: String(v) })), correcta: k,
      expl: cards.map((c, i) => `Tarjeta ${i + 1}: ${tipo(c.top)} / ${tipo(c.bot)} → ${c.same ? "igual" : "distinta"}`).join(" · ") };
  }

  const GEN = { razonamiento: genRazonamiento, perceptiva: genPerceptiva, numerica: genNumerica, palabras: genPalabras, espacial: genEspacial };
  // Sesgo por subtipo: genera varios candidatos y elige con peso = foco[subtipo] (1 por defecto).
  function generar(tarea, foco, params) {
    const f = foco || {};
    if (!Object.keys(f).length) return GEN[tarea](params || {});
    const cands = Array.from({ length: 6 }, () => GEN[tarea](params || {}));
    const pesos = cands.map((c) => f[c.s] ?? f[c.s.split("-")[0]] ?? 1);
    let r = Math.random() * pesos.reduce((a, b) => a + b, 0);
    for (let i = 0; i < cands.length; i++) { r -= pesos[i]; if (r <= 0) return cands[i]; }
    return cands[0];
  }

  const ETIQUETAS = {
    "mas-mismo": "«A es más X que B», preguntan X", "mas-contrario": "«A es más X que B», preguntan el contrario",
    "menos-mismo": "«A es menos X que B», preguntan X", "menos-contrario": "«A es menos X que B», preguntan el contrario",
    "notan-mismo": "«A no es tan X como B», preguntan X", "notan-contrario": "«A no es tan X como B», preguntan el contrario",
    "mayor-d1": "Gana el mayor, huecos que difieren en 1", "menor-d1": "Gana el menor, huecos que difieren en 1",
    "mayor-d2": "Gana el mayor, huecos que difieren en 2", "menor-d2": "Gana el menor, huecos que difieren en 2",
    "mayor-d3": "Gana el mayor, huecos claros (3+)", "menor-d3": "Gana el menor, huecos claros (3+)",
    sin: "Sinónimos", ant: "Contrarios", fam: "Misma familia",
  };
  function etiqueta(tarea, s) {
    if (tarea === "razonamiento") { const base = s.replace("-qmenos", ""); return (ETIQUETAS[base] || s) + (s.includes("qmenos") ? " (con «¿quién es menos…?»)" : ""); }
    if (tarea === "perceptiva") return `Respuesta ${s.slice(1)} coincidencias`;
    if (tarea === "espacial") return `Respuesta ${s[1]}${s.includes("ee") ? " (con pareja espejo-espejo)" : ""}`;
    return ETIQUETAS[s] || s;
  }

  // ===================================================================
  // Datos: Supabase (REST con la anon key) + cola local si no hay red.
  // ===================================================================
  async function sb(path, opts = {}) {
    const r = await fetch(`${CFG.url}/rest/v1/${path}`, { ...opts,
      headers: { apikey: CFG.anonKey, Authorization: `Bearer ${CFG.anonKey}`, "Content-Type": "application/json", ...(opts.headers || {}) } });
    if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
    const t = await r.text();
    return t ? JSON.parse(t) : null;
  }
  const LS = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
  let SESIONES = LS.get("gia_cache_sesiones", []);
  let PLAN = LS.get("gia_cache_plan", null);

  async function guardarSesion(r) {
    const { _items, ...ses } = r;
    const cola = LS.get("gia_pendientes", []);
    cola.push(ses); LS.set("gia_pendientes", cola);
    SESIONES.unshift({ ...ses, created_at: new Date().toISOString(), _local: true });
    await vaciarCola();
  }
  async function vaciarCola() {
    const cola = LS.get("gia_pendientes", []);
    if (!cola.length) return true;
    try {
      await sb("gia_sesiones", { method: "POST", body: JSON.stringify(cola), headers: { Prefer: "return=minimal" } });
      LS.set("gia_pendientes", []);
      return true;
    } catch (e) { console.warn("Sin conexión, se guardará luego", e); return false; }
  }
  async function cargarDatos() {
    await vaciarCola();
    try {
      const [ses, plan, pal] = await Promise.all([
        sb("gia_sesiones?select=*&order=created_at.desc&limit=400"),
        sb("gia_plan?select=*&order=created_at.desc&limit=1"),
        sb("gia_palabras?select=a,b,intruso,relacion,nivel&activo=eq.true&limit=5000"),
      ]);
      SESIONES = ses || []; PLAN = (plan && plan[0]) || null;
      if (pal && pal.length > 50) BANCO = pal;
      LS.set("gia_cache_sesiones", SESIONES.map((s) => ({ ...s, detalle: undefined })));
      LS.set("gia_cache_plan", PLAN);
      return true;
    } catch (e) { console.warn(e); return false; }
  }

  // ===================================================================
  // Estadísticas
  // ===================================================================
  const cronometradas = () => SESIONES.filter((s) => s.modo !== "aprendizaje");
  function estadoTarea(t) {
    const ss = cronometradas().filter((s) => s.tarea === t);
    const ult = ss.slice(0, 3);
    if (!ult.length) return null;
    const p = Math.round(ult.reduce((a, s) => a + s.percentil, 0) / ult.length);
    const ac = ult.reduce((a, s) => a + s.correctas, 0), fa = ult.reduce((a, s) => a + s.fallos, 0);
    const prev = ss.slice(3, 6);
    const pPrev = prev.length ? Math.round(prev.reduce((a, s) => a + s.percentil, 0) / prev.length) : null;
    return { p, precision: ac + fa ? ac / (ac + fa) : 0, n: ss.length, tendencia: pPrev == null ? 0 : p - pPrev, ult: ss[0] };
  }
  function estimacionGlobal() {
    const e = ORDEN.map(estadoTarea);
    if (e.some((x) => !x)) return null;
    return { p: Math.round(e.reduce((a, x) => a + x.p, 0) / 5), porTarea: e };
  }
  function puntosDebiles(n = 6) {
    const agg = {};
    for (const s of SESIONES.slice(0, 60)) for (const it of s.detalle || []) {
      const k = `${s.tarea}|${it.s}`; agg[k] ??= { tarea: s.tarea, s: it.s, n: 0, ko: 0, ms: 0 };
      agg[k].n++; if (!it.ok) agg[k].ko++; agg[k].ms += it.ms;
    }
    return Object.values(agg).filter((a) => a.n >= 4 && a.ko > 0).map((a) => ({ ...a, tasa: a.ko / a.n }))
      .sort((a, b) => b.tasa - a.tasa).slice(0, n);
  }
  // Fallos concretos de las últimas sesiones: parejas de letras, giros, tríos de palabras.
  function fallosConcretos() {
    const cuenta = (arr) => Object.entries(arr.reduce((m, k) => ((m[k] = (m[k] || 0) + 1), m), {})).sort((a, b) => b[1] - a[1]);
    const pares = [], giros = [], pal = [], num = [];
    for (const s of SESIONES.slice(0, 60)) for (const it of s.detalle || []) {
      if (it.ok || !it.x) continue;
      if (s.tarea === "perceptiva") it.x.split(",").forEach((p) => pares.push(p));
      if (s.tarea === "espacial") it.x.split(", ").forEach((g) => giros.push(g));
      if (s.tarea === "palabras") pal.push(`${it.q} (pusiste «${it.r}»)`);
      if (s.tarea === "numerica") num.push(it.x);
    }
    if (!pares.length && !giros.length && !pal.length && !num.length) return "";
    const lista = (t, xs, n = 8) => xs.length ? `<h3>${t}</h3><div class="muted">${xs.slice(0, n).map(([k, c]) => `${esc(k)} ×${c}`).join(" · ")}</div>` : "";
    return `<h2>Fallos concretos</h2><div class="card">
      ${lista("🔤 Parejas no coincidentes en preguntas falladas", cuenta(pares))}
      ${lista("🔢 Huecos en preguntas falladas", cuenta(num))}
      ${lista("🔄 Combinaciones de tarjetas (tipo arriba-abajo, giro) en preguntas falladas", cuenta(giros))}
      ${pal.length ? `<h3>📖 Tríos fallados</h3><ul class="tips">${[...new Set(pal)].slice(0, 15).map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    </div>`;
  }
  function hace(ts) {
    const min = Math.round((Date.now() - Date.parse(ts)) / 60000);
    if (min < 2) return "hace un momento"; if (min < 60) return `hace ${min} min`;
    const h = Math.round(min / 60); if (h < 24) return `hace ${h} h`;
    return new Date(ts).toLocaleDateString("es-ES", { day: "numeric", month: "short" });
  }

  function lineChart(puntos, w = 320, h = 90) {
    if (puntos.length < 2) return `<div class="muted">Necesitas al menos 2 sesiones para ver la evolución.</div>`;

    const path = puntos.map((p, i) => `${i ? "L" : "M"}${xs(i).toFixed(1)},${ys(p).toFixed(1)}`).join(" ");
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w * 1.6}px">

      ${puntos.map((p, i) => `<circle cx="${xs(i)}" cy="${ys(p)}" r="2.5" fill="var(--accent)"/>`).join("")}

  }

          <div class="muted">Última: ${e.ult.correctas} bien, ${e.ult.fallos} mal en ${fmt(e.ult.usado_s)} · ${e.ult.ms_medio ? (e.ult.ms_medio / 1000).toFixed(1) + " s por pregunta" : ""}</div>` : ""}</div>`; }).join("")}
      <h2>Dónde fallas más</h2>
      <div class="card">${deb.length ? `<table><tr><th>Tarea</th><th>Tipo de pregunta</th><th>Fallos</th></tr>
        ${deb.map((d) => `<tr><td>${TAREAS[d.tarea].emoji}</td><td>${esc(etiqueta(d.tarea, d.s))}</td><td class="num">${d.ko}/${d.n} (${Math.round(d.tasa * 100)} %)</td></tr>`).join("")}</table>`
        : `<div class="muted">Aún no hay fallos suficientes para detectar patrones.</div>`}</div>
      ${fallosConcretos()}
      <h2>Historial</h2>
      <div class="card"><table><tr><th>Cuándo</th><th>Tarea</th><th>Modo</th><th>Bien/mal</th><th>P</th></tr>
        ${ses.slice(0, 60).map((s) => `<tr><td>${hace(s.created_at)}</td><td>${TAREAS[s.tarea]?.emoji || ""} ${TAREAS[s.tarea]?.nombre || s.tarea}</td><td>${s.modo}</td>
          <td class="num">${s.correctas}/${s.fallos}</td><td class="num">${s.modo === "aprendizaje" ? "—" : s.percentil}</td></tr>`).join("") || `<tr><td colspan="5" class="muted">Sin sesiones</td></tr>`}</table></div>`;
    $app.querySelector("#b-back").onclick = pantallaInicio;
    window.scrollTo(0, 0);
  }

  // ===================================================================
  // Motor de juego
  // ===================================================================
  function iniciarSecuencia(modo, tareas, plan) {
    const pasos = tareas.map((t) => ({
      tarea: t, modo,
      dur: modo === "simulacro" ? durDe(t) : (plan?.duraciones?.[t] || plan?.duracion_s || durDe(t)),
      ejemplos: modo === "simulacro", feedback: modo === "plan" ? !!plan?.feedback : false,
      foco: plan?.foco?.[t] || null, params: plan?.params?.[t] || null,
    }));
    correrSecuencia(pasos, modo === "simulacro" ? `sim-${Date.now().toString(36)}` : null);
  }

  let JUEGO = null;
  const $j = document.getElementById("juego"), $stage = document.getElementById("stage");
  document.getElementById("j-salir").onclick = () => {
    if (!confirm("¿Salir? Esta ronda no se guardará.")) return;
    terminarJuego(true);
  };

  async function correrSecuencia(pasos, simId) {
    const resultados = [];
    for (let i = 0; i < pasos.length; i++) {
      const p = pasos[i];
      const ok = await pantallaIntro(p, i, pasos.length);
      if (!ok) { pantallaInicio(); return; }
      if (p.ejemplos) {
        const r = await jugar({ ...p, practica: true, dur: 0, maxItems: 8, feedback: true });
        if (!r) { pantallaInicio(); return; }
        const go = await pantallaMensaje(`Ejemplos terminados: ${r.correctas}/8 bien.`, "Ahora empieza la parte cronometrada. Recuerda: rápido y preciso.", "Empezar");
        if (!go) { pantallaInicio(); return; }
      }
      const r = await jugar(p);
      if (!r) { pantallaInicio(); return; }
      r.simulacro_id = simId;
      await guardarSesion(r);
      resultados.push(r);
    }
    pantallaResultados(resultados, simId);
    cargarDatos();
  }

  function pantallaIntro(p, i, n) {
    const T = TAREAS[p.tarea];
    return new Promise((res) => {
      $j.classList.add("hidden");
      $app.innerHTML = `
        <h1>${T.emoji} ${T.nombre} ${n > 1 ? `<span class="muted">· tarea ${i + 1} de ${n}</span>` : ""}<button class="link back" id="b-back">Cancelar</button></h1>
        <div class="card"><p style="margin-top:0">${esc(T.instr)}</p><ul class="tips">${T.tips.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>
        ${p.foco && Object.keys(p.foco).length ? `<div class="card"><b>🎯 Foco de esta ronda</b><ul class="tips">${Object.entries(p.foco).filter(([, w]) => w > 1).map(([s]) => `<li>${esc(etiqueta(p.tarea, s))}</li>`).join("")}</ul></div>` : ""}
        <button class="big primary" id="b-go">${p.ejemplos ? "Hacer los 8 ejemplos" : p.dur ? `Empezar · ${fmt(p.dur)}` : "Empezar"}</button>`;
      $app.querySelector("#b-go").onclick = () => res(true);
      $app.querySelector("#b-back").onclick = () => res(false);
      window.scrollTo(0, 0);
    });
  }
  function pantallaMensaje(titulo, texto, boton) {
    return new Promise((res) => {
      $j.classList.add("hidden");
      $app.innerHTML = `<div class="card" style="margin-top:30px"><h2 style="margin-top:0">${esc(titulo)}</h2><p>${esc(texto)}</p>
        <button class="big primary" id="b-go">${esc(boton)}</button><button class="link" id="b-no">Cancelar</button></div>`;
      $app.querySelector("#b-go").onclick = () => res(true);
      $app.querySelector("#b-no").onclick = () => res(false);
    });
  }

  function jugar(p) {
    return new Promise((resolve) => {
      const T = TAREAS[p.tarea];
      JUEGO = { p, resolve, items: [], vistos: new Set(), t0: performance.now(), tItem: 0, timer: null, done: false, cur: null };
      document.getElementById("j-titulo").textContent = `${T.emoji} ${p.practica ? "Ejemplos" : T.nombre}`;
      $j.classList.remove("hidden");
      const bar = document.getElementById("j-bar"), clock = document.getElementById("j-clock");
      document.querySelector(".timer").style.visibility = clock.style.visibility = p.dur && !ajustes().reloj ? "hidden" : "visible";
      if (p.dur) {
        JUEGO.timer = setInterval(() => {
          const el = (performance.now() - JUEGO.t0) / 1000, rest = p.dur - el;
          bar.style.width = `${Math.max(0, (rest / p.dur) * 100)}%`;
          clock.textContent = fmt(rest);
          if (rest <= 0) terminarJuego(false);
        }, 200);
        bar.style.width = "100%"; clock.textContent = fmt(p.dur);
      } else { bar.style.width = "0%"; clock.textContent = p.maxItems ? `0/${p.maxItems}` : ""; }
      siguiente();
    });
  }

  function siguiente() {
    const J = JUEGO; if (!J || J.done) return;
    const p = J.p;
    if (p.maxItems && J.items.length >= p.maxItems) return terminarJuego(false);
    if (!p.dur && p.maxItems) document.getElementById("j-clock").textContent = `${J.items.length + 1}/${p.maxItems}`;
    let it;
    for (let t = 0; t < 12; t++) { it = generar(p.tarea, p.foco, p.params); if (!J.vistos.has(it.q)) break; }
    J.vistos.add(it.q);
    J.cur = it; J.tItem = performance.now();
    $stage.className = "stage";
    const ribbon = p.practica ? `<div class="ribbon">EJEMPLO ${J.items.length + 1} de ${p.maxItems}</div>` : "";
    const fb = `<div class="feedback" id="fb"></div>`;
    const botones = (cls) => `<div class="gbtns">${it.opciones.map((o, i) => `<button class="gbtn ${cls}" data-i="${i}">${esc(o.label)}</button>`).join("")}</div>`;
    if (p.tarea === "razonamiento") {
      $stage.innerHTML = `${ribbon}<div class="stmt">${esc(it.frase)}</div><div class="gbtns"><span class="gbtn blank"></span><span class="gbtn blank"></span></div>
        <div class="hint">Pulsa la pantalla cuando estés listo</div>${fb}`;
      $stage.onclick = () => {
        $stage.onclick = null;
        $stage.innerHTML = `${ribbon}<div class="stmt">${esc(it.pregunta)}</div>${botones("name")}<div class="hint">&nbsp;</div>${fb}`;
        enlazar(it);
      };
      return;
    }
    $stage.onclick = null;
    let cuerpo = "";
    if (p.tarea === "perceptiva") cuerpo = `<div class="letters">${it.arriba.map((c) => `<div>${esc(c)}</div>`).join("")}${it.abajo.map((c) => `<div>${esc(c)}</div>`).join("")}</div>${botones("")}`;
    if (p.tarea === "numerica") cuerpo = botones("numb");
    if (p.tarea === "palabras") cuerpo = botones("word");
    if (p.tarea === "espacial") {
      const g = (x) => `<span style="transform: rotate(${x.r}deg)${x.m ? " scaleX(-1)" : ""}">R</span>`;
      cuerpo = `<div class="rcards">${it.cards.map((c) => `<div class="rcard">${g(c.top)}${g(c.bot)}</div>`).join("")}</div>${botones("")}`;
    }
    $stage.innerHTML = ribbon + cuerpo + fb;
    enlazar(it);
  }

  function enlazar(it) {
    $stage.querySelectorAll(".gbtn[data-i]").forEach((b) => (b.onclick = (ev) => {
      ev.stopPropagation();
      responder(it, it.opciones[+b.dataset.i].v);
    }));
  }

  function responder(it, v) {
    const J = JUEGO; if (!J || J.done || J.cur !== it) return;
    const ok = v === it.correcta;
    const ms = Math.round(performance.now() - J.tItem);
    J.items.push({ s: it.s, x: it.x, ok, ms, q: it.q, r: String(v), c: String(it.correcta), expl: it.expl });
    J.cur = null;
    if (J.p.feedback) {
      $stage.classList.add(ok ? "flash-ok" : "flash-ko");
      const fb = document.getElementById("fb");
      if (fb) { fb.className = `feedback ${ok ? "ok" : "ko"}`; fb.textContent = ok ? `✓ Correcto${J.p.aprender || J.p.practica ? " · " + it.expl : ""}` : `✗ ${it.expl}`; }
      $stage.querySelectorAll(".gbtn").forEach((b) => (b.disabled = true));
      const espera = J.p.aprender || J.p.practica ? (ok ? 1100 : 2600) : ok ? 250 : 1400;
      if (J.p.aprender || J.p.practica) {
        // Sin reloj: pulsar para continuar o esperar.
        const t = setTimeout(siguiente, espera);
        $stage.onclick = () => { clearTimeout(t); $stage.onclick = null; siguiente(); };
      } else setTimeout(siguiente, espera);
    } else siguiente();
  }

  function terminarJuego(cancelado) {
    const J = JUEGO; if (!J || J.done) return;
    J.done = true; clearInterval(J.timer); JUEGO = null;
    $j.classList.add("hidden"); $stage.onclick = null;
    if (cancelado) return J.resolve(null);
    const p = J.p, T = TAREAS[p.tarea];
    const usado = p.dur ? p.dur : (performance.now() - J.t0) / 1000;
    const correctas = J.items.filter((x) => x.ok).length, fallos = J.items.length - correctas;
    const neta = correctas - T.pen * fallos;
    // En rondas con feedback se descuenta el tiempo de la animación para no penalizar el ritmo.
    const msResp = J.items.reduce((a, x) => a + x.ms, 0);
    const tiempoEfectivo = p.feedback && p.dur ? Math.max(30, msResp / 1000) : usado;
    const netaNorm = Math.max(0, neta) * (T.dur / Math.max(30, tiempoEfectivo));
    J.resolve({
      modo: p.modo, tarea: p.tarea, duracion_s: Math.round(p.dur || 0), usado_s: Math.round(usado * 10) / 10,
      intentadas: J.items.length, correctas, fallos, neta, neta_norm: Math.round(netaNorm * 10) / 10,
      percentil: p.modo === "aprendizaje" || p.practica ? 0 : percentil(p.tarea, netaNorm),
      ms_medio: J.items.length ? Math.round(msResp / J.items.length) : null,
      detalle: J.items.map(({ s, x, ok, ms, q, r, c }) => ({ s, x, ok, ms, q, r, c })),
      version: BUILD, _items: J.items,
    });
  }

  function pantallaResultados(rs, simId) {
    const resumen = rs.length === 5 && simId ? Math.round(rs.reduce((a, r) => a + r.percentil, 0) / 5) : null;
    $app.innerHTML = `
      <h1>${resumen != null ? "🏁 Simulacro terminado" : "Resultado"} <button class="link back" id="b-back">← Inicio</button></h1>
      ${resumen != null ? `<div class="card hero"><div class="muted">Percentil global estimado</div><b class="big">P${resumen}</b><div>${banda(resumen)[0]}</div></div>` : ""}
      ${rs.map((r) => { const T = TAREAS[r.tarea]; const errs = r._items.filter((x) => !x.ok); const apr = r.modo === "aprendizaje";
        return `<div class="card"><div class="row"><b>${T.emoji} ${T.nombre}</b><span class="spacer"></span>
          ${apr ? "" : `<span class="pill ${banda(r.percentil)[1]}">P${r.percentil} · ${banda(r.percentil)[0]}</span>`}</div>
          <p class="num" style="margin:8px 0">Hechas ${r.intentadas} · ✓ ${r.correctas} · ✗ ${r.fallos} · <b>ajustada ${r.neta}</b>${!apr && r.duracion_s !== T.dur ? ` (≈${r.neta_norm} a ${fmt(T.dur)})` : ""} · ${r.ms_medio ? (r.ms_medio / 1000).toFixed(1) + " s/pregunta" : ""}</p>
          ${apr ? "" : `<div class="muted">Objetivo «por encima de la media»: ajustada ≥ ${T.obj} en ${fmt(T.dur)} (~${T.seg} s por pregunta) ${r.neta_norm >= T.obj ? "✅" : `→ te faltan ${Math.ceil(T.obj - r.neta_norm)}`}</div>`}
          ${consejo(r)}
          ${errs.length ? `<details><summary>Ver ${errs.length} fallo${errs.length > 1 ? "s" : ""}</summary><ul class="tips">${errs.map((x) => `<li>${esc(x.q)} — pusiste <b>${esc(x.r)}</b>. ${esc(x.expl)}</li>`).join("")}</ul></details>` : ""}
        </div>`; }).join("")}
      <button class="big primary" id="b-again">Otra vez</button>`;
    $app.querySelector("#b-back").onclick = pantallaInicio;
    $app.querySelector("#b-again").onclick = () => {
      if (simId) iniciarSecuencia("simulacro", ORDEN, null);
      else if (rs[0].modo === "aprendizaje") correrSecuencia([{ tarea: rs[0].tarea, dur: 0, maxItems: 15, ejemplos: false, feedback: true, aprender: true, modo: "aprendizaje" }], null);
      else if (rs[0].modo === "plan") { const p = PLAN?.plan || {}; iniciarSecuencia("plan", p.orden?.length ? p.orden : ORDEN, p); }
      else pantallaTarea(rs[0].tarea);
    };
    window.scrollTo(0, 0);
  }

  function consejo(r) {
    const tasa = r.intentadas ? r.fallos / r.intentadas : 0;
    let m;
    if (r.intentadas < 4) m = "Muy pocas respuestas: intenta mantener un ritmo constante.";
    else if (tasa > 0.1) m = "Más de 1 fallo de cada 10: baja un punto el ritmo. Aquí el fallo cuesta más que el segundo que ahorras.";
    else if (tasa === 0) m = "Sin fallos: puedes apretar el ritmo.";
    else m = "Buen equilibrio entre velocidad y precisión.";
    return `<div class="muted">💡 ${m}</div>`;
  }

  // ===================================================================
  // Arranque
  // ===================================================================
  pantallaInicio();
  cargarDatos().then((ok) => { if (ok && !JUEGO && $app.querySelector("#b-sim")) pantallaInicio(); });
  window.addEventListener("online", vaciarCola);

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
    navigator.serviceWorker.addEventListener("message", (e) => {
      if (e.data?.type === "new-version" && !JUEGO) location.reload();
    });
  }
  </script>
</body>
</html>

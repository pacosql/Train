<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ortografía10 · logos</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Logo O10" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="fonts/poppins.css" />

  <style>
    :root {
      --bg: #ffffff;
      --paper: #f5f4ef;
      --ink: #141413;
      --ink-2: #6b6a66;
      --line: #e6e4dd;
      --blue: #2f5fe8;
      --good: #1f9d55;
      --bad: #d6453d;
      --gold: #c98a12;
      --font: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding-top: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; }
    button { font: inherit; color: inherit; cursor: pointer; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 140px; }

    header { display: flex; align-items: center; gap: 10px; padding: 18px 0 6px; }
    header h1 { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; margin: 0; flex: 1; }
    header h1 span { font-weight: 500; color: var(--ink-2); }
    .icon-btn { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; width: 40px; height: 40px; font-size: 1.1rem; }
    .icon-btn.spin { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 12px; scrollbar-width: none; position: sticky; top: 0; background: var(--bg); z-index: 5; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { flex: none; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 12px; font-size: 0.85rem; font-weight: 500; white-space: nowrap; }
    .tab.active { background: var(--ink); border-color: var(--ink); color: #fff; }
    .tab b { font-weight: 700; margin-left: 2px; }

    .msg { color: var(--bad); font-size: 0.9rem; min-height: 0; margin: 0 0 8px; }
    .msg:empty { display: none; }
    .eyebrow { font-size: 0.78rem; color: var(--ink-2); margin: 4px 0 10px; }

    /* petición general (sin tarjeta concreta) */
    .general { border: 1px dashed var(--line); border-radius: 16px; padding: 12px 14px; margin: 0 0 18px; }
    .general > summary { font-weight: 600; font-size: 0.95rem; list-style: none; cursor: pointer; }
    .general > summary::-webkit-details-marker { display: none; }
    .general p.helper { margin: 6px 0 10px; }
    .prefs p { font-size: 0.86rem; margin: 8px 0 0; }

    /* tarjeta de diseño: mismo formato que las pruebas previas */
    .card { border-bottom: 1px solid var(--line); padding: 18px 0 16px; }
    .card.fading { opacity: 0; transform: translateX(24px); transition: 0.25s; }
    .card-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
    .num { font-size: 1.6rem; font-weight: 800; line-height: 1; min-width: 1.4em; }
    .titulo { font-size: 0.98rem; color: #3b3a37; flex: 1; }
    .badge { font-size: 0.7rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--paper); color: var(--ink-2); white-space: nowrap; }
    .badge.gusta { background: #e3f4ea; color: var(--good); }
    .badge.no_gusta { background: #fbe7e5; color: var(--bad); }
    .badge.definitivo { background: #fdf1d6; color: var(--gold); }
    .badge.revisar { background: #e6ecfd; color: var(--blue); }
    .badge.new { background: var(--ink); color: #fff; }

    .icons { display: flex; align-items: center; gap: 14px; }
    .ic { position: relative; overflow: hidden; flex: none; }
    .ic svg { display: block; width: 100%; height: 100%; }
    .ic .acento, .wm .acento { fill: var(--acento); }
    .ic .acento-trazo, .wm .acento-trazo { stroke: var(--acento); }
    .ic .fondo, .wm .fondo { fill: var(--fondo); }
    .ic .fondo-trazo, .wm .fondo-trazo { stroke: var(--fondo); }
    .ic.sq { width: clamp(92px, 28vw, 124px); aspect-ratio: 1; border-radius: 22%; }
    .ic.ci { width: clamp(92px, 28vw, 124px); aspect-ratio: 1; border-radius: 50%; }
    .ic.f40 { width: 40px; height: 40px; border-radius: 22%; }
    .ic.f20 { width: 20px; height: 20px; border-radius: 22%; }
    .ic.claro { box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.04); }
    .favs-col { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
    .favs { display: flex; align-items: flex-end; gap: 12px; }
    .favs-col small { color: var(--ink-2); font-size: 0.8rem; }
    .wm { margin: 16px 0 4px; height: clamp(64px, 19vw, 84px); padding: clamp(18px, 5.4vw, 24px) 18px; border-radius: 14px; display: flex; justify-content: center; }
    .wm.claro { box-shadow: inset 0 0 0 1px var(--line); }
    .ic-col { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
    .ic-col small, .extras small { color: var(--ink-2); font-size: 0.72rem; line-height: 1.2; }
    .extras { display: flex; gap: 14px; align-items: flex-start; margin-top: 14px; }
    .extras > div { display: flex; flex-direction: column; gap: 6px; }
    .peg { width: clamp(120px, 38vw, 160px); background: #e9e7e1; border-radius: 12px; padding: 12px; }
    .peg svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
    .reel { --rw: clamp(84px, 25vw, 104px); width: var(--rw); aspect-ratio: 9 / 16; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; align-items: center; padding: calc(var(--rw) * 0.2) calc(var(--rw) * 0.08) 0; text-align: center; font-weight: 700; box-sizing: border-box; }
    .reel .wm { height: calc(var(--rw) * 0.11); margin: 0; padding: 0; border-radius: 0; box-shadow: none; }
    .reel .pill { font-size: calc(var(--rw) * 0.06); border-radius: 99px; padding: 0.3em 1em; margin-top: calc(var(--rw) * 0.1); }
    .reel .frase { font-size: calc(var(--rw) * 0.09); line-height: 1.25; margin-top: calc(var(--rw) * 0.08); }
    .reel .frase mark { border-radius: 2px; padding: 0 1px; color: inherit; }
    .herm { width: 64px; height: 64px; border-radius: 22%; }
    /* barra de decidir: siempre a mano (fija abajo en vertical, parte de la pantalla en horizontal) */
    .st-bar { display: flex; gap: 6px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: var(--bg); }
    .st-bar button { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px 2px; font-size: 0.9rem; font-weight: 600; white-space: nowrap; }
    .st-bar button.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
    .st-bar button:disabled { opacity: 0.35; }
    body:not(.rev) .st-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; }
    @media (max-width: 599px) { .st-bar .lb { display: none; } .st-bar button { font-size: 1.15rem; } }
    .cnt { font-size: 0.8rem; color: var(--ink-2); white-space: nowrap; }
    .mini { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 5px 10px; font-size: 0.78rem; font-weight: 600; white-space: nowrap; }

    /* pantalla ancha / móvil en horizontal: todo el diseño en una pantalla, sin scroll */
    body.rev .wrap { max-width: none; padding: 0 0 40px; display: flex; flex-direction: column; }
    body.rev #view { order: -1; }
    body.rev header, body.rev .tabs, body.rev .msg, body.rev .routines { padding-left: 16px; padding-right: 16px; }
    body.rev .tabs { position: static; }
    .stage-card { padding: 0; border: 0; }
    .stage { height: 100vh; height: 100dvh; display: flex; flex-direction: column; --H: calc(100dvh - 44px - 66px - 20px); --S: min(calc(var(--H) - 22px), 20vw); }
    .st-top { height: 44px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--line); }
    .st-top .num { font-size: 1.3rem; min-width: 0; }
    .st-top .titulo { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .st-main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: clamp(10px, 1.6vw, 30px); padding: 10px 14px; overflow: hidden; }
    .st-main .ic.sq { width: var(--S); }
    .st-main .ic.ci { width: calc(var(--S) * 0.62); }
    .st-main small { color: var(--ink-2); font-size: 0.68rem; white-space: nowrap; }
    .st-favs { display: flex; flex-direction: column; gap: 8px; align-items: center; flex: none; }
    .st-favs .herm { width: 44px; height: 44px; }
    .st-mid { flex: 1; min-width: 0; max-width: 560px; display: flex; flex-direction: column; justify-content: center; }
    .st-mid .wm { margin: 0; height: clamp(46px, 9vw, 120px); padding: clamp(12px, 2.4vw, 34px) 14px; }
    .st-mid .concepto, .st-mid .revnota span { font-size: 0.76rem; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .st-mid .revnota { padding: 6px 8px; margin-top: 8px; }
    @media (max-height: 520px) { .st-mid .concepto, .st-mid .revnota span { -webkit-line-clamp: 2; } }
    .st-main .peg { flex: none; width: auto; height: min(var(--H), 22vw); padding: 8px; }
    .st-main .peg svg { height: 100%; width: auto; }
    .st-main .reel { flex: none; --rw: calc(min(var(--H), 21vw) * 0.5625); }
    .stage .st-bar { flex: none; height: 66px; }
    .st-below { max-width: 640px; margin: 0 auto; padding: 16px; }
    .a4 { width: 100%; margin-top: 10px; border: 1px solid var(--ink); background: var(--bg); border-radius: 12px; padding: 11px; font-size: 0.9rem; font-weight: 700; }
    .a4:disabled { opacity: 0.5; }
    .wm svg { height: 100%; width: auto; max-width: 100%; display: block; }

    .concepto { font-size: 0.88rem; color: var(--ink-2); margin: 8px 0 0; }
    .revnota { font-size: 0.85rem; background: #eef2fd; color: #23408f; border-radius: 10px; padding: 8px 10px; margin: 10px 0 0; }
    .padre { font-size: 0.78rem; color: var(--ink-2); margin: 6px 0 0; }
    .padre a { color: inherit; }

    .acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
    .acts button { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 2px; font-size: 0.8rem; font-weight: 600; white-space: nowrap; }
    button.on[data-d="gusta"] { background: var(--good); border-color: var(--good); color: #fff; }
    button.on[data-d="no_gusta"] { background: var(--bad); border-color: var(--bad); color: #fff; }
    button.on[data-d="definitivo"] { background: var(--gold); border-color: var(--gold); color: #fff; }
    button.on[data-d="revisar"] { background: var(--blue); border-color: var(--blue); color: #fff; }

    details.more { margin-top: 10px; }
    details.more > summary { font-size: 0.85rem; font-weight: 600; color: var(--ink-2); cursor: pointer; list-style: none; padding: 4px 0; }
    details.more > summary::-webkit-details-marker { display: none; }
    details.more[open] > summary { color: var(--ink); }
    .panel { background: var(--paper); border-radius: 14px; padding: 12px; margin-top: 6px; }
    .helper { font-size: 0.78rem; color: var(--ink-2); margin: 8px 0 0; }
    textarea { width: 100%; min-height: 70px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; font: inherit; font-size: 0.92rem; resize: vertical; background: #fff; }
    .row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .row button { flex: 1; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 9px 6px; font-size: 0.85rem; font-weight: 600; }
    .row button.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
    .row button.on { background: var(--bad); border-color: var(--bad); color: #fff; }
    .row button:disabled { opacity: 0.5; }
    .comment { background: #fff; border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; font-size: 0.88rem; }
    .comment .head { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--ink-2); margin-bottom: 2px; }
    .comment .trans { font-style: italic; color: #3b3a37; margin-top: 4px; }
    .comment audio, .rec-preview audio { width: 100%; height: 36px; margin-top: 4px; }
    .estado.procesado { color: var(--good); }

    /* kit / guía de marca */
    .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
    .sw { border: 0; background: none; padding: 0; text-align: left; font-size: 0.72rem; }
    .sw i { display: block; width: 54px; height: 40px; border-radius: 8px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08); margin-bottom: 3px; }
    .kit h4 { font-size: 0.8rem; margin: 12px 0 6px; }
    .kit h4:first-child { margin-top: 0; }
    .dl { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .dl button { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 6px; font-size: 0.78rem; font-weight: 500; }
    .tab-mock { display: inline-flex; align-items: center; gap: 8px; background: #fff; border-radius: 10px 10px 0 0; padding: 7px 14px 7px 10px; font-size: 0.8rem; box-shadow: 0 -1px 0 var(--line) inset; }
    .tab-mock .ic { width: 16px; height: 16px; border-radius: 22%; }

    /* galería */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 14px 12px; }
    .g-item { text-align: left; min-width: 0; }
    .g-open { border: 0; background: none; padding: 0; display: block; width: 100%; }
    .g-acts { display: flex; gap: 4px; margin-top: 4px; }
    .g-acts button { flex: 1; border: 1px solid var(--line); background: var(--bg); border-radius: 9px; padding: 5px 0; font-size: 0.9rem; line-height: 1.2; }
    .g-item .cap { white-space: nowrap; overflow: hidden; }
    body.gridv .wrap { max-width: 1180px; }
    .icon-btn.on { background: var(--ink); border-color: var(--ink); color: #fff; }
    /* pantalla de inicio de un iPhone de 6,3" (402 × 874 pt), a escala */
    .phones-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 16px; }
    .phones-bar button, .ver-iphone { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 7px 14px; font-size: 0.82rem; font-weight: 600; }
    .phones-bar button.on { background: var(--ink); border-color: var(--ink); color: #fff; }
    .ver-iphone { border-color: var(--ink); font-weight: 700; margin: 0 0 14px; }
    .phones { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; }
    .iph { --u: calc(min(100vw - 40px, 432px) / 432); width: calc(var(--u) * 432); height: calc(var(--u) * 903); border-radius: calc(var(--u) * 66); background: #1b1b1f; padding: calc(var(--u) * 15) calc(var(--u) * 15); box-shadow: 0 0 0 calc(var(--u) * 2) #3a3a40 inset, 0 calc(var(--u) * 24) calc(var(--u) * 50) rgba(0, 0, 0, 0.28); flex: none; position: relative; }
    .iph .scr { width: 100%; height: 100%; border-radius: calc(var(--u) * 52); overflow: hidden; position: relative; font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; color: #fff; }
    .iph.negro .scr { background: #000; }
    .iph.claro .scr { background: linear-gradient(160deg, #f3f1ec, #dcd8cf); color: #111; }
    .iph.color .scr { background: linear-gradient(165deg, #23345f 0%, #5d6c95 50%, #b98a9a 100%); }
    .iph .isla { position: absolute; top: calc(var(--u) * 11); left: 50%; width: calc(var(--u) * 124); height: calc(var(--u) * 36); margin-left: calc(var(--u) * -62); border-radius: 99px; background: #000; z-index: 2; }
    .iph.negro .isla { background: #0e0e10; }
    .iph .hora { position: absolute; top: calc(var(--u) * 19); left: calc(var(--u) * 52); font-size: calc(var(--u) * 17); font-weight: 600; }
    .iph .bat { position: absolute; top: calc(var(--u) * 21); right: calc(var(--u) * 34); width: calc(var(--u) * 26); height: calc(var(--u) * 13); border-radius: calc(var(--u) * 4); border: calc(var(--u) * 1.2) solid currentColor; opacity: 0.9; }
    .iph .bat::after { content: ""; position: absolute; inset: calc(var(--u) * 1.4); border-radius: calc(var(--u) * 2); background: currentColor; }
    .iph .apps { position: absolute; top: calc(var(--u) * 78); left: calc(var(--u) * 27); right: calc(var(--u) * 27); display: grid; grid-template-columns: repeat(4, calc(var(--u) * 60)); justify-content: space-between; row-gap: calc(var(--u) * 44); }
    .iph .app { border: 0; background: none; padding: 0; color: inherit; font: inherit; width: calc(var(--u) * 60); position: relative; }
    .iph .app .ic { width: calc(var(--u) * 60); height: calc(var(--u) * 60); border-radius: 22.5%; }
    .iph.claro .app .ic.claro, .iph .app .ic.osc { box-shadow: inset 0 0 0 calc(var(--u) * 0.7) rgba(128, 128, 128, 0.45); }
    .iph .app span { position: absolute; top: calc(var(--u) * 65); left: 50%; transform: translateX(-50%); font-size: calc(var(--u) * 12); font-weight: 500; white-space: nowrap; letter-spacing: -0.01em; }
    .iph .busca { position: absolute; bottom: calc(var(--u) * 118); left: 50%; transform: translateX(-50%); font-size: calc(var(--u) * 13.5); font-weight: 500; background: rgba(120, 120, 128, 0.36); border-radius: 99px; padding: calc(var(--u) * 6) calc(var(--u) * 14); }
    .iph .dock { position: absolute; left: calc(var(--u) * 13); right: calc(var(--u) * 13); bottom: calc(var(--u) * 13); height: calc(var(--u) * 94); border-radius: calc(var(--u) * 36); background: rgba(120, 120, 128, 0.32); display: flex; align-items: center; justify-content: space-between; padding: 0 calc(var(--u) * 14); }
    .iph .dock i { width: calc(var(--u) * 60); height: calc(var(--u) * 60); border-radius: 22.5%; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: calc(var(--u) * 30); color: #fff; }
    .iph .raya { position: absolute; bottom: calc(var(--u) * 5); left: 50%; width: calc(var(--u) * 140); height: calc(var(--u) * 5); margin-left: calc(var(--u) * -70); border-radius: 99px; background: currentColor; opacity: 0.85; z-index: 3; }
    .iph-cap { text-align: center; font-size: 0.78rem; color: var(--ink-2); margin-top: 8px; }
    /* favicons a tamaño real (16 px) en pestañas de navegador */
    .fav-tira { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; margin: 0 0 22px; padding: 14px; border: 1px solid var(--line); border-radius: 14px; }
    .fav-tira button { border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; font: inherit; font-size: 0.62rem; color: var(--ink-2); }
    .fv { overflow: hidden; flex: none; border-radius: 22%; display: block; }
    .fv svg { display: block; width: 100%; height: 100%; }
    .fv .acento { fill: var(--acento); } .fv .acento-trazo { stroke: var(--acento); } .fv .fondo { fill: var(--fondo); } .fv .fondo-trazo { stroke: var(--fondo); }
    .navs { display: flex; flex-direction: column; gap: 18px; }
    .nav { border-radius: 10px; overflow: hidden; border: 1px solid #c9ccd3; font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12px; background: #fff; color: #1f1f1f; }
    .nav .tabs-n { display: flex; background: #dfe3ee; padding: 6px 8px 0; gap: 1px; }
    .nav .tb { flex: 1 1 0; min-width: 0; max-width: 240px; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 0; border-radius: 8px 8px 0 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
    .nav .tb.on { background: #fff; }
    .nav .tb .tt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nav .tb i { font-style: normal; opacity: 0.55; font-size: 11px; }
    .nav .dir { display: flex; align-items: center; gap: 12px; padding: 7px 12px; color: #5f6368; }
    .nav .dir b { flex: 1; font-weight: 400; background: #f1f3f4; border-radius: 99px; padding: 5px 14px; color: #1f1f1f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nav .marc { display: flex; gap: 16px; padding: 4px 12px 7px; border-top: 1px solid #eceef1; overflow: hidden; white-space: nowrap; }
    .nav .marc > span { display: inline-flex; align-items: center; gap: 6px; }
    .nav.osc { background: #292a2d; color: #e8eaed; border-color: #3c4043; }
    .nav.osc .tabs-n { background: #1b1c1f; } .nav.osc .tb.on { background: #292a2d; } .nav.osc .dir { color: #9aa0a6; } .nav.osc .dir b { background: #1b1c1f; color: #e8eaed; } .nav.osc .marc { border-color: #3c4043; }
    .bulk { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0 0 14px; }
    .bulk .helper { margin: 0; }
    .bulk button { border: 1px solid var(--bad); color: var(--bad); background: var(--bg); border-radius: 12px; padding: 9px 14px; font-size: 0.88rem; font-weight: 700; }
    .bulk button.armed { background: var(--bad); color: #fff; }
    .g-item .ic { width: 100%; aspect-ratio: 1; border-radius: 22%; }
    .g-item div.cap { font-size: 0.75rem; margin-top: 4px; display: flex; gap: 4px; align-items: center; }
    .g-item div.cap b { font-weight: 800; }
    .g-item.dim { opacity: 0.45; }

    .empty { text-align: center; padding: 50px 10px; color: var(--ink-2); }
    .empty .big { font-size: 2.4rem; }
    .back { font-weight: 600; font-size: 0.9rem; margin: 4px 0 4px; cursor: pointer; display: inline-block; }

    .routines { font-size: 0.72rem; color: var(--ink-2); margin-top: 28px; }
    .build-id { font-size: 0.7rem; color: #b5b3ac; text-align: center; margin-top: 18px; }

    .toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 240%); background: var(--ink); color: #fff; border-radius: 14px; padding: 10px 12px 10px 16px; display: flex; gap: 12px; align-items: center; font-size: 0.88rem; transition: transform 0.25s, visibility 0.25s; visibility: hidden; max-width: calc(100% - 32px); z-index: 20; }
    .toast.show { transform: translate(-50%, 0); visibility: visible; }
    .toast button { background: #fff; color: var(--ink); border: 0; border-radius: 10px; padding: 6px 10px; font-weight: 600; font-size: 0.82rem; }
    .toast button:empty { display: none; }
  </style>
  <style id="examen-css"></style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Ortografía10 <span>· elige el logo</span></h1>
      <a class="icon-btn" href="ranking.html" title="Ranking: cuáles son los mejores según las 9 preguntas, y por qué" style="display:flex;align-items:center;justify-content:center;text-decoration:none">🏆</a>
      <a class="icon-btn" href="guia.html" title="Guía: qué tiene que cumplir un logo, imagen de marca y arquetipos" style="display:flex;align-items:center;justify-content:center;text-decoration:none">📖</a>
      <button class="icon-btn" id="btn-grid" title="Ver todos los iconos de un vistazo / de uno en uno">▦</button>
      <button class="icon-btn" id="btn-refresh" title="Recargar">↻</button>
    </header>

    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="pendiente">Por decidir <b id="n-pendiente">·</b></button>
      <button class="tab" data-tab="gusta">👍 <b id="n-gusta">·</b></button>
      <button class="tab" data-tab="definitivo">⭐ <b id="n-definitivo">·</b></button>
      <button class="tab" data-tab="revisar">🔁 En cola <b id="n-revisar">·</b></button>
      <button class="tab" data-tab="no_gusta">👎 <b id="n-no_gusta">·</b></button>
      <button class="tab" data-tab="todos">Todos <b id="n-todos">·</b></button>
    </nav>

    <p class="msg" id="msg"></p>
    <div id="view"></div>

    <div class="routines" id="routines"></div>
    <div class="build-id">build __BUILD_ID__</div>
  </div>

  <div class="toast" id="toast"><span id="toast-text"></span><button id="toast-undo"></button></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="examen.js"></script>
  <script>
    const EX = window.ORTOLOGO_EXAMEN;
    document.getElementById("examen-css").textContent = EX.CSS;
    const { url, anonKey, tablePrefix } = window.ORTOLOGO_CONFIG;
    const T_DISENOS = tablePrefix + "disenos";
    const T_COMENTARIOS = tablePrefix + "comentarios";
    const T_RUTINAS = tablePrefix + "rutinas";
    const T_PREFS = tablePrefix + "preferencias";
    let prefs = null;
    const BUCKET = "ortologo-audios";
    const DECISION_LABEL = { gusta: "👍 Me gusta", no_gusta: "👎 No", definitivo: "⭐ Final", revisar: "🔁 Otra", versionado: "Ya versionado", retirado: "Retirado" };
    const ESTADO_LABEL = { pendiente: "⏳ pendiente", transcrito: "⏳ pendiente", procesado: "✅ usado" };
    let client = null;
    let disenos = [];
    let comentarios = [];
    let rutinas = [];
    const state = { tab: "pendiente", detail: null, idx: 0, queue: [] };
    // Cola de revisión: los pendientes en orden. Al decidir se pasa al siguiente,
    // pero lo ya decidido sigue en la cola para poder volver atrás y verlo.
    const WIDE = window.matchMedia("(orientation: landscape) and (min-width: 600px)");
    // Cuadrícula: solo los iconos, todos de un vistazo, y se vota tocando 👎 / 👍.
    // La lista se congela al entrar para que nada salte de sitio al votar.
    try { state.grid = localStorage.getItem("ortologo.grid") === "1"; } catch {}
    const isGrid = () => state.tab === "todos" || !!state.grid;
    const inQueue = () => state.tab === "pendiente" && !state.detail && !isGrid();
    function gridList() {
      if (!state.snap || state.snap.tab !== state.tab) state.snap = { tab: state.tab, ids: inTab(state.tab).map((d) => d.id) };
      return state.snap.ids.map(byId).filter(Boolean);
    }
    function buildQueue(reset) {
      const vistos = reset ? [] : state.queue.slice(0, state.idx).filter((id) => byId(id));
      const pend = inTab("pendiente").map((d) => d.id).filter((id) => !vistos.includes(id));
      state.queue = vistos.concat(pend); state.idx = vistos.length;
    }
    function go(n) { resetRec(); stopDictate(); state.idx = Math.max(0, Math.min(state.idx + n, state.queue.length)); render(); window.scrollTo(0, 0); }
    // Última visita: lo creado desde entonces lleva la etiqueta «nuevo».
    const VISIT_KEY = "ortologo.ultimaVisita";
    let prevVisit = null;
    try { prevVisit = localStorage.getItem(VISIT_KEY); localStorage.setItem(VISIT_KEY, new Date().toISOString()); } catch {}
    const isNew = (d) => !!prevVisit && d.created_at > prevVisit;

    const el = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    // ---------- SVG: saneado (las filas vienen de la base de datos) ----------
    const svgCache = new Map();
    const fitCache = new Map(); // svg original → viewBox ya encajado a la tinta real

    // Encaje automático: los SVG con data-fit se miden ya renderizados (con la
    // fuente cargada) y se les ajusta el viewBox a la tinta de los glifos, así
    // la rutina no tiene que calcular anchos. Poppins: mayúsculas/dígitos 0,70 em,
    // minúsculas 0,55 em; la caja em de cada glifo mide 1,4 em (1,05 + 0,35).
    const CAP = 0.7, XH = 0.55, EM_BOX = 1.4;
    function inkBox(svg) {
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (const t of svg.querySelectorAll("text")) {
      const txt = t.textContent, n = t.getNumberOfChars();
      for (let i = 0; i < n; i++) {
        const ch = txt[i];
        if (!ch || ch === " ") continue;
        const e = t.getExtentOfChar(i), p = t.getStartPositionOfChar(i), sz = e.height / EM_BOX;
        let top = p.y - CAP * sz, bot = p.y;
        if (ch === "°") bot = p.y - 0.4 * sz;
        else if (ch === "·") { top = p.y - 0.42 * sz; bot = p.y - 0.26 * sz; }
        else if (/[acemnorsuvwxz]/.test(ch)) top = p.y - XH * sz;
        else if (/[gjpqy]/.test(ch)) { top = p.y - XH * sz; bot = p.y + 0.22 * sz; }
        x0 = Math.min(x0, e.x); x1 = Math.max(x1, e.x + e.width);
        y0 = Math.min(y0, top); y1 = Math.max(y1, bot);
      }
      }
      // formas (círculos, rectángulos, trazos…) que acompañan al texto
      for (const sh of svg.querySelectorAll("circle,rect,path,line,polygon,polyline,ellipse")) {
        const b = sh.getBBox(), sw = (parseFloat(sh.getAttribute("stroke-width")) || 0) / 2;
        x0 = Math.min(x0, b.x - sw); y0 = Math.min(y0, b.y - sw); x1 = Math.max(x1, b.x + b.width + sw); y1 = Math.max(y1, b.y + b.height + sw);
      }
      return x0 === Infinity ? null : { x0, y0, x1, y1 };
    }
    function fitSvgs(root) {
      root.querySelectorAll("svg[data-fit]").forEach((svg) => {
        const key = svg.dataset.src;
        if (!key || fitCache.has(key)) return;
        let b; try { b = inkBox(svg); } catch { return; }
        if (!b) return;
        const w = b.x1 - b.x0, h = b.y1 - b.y0, cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2;
        let vb;
        if (svg.dataset.fit === "wordmark") { const pad = h * 0.08; vb = [b.x0 - pad, b.y0 - pad, w + 2 * pad, h + 2 * pad]; }
        else { const side = Math.max(w, h * 1.15) / (parseFloat(svg.dataset.tam) || 0.62); vb = [cx - side / 2, cy - side / 2, side, side]; }
        const v = vb.map((x) => +x.toFixed(2)).join(" ");
        fitCache.set(key, v);
        const orig = [...srcIds].find(([, id]) => id === key);
        if (orig && svgCache.has(orig[0])) svgCache.set(orig[0], svgCache.get(orig[0]).replace(/viewBox="[^"]*"/, `viewBox="${v}"`));
        root.querySelectorAll("svg[data-src]").forEach((s) => { if (s.dataset.src === key) s.setAttribute("viewBox", v); });
      });
    }
    let srcIds = new Map();
    const srcId = (str) => { if (!srcIds.has(str)) srcIds.set(str, "s" + srcIds.size); return srcIds.get(str); };
    function safeSvg(str) {
      if (!str) return "";
      if (svgCache.has(str)) return svgCache.get(str);
      let out = "";
      try {
        const doc = new DOMParser().parseFromString(str, "image/svg+xml");
        const svg = doc.documentElement;
        if (svg && svg.nodeName.toLowerCase() === "svg" && !doc.querySelector("parsererror")) {
          svg.querySelectorAll("script,foreignObject,iframe,image,a,animate,set,style").forEach((n) => n.remove());
          for (const n of [svg, ...svg.querySelectorAll("*")]) {
            for (const a of [...n.attributes]) {
              const name = a.name.toLowerCase();
              if (name.startsWith("on")) n.removeAttribute(a.name);
              else if ((name === "href" || name === "xlink:href") && !a.value.startsWith("#")) n.removeAttribute(a.name);
            }
          }
          svg.removeAttribute("width"); svg.removeAttribute("height");
          if (svg.hasAttribute("data-fit")) { svg.setAttribute("data-src", srcId(str)); if (fitCache.has(srcId(str))) svg.setAttribute("viewBox", fitCache.get(srcId(str))); }
          if (!svg.getAttribute("preserveAspectRatio")) svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
          out = new XMLSerializer().serializeToString(svg);
        }
      } catch {}
      svgCache.set(str, out);
      return out;
    }
    const C = (d) => ({ icono_fondo: "#141839", icono_tinta: "#F6F2EA", acento: "#FECB3B", wordmark: "#F6F2EA", wordmark_fondo: "#141839", error: "#FE5F5E", acierto: "#3FD480", ...(d.colores || {}) });
    const lum = (hex) => { const h = (hex || "").replace("#", ""); if (h.length < 6) return 0; const [r, g, b] = [0, 2, 4].map((i) => parseInt(h.substr(i, 2), 16)); return 0.299 * r + 0.587 * g + 0.114 * b; };
    const isLight = (hex) => { const h = (hex || "").replace("#", ""); if (h.length < 6) return false; const [r, g, b] = [0, 2, 4].map((i) => parseInt(h.substr(i, 2), 16)); return (0.299 * r + 0.587 * g + 0.114 * b) > 225; };
    function icon(d, cls, fav = false) {
      const c = C(d);
      return `<div class="ic ${cls} ${isLight(c.icono_fondo) ? "claro" : ""}" style="background:${esc(c.icono_fondo)};color:${esc(c.icono_tinta)};--acento:${esc(c.acento)};--fondo:${esc(c.icono_fondo)}">${safeSvg(fav ? (d.svg_favicon || d.svg_marca) : d.svg_marca)}</div>`;
    }
    function wordmark(d) {
      const c = C(d);
      return `<div class="wm ${isLight(c.wordmark_fondo) ? "claro" : ""}" style="background:${esc(c.wordmark_fondo)};color:${esc(c.wordmark)};--acento:${esc(c.acento)};--fondo:${esc(c.wordmark_fondo)}">${safeSvg(d.svg_wordmark)}</div>`;
    }
    // Fotograma de Reel como el del vídeo: el nombre arriba y el ejercicio debajo.
    function reel(d) {
      const c = C(d), claro = isLight(c.wordmark_fondo) || lum(c.wordmark_fondo) > 150;
      return `<div class="reel" style="background:${esc(c.wordmark_fondo)};color:${esc(c.wordmark)};${isLight(c.wordmark_fondo) ? "box-shadow:inset 0 0 0 1px var(--line)" : ""}">
        <div class="wm" style="color:${esc(c.wordmark)};--acento:${esc(c.acento)};--fondo:${esc(c.wordmark_fondo)}">${safeSvg(d.svg_wordmark)}</div>
        <div class="pill" style="background:${esc(c.error)};color:#fff">¡Aquí está!</div>
        <div class="frase">Ayer conduje mi cami<mark style="background:${claro ? "rgba(0,0,0,.12)" : "rgba(255,255,255,.16)"};color:${esc(c.acento === c.wordmark ? c.error : c.acento)}">on</mark>.</div></div>`;
    }
    // Fuentes extra (Google Fonts) que pida un diseño además de Poppins, que va alojada aquí.
    const loadedFonts = new Set();
    function loadFonts() {
      for (const d of disenos) for (const f of d.fuentes || []) {
        if (!f || loadedFonts.has(f) || /^poppins/i.test(f)) continue;
        loadedFonts.add(f);
        const l = document.createElement("link"); l.rel = "stylesheet";
        l.href = "https://fonts.googleapis.com/css2?family=" + encodeURIComponent(f).replace(/%20/g, "+").replace(/%3A/gi, ":").replace(/%40/g, "@").replace(/%3B/gi, ";").replace(/%2C/gi, ",") + "&display=swap";
        document.head.appendChild(l);
      }
    }

    // ---------- datos ----------
    // Supabase devuelve como mucho 1000 filas por petición: se pide por páginas.
    async function fetchAll(build) {
      let out = [];
      for (let from = 0; ; from += 1000) {
        const { data, error } = await build().range(from, from + 999);
        if (error) return { error };
        out = out.concat(data || []);
        if (!data || data.length < 1000) return { data: out };
      }
    }
    // Para ir rápido con miles de diseños: al entrar solo se cargan los vivos
    // (por decidir, 👍, ⭐, 🔁) y sin las piezas pesadas; el nombre, la pegatina y
    // el hermano de cada diseño se piden al enseñarlo, y los descartados al abrir
    // 👎 o «Todos».
    const LIGERO = "examen,id,numero,titulo,concepto,svg_marca,svg_favicon,colores,fuentes,padre_id,version,revision_nota,etiquetas,origen,decision,decidido_en,created_at";
    const VIVOS = "decision.is.null,decision.in.(gusta,definitivo,revisar)";
    const totales = { no_gusta: null, todos: null };
    let restoCargado = false;
    async function loadResto() {
      if (restoCargado) return;
      const r = await fetchAll(() => client.from(T_DISENOS).select(LIGERO).in("decision", ["no_gusta", "versionado", "retirado"]).order("numero", { ascending: true }));
      if (r.error) throw r.error;
      const ya = new Set(disenos.map((d) => d.id));
      disenos = disenos.concat(r.data.filter((d) => !ya.has(d.id))).sort((x, y) => x.numero - y.numero);
      restoCargado = true;
    }
    const pidiendo = new Set();
    async function ensureFull(d) {
      if (!d || d._full || pidiendo.has(d.id)) return;
      pidiendo.add(d.id);
      const { data, error } = await client.from(T_DISENOS).select("svg_wordmark,svg_pegatina,svg_hermano,spec").eq("id", d.id).maybeSingle();
      pidiendo.delete(d.id);
      if (error || !data) return;
      Object.assign(d, data, { _full: true });
      if (document.querySelector(`.card[data-id="${d.id}"]`)) render();
    }
    async function load() {
      restoCargado = false;
      const [a, b, r, c1, c2] = await Promise.all([
        fetchAll(() => client.from(T_DISENOS).select(LIGERO).or(VIVOS).order("numero", { ascending: true })),
        client.from(T_COMENTARIOS).select("*").order("created_at", { ascending: true }),
        client.from(T_RUTINAS).select("rutina,ejecutada_en,resumen").eq("rutina", "hecho").order("ejecutada_en", { ascending: false }).limit(5),
        client.from(T_DISENOS).select("id", { count: "exact", head: true }).eq("decision", "no_gusta"),
        client.from(T_DISENOS).select("id", { count: "exact", head: true }),
      ]);
      totales.no_gusta = c1.error ? null : c1.count; totales.todos = c2.error ? null : c2.count;
      if (a.error) throw a.error;
      if (b.error) throw b.error;
      disenos = a.data || [];
      comentarios = b.data || [];
      rutinas = r.error ? [] : (r.data || []);
      const pr = await client.from(T_PREFS).select("*").eq("id", "yo").maybeSingle();
      prefs = pr.error ? null : pr.data;
      loadFonts();
      renderRoutines();
      buildQueue(false);
      state.snap = null;
      if (state.tab === "no_gusta" || state.tab === "todos") await loadResto();
    }
    const byId = (id) => disenos.find((d) => d.id === id);
    const commentsOf = (id) => comentarios.filter((c) => c.diseno_id === id);
    const pendingComments = (id) => commentsOf(id).filter((c) => c.estado !== "procesado").length;
    // Por decidir: primero las versiones que responden a tus comentarios (la más
    // nueva arriba) y después el resto en orden de número.
    const inTab = (tab) => tab === "todos" ? disenos.slice().reverse()
      : tab === "pendiente" ? disenos.filter((d) => !d.decision).sort((a, b) => (!!b.revision_nota - !!a.revision_nota) || (a.revision_nota ? b.numero - a.numero : a.numero - b.numero))
      : disenos.filter((d) => d.decision === tab).sort((a, b) => (b.decidido_en || "").localeCompare(a.decidido_en || ""));

    function counts() {
      for (const t of ["pendiente", "gusta", "definitivo", "revisar", "no_gusta"]) el("n-" + t).textContent = inTab(t).length;
      if (!restoCargado) { if (totales.no_gusta != null) el("n-no_gusta").textContent = totales.no_gusta; el("n-todos").textContent = totales.todos ?? disenos.length; }
      else el("n-todos").textContent = disenos.length;
    }
    function ago(iso) {
      const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
      return m < 60 ? `hace ${m} min` : m < 1440 ? `hace ${Math.round(m / 60)} h` : `hace ${Math.round(m / 1440)} d`;
    }
    function renderRoutines() {
      const r = rutinas[0];
      el("routines").textContent = r ? `Última pasada de la rutina ${ago(r.ejecutada_en)}: ${r.resumen || ""}` : "La rutina todavía no ha pasado. Lee tus votos y comentarios y trae versiones y propuestas nuevas.";
    }

    // ---------- tarjeta ----------
    // El examen de las 9 preguntas (lo pone Claude a los que marcas con 👍 o ⭐).
    function examenHTML(d) {
      if (EX.ok(d.examen)) return EX.html(d.examen);
      return ["gusta", "definitivo"].includes(d.decision) ? `<p class="helper" style="margin-top:12px">🎓 Este todavía no está examinado con las 9 preguntas de la <a href="guia.html#preguntas">guía</a>: la rutina lo hará en su próxima pasada.</p>` : "";
    }
    function barHTML(d) {
      const b = (k, e, t) => `<button type="button" data-d="${k}" class="${d && d.decision === k ? "on" : ""}" ${d ? "" : "disabled"} title="${t}">${e}<span class="lb"> ${t}</span></button>`;
      return `<div class="st-bar"><button type="button" id="prev" ${state.idx ? "" : "disabled"} title="Atrás">←<span class="lb"> Atrás</span></button>${b("no_gusta", "👎", "No")}${b("revisar", "🔁", "Otra")}${b("gusta", "👍", "Me gusta")}${b("definitivo", "⭐", "Final")}<button type="button" id="next" class="primary" ${d ? "" : "disabled"} title="Siguiente"><span class="lb">Siguiente </span>→</button></div>`;
    }
    const panelsHTML = (d, nc) => `<details class="more" data-panel="coment">
          <summary>💬 Comentar${nc ? ` (${nc}${pendingComments(d.id) ? `, ${pendingComments(d.id)} por usar` : ""})` : ""}</summary>
          <div class="panel" data-comment-box></div>
        </details>
        <details class="more" data-panel="kit">
          <summary>📐 Kit y guía de marca</summary>
          <div class="panel kit" data-kit-box></div>
        </details>`;
    // Horizontal: todo el diseño en una pantalla; comentar y el kit quedan debajo.
    function stageHTML(d, below) {
      ensureFull(d); ensureFull(byId(state.queue[state.idx + 1]));
      const c = C(d), padre = d.padre_id && byId(d.padre_id);
      return `<article class="card stage-card" id="d-${d.numero}" data-id="${d.id}">
        <section class="stage">
          <div class="st-top">
            <span class="num">${d.numero}</span><span class="titulo">${esc(d.titulo)}</span>
            ${d.version > 1 ? `<span class="badge">v${d.version}${padre ? ` del nº ${padre.numero}` : ""}</span>` : ""}
            ${isNew(d) && !d.decision ? `<span class="badge new">nuevo</span>` : ""}
            <span class="cnt">${state.idx + 1} / ${state.queue.length}</span>
            <button type="button" class="mini" data-a4>⬇️ A4</button>
            <button type="button" class="mini" data-com>💬 Comentar ↓</button>
          </div>
          <div class="st-main">
            <div class="ic-col">${icon(d, "sq")}<small>App Store · Google Play</small></div>
            <div class="ic-col">${icon(d, "ci")}<small>Avatar</small></div>
            <div class="st-favs">${icon(d, "f40", true)}${icon(d, "f20", true)}</div>
            <div class="st-mid">${wordmark(d)}${d.revision_nota ? `<p class="revnota"><span>${esc(d.revision_nota)}</span></p>` : ""}${d.concepto ? `<p class="concepto">${esc(d.concepto)}</p>` : ""}</div>

    function wireCard(card) {
      const d = byId(card.dataset.id);
      const com = card.querySelector("[data-com]");
      if (com) com.onclick = () => card.querySelector(".st-below").scrollIntoView({ behavior: "smooth" });
      card.querySelectorAll("button[data-d]").forEach((b) => b.onclick = () => decide(d, d.decision === b.dataset.d ? null : b.dataset.d, card));
      card.querySelector("[data-a4]").onclick = (e) => exportA4(d, e.currentTarget);
      card.querySelectorAll("a[data-go]").forEach((a) => a.onclick = (e) => { e.preventDefault(); openDetail(a.dataset.go); });
      card.querySelector('[data-panel="coment"]').addEventListener("toggle", (e) => { if (e.target.open) renderCommentBox(card, d); else if (rec.card === card) resetRec(); });
      card.querySelector('[data-panel="kit"]').addEventListener("toggle", (e) => { if (e.target.open) renderKit(card, d); });
    }

    // ---------- decisiones ----------
    let toastTimer = null;
    async function decide(d, decision, card) {
      const prev = { decision: d.decision, decidido_en: d.decidido_en };
      const patch = { decision, decidido_en: decision ? new Date().toISOString() : null };
      Object.assign(d, patch);
      const cola = inQueue();
      const leaves = !cola && !isGrid() && !state.detail && decision !== state.tab;
      if (leaves && card) { card.classList.add("fading"); setTimeout(render, 250); } else render();
      // en la cola: se ve un instante lo marcado y pasa solo al siguiente
      if (cola && decision) setTimeout(() => { if (inQueue() && state.queue[state.idx] === d.id) go(1); }, 220);
      const { error } = await client.from(T_DISENOS).update(patch).eq("id", d.id);
      if (error) { Object.assign(d, prev); render(); showMsg("No se pudo guardar: " + error.message); return; }
      showMsg("");
      if (cola || (isGrid() && !state.detail)) return; // en la cola se deshace volviendo atrás; en la cuadrícula, tocando otra vez
      const txt = decision === "revisar" ? `🔁 Nº ${d.numero}: la rutina hará otra versión con tus comentarios` : decision ? `${DECISION_LABEL[decision]} · nº ${d.numero}` : `Nº ${d.numero} vuelve a Por decidir`;
      showToast(txt, async () => {
        Object.assign(d, prev); render();
        await client.from(T_DISENOS).update(prev).eq("id", d.id);
      });
    }

    // Varias decisiones de golpe (descartar el resto), con Deshacer.
    async function bulkSet(ids, patch) {
      for (let i = 0; i < ids.length; i += 60) {
        const { error } = await client.from(T_DISENOS).update(patch).in("id", ids.slice(i, i + 60));
        if (error) return error;
      }
      return null;
    }
    async function bulkDecide(list, decision) {
      const ids = list.map((d) => d.id), patch = { decision, decidido_en: new Date().toISOString() };
      list.forEach((d) => Object.assign(d, patch)); render();
      const error = await bulkSet(ids, patch);
      if (error) { showMsg("No se pudo guardar: " + error.message); await refresh(null); return; }
      showMsg("");
      showToast(`👎 ${ids.length} descartados`, async () => {
        const back = { decision: null, decidido_en: null };
        list.forEach((d) => Object.assign(d, back)); render();
        const e2 = await bulkSet(ids, back);
        if (e2) showMsg("No se pudo deshacer: " + e2.message);
      }, 12000);
    }

    // ---------- comentarios ----------
    const audioUrl = (path) => `${url}/storage/v1/object/public/${BUCKET}/${path}`;
    function commentsListHTML(id) {
      const cs = commentsOf(id);
      if (!cs.length) return "";
      return cs.map((c) => `<div class="comment">
          <div class="head"><span>${c.tipo === "audio" ? "🎤 Audio" : "📝 Nota"} · ${new Date(c.created_at).toLocaleString("es-ES", { dateStyle: "short", timeStyle: "short" })}${c.duracion_seg ? " · " + c.duracion_seg + " s" : ""}</span><span class="estado ${c.estado}">${ESTADO_LABEL[c.estado] || c.estado}</span></div>
          ${c.tipo === "texto" ? `<div>${esc(c.texto)}</div>` : `<audio controls preload="none" src="${audioUrl(c.audio_path)}"></audio>`}
          ${c.transcripcion ? `<div class="trans">“${esc(c.transcripcion)}”</div>` : (c.tipo === "audio" && c.estado !== "procesado" ? `<div class="trans">Sin transcripción: la rutina no puede oírlo. Usa Dictar para que llegue como texto.</div>` : "")}
        </div>`).join("");
    }
    function commentBoxHTML(id, placeholder) {
      return `<div data-list>${commentsListHTML(id)}</div>
        <textarea data-nota placeholder="${esc(placeholder)}"></textarea>
        <div class="row">
          <button type="button" data-dictar>🎙️ Dictar</button>
          <button type="button" data-rec>🎤 Grabar</button>
          <button type="button" class="primary" data-guardar>Guardar</button>
        </div>
        <div data-preview></div>`;
    }
    function renderCommentBox(card, d) {
      const box = card.querySelector("[data-comment-box]");
      box.innerHTML = commentBoxHTML(d ? d.id : null, d ? "Qué cambiarías: «la tilde más grande», «pruébalo en negro», «el 10 más pequeño»…" : "Pide algo general: «más como el 6 pero en negro», «quiero ver una ñ», «más estilo periódico»…")
        + `<p class="helper">Dictar convierte tu voz en texto aquí mismo (es lo que mejor entiende la rutina). Grabar guarda el audio. La rutina lee tus comentarios y crea versiones nuevas numeradas${d ? " a partir de esta" : ""}.</p>`;
      const q = (s) => box.querySelector(s);
      q("[data-guardar]").onclick = () => { stopDictate(); saveText(box, d); };
      q("[data-dictar]").onclick = () => toggleDictate(box);
      q("[data-rec]").onclick = () => { stopDictate(); toggleRec(box, d); };
    }
    function refreshComments(box, d) {
      box.querySelector("[data-list]").innerHTML = commentsListHTML(d ? d.id : null);
      const card = box.closest(".card");
      if (card && d) {
        const nc = commentsOf(d.id).length, np = pendingComments(d.id);
        card.querySelector('[data-panel="coment"] > summary').textContent = `💬 Comentar (${nc}${np ? `, ${np} por usar` : ""})`;
      }
    }
    async function saveText(box, d) {
      const ta = box.querySelector("[data-nota]");
      const texto = ta.value.trim();
      if (!texto) return;
      const { data, error } = await client.from(T_COMENTARIOS).insert({ diseno_id: d ? d.id : null, tipo: "texto", texto }).select().single();
      if (error) { showMsg("No se pudo guardar el comentario: " + error.message); return; }
      comentarios.push(data);
      ta.value = "";
      refreshComments(box, d);
      showToast(d ? `📝 Comentario guardado en el nº ${d.numero}` : "📝 Petición guardada");
    }

    // dictado (Web Speech API)
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
    const dict = { rec: null, on: false, box: null };
    function startSR(onFinal, onEnd) {
      if (!SR) return null;
      const r = new SR();
      r.lang = "es-ES"; r.continuous = true; r.interimResults = false;
      r.onresult = (e) => { for (let k = e.resultIndex; k < e.results.length; k++) if (e.results[k].isFinal) onFinal(e.results[k][0].transcript.trim()); };
      r.onerror = () => {};
      r.onend = () => onEnd && onEnd();
      try { r.start(); } catch { return null; }
      return r;
    }
    function toggleDictate(box) {
      if (dict.on) return stopDictate();
      if (!SR) { showMsg("Este navegador no permite dictar; usa Grabar o escribe."); return; }
      const ta = box.querySelector("[data-nota]");
      dict.rec = startSR((t) => { ta.value = (ta.value.trim() ? ta.value.trim() + " " : "") + t; }, () => { if (dict.on) { try { dict.rec.start(); } catch {} } });
      if (!dict.rec) { showMsg("No se pudo iniciar el dictado."); return; }
      dict.on = true; dict.box = box;
      const b = box.querySelector("[data-dictar]"); b.classList.add("on"); b.textContent = "⏹ Parar";
      showMsg("");
    }
    function stopDictate() {
      dict.on = false;
      if (dict.rec) { try { dict.rec.stop(); } catch {} dict.rec = null; }
      const b = dict.box && dict.box.querySelector("[data-dictar]"); if (b) { b.classList.remove("on"); b.textContent = "🎙️ Dictar"; }
      dict.box = null;
    }

    // audio (MediaRecorder) + transcripción simultánea si el navegador puede
    const rec = { recorder: null, stream: null, chunks: [], blob: null, url: "", mime: "", texto: [], box: null, card: null };
    function pickMime() {
      if (!window.MediaRecorder) return "";
      for (const m of ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus", "audio/ogg"]) if (MediaRecorder.isTypeSupported(m)) return m;
      return "";
    }
    const extOf = (mime) => mime.includes("webm") ? "webm" : mime.includes("mp4") ? "m4a" : mime.includes("ogg") ? "ogg" : "bin";
    async function toggleRec(box, d) {
      if (rec.recorder && rec.recorder.state === "recording") return stopRec();
      resetRec();
      if (!navigator.mediaDevices || !window.MediaRecorder) { showMsg("Este navegador no permite grabar audio."); return; }
      try { rec.stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
      catch (err) { showMsg("Sin acceso al micrófono: " + err.message); return; }
      rec.box = box; rec.card = box.closest(".card");
      rec.mime = pickMime(); rec.chunks = []; rec.texto = [];
      rec.recorder = new MediaRecorder(rec.stream, rec.mime ? { mimeType: rec.mime } : undefined);
      rec.recorder.ondataavailable = (e) => { if (e.data && e.data.size) rec.chunks.push(e.data); };
      rec.recorder.onstop = () => {
        rec.stream.getTracks().forEach((t) => t.stop());
        rec.blob = new Blob(rec.chunks, { type: rec.recorder.mimeType || rec.mime || "audio/webm" });
        rec.mime = rec.blob.type;
        rec.url = URL.createObjectURL(rec.blob);
        showPreview(box, d);
      };
      rec.startedAt = Date.now();
      rec.recorder.start(1000);
      rec.sr = startSR((t) => rec.texto.push(t), () => { if (rec.recorder && rec.recorder.state === "recording" && rec.sr) { try { rec.sr.start(); } catch {} } });
      const b = box.querySelector("[data-rec]"); b.classList.add("on"); b.textContent = "⏹ 0:00";
      rec.timer = setInterval(() => { const s = Math.round((Date.now() - rec.startedAt) / 1000); b.textContent = `⏹ ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }, 250);
      box.querySelector("[data-preview]").innerHTML = "";
    }
    function stopRec() {
      clearInterval(rec.timer);
      if (rec.sr) { const r = rec.sr; rec.sr = null; try { r.stop(); } catch {} }
      const b = rec.box && rec.box.querySelector("[data-rec]"); if (b) { b.classList.remove("on"); b.textContent = "🎤 Grabar"; }
      if (rec.recorder && rec.recorder.state !== "inactive") rec.recorder.stop();
    }
    function resetRec() {
      if (rec.recorder && rec.recorder.state === "recording") { rec.recorder.onstop = () => rec.stream.getTracks().forEach((t) => t.stop()); }
      stopRec();
      if (rec.url) URL.revokeObjectURL(rec.url);
      const pv = rec.box && rec.box.querySelector("[data-preview]"); if (pv) pv.innerHTML = "";
      Object.assign(rec, { recorder: null, stream: null, chunks: [], blob: null, url: "", box: null, card: null });
    }
    function showPreview(box, d) {
      const sec = Math.max(1, Math.round((Date.now() - rec.startedAt) / 1000));
      const pv = box.querySelector("[data-preview]");
      pv.innerHTML = `<div class="rec-preview"><p class="helper">Audio grabado · ${sec} s${rec.texto.length ? " · con transcripción" : ""}</p>
        <audio controls src="${rec.url}"></audio>
        <div class="row"><button type="button" data-descartar>Descartar</button><button type="button" class="primary" data-subir>💾 Guardar audio</button></div></div>`;
      pv.querySelector("[data-descartar]").onclick = resetRec;
      pv.querySelector("[data-subir]").onclick = () => saveAudio(box, d, sec);
    }
    async function saveAudio(box, d, sec) {
      const btn = box.querySelector("[data-subir]"); btn.disabled = true; btn.textContent = "Subiendo…";
      const path = `${d ? d.id : "general"}/${new Date().toISOString().replace(/[:.]/g, "-")}.${extOf(rec.mime)}`;
      const up = await client.storage.from(BUCKET).upload(path, rec.blob, { contentType: rec.mime || "audio/webm", upsert: false });
      if (up.error) { showMsg("No se pudo subir el audio: " + up.error.message); btn.disabled = false; btn.textContent = "💾 Guardar audio"; return; }
      const transcripcion = rec.texto.join(" ").trim() || null;
      const { data, error } = await client.from(T_COMENTARIOS).insert({ diseno_id: d ? d.id : null, tipo: "audio", audio_path: path, audio_mime: rec.mime, duracion_seg: sec, transcripcion, estado: transcripcion ? "transcrito" : "pendiente" }).select().single();
      if (error) { showMsg("Audio subido pero no se pudo registrar: " + error.message); btn.disabled = false; btn.textContent = "💾 Guardar audio"; return; }
      comentarios.push(data);
      resetRec();
      refreshComments(box, d);
      showToast(transcripcion ? "🎤 Audio guardado con transcripción" : "🎤 Audio guardado (sin transcripción)");
    }

    // ---------- kit y guía de marca ----------
    function renderKit(card, d) {
      const c = C(d);
      const box = card.querySelector("[data-kit-box]");
      const sw = (label, hex) => `<button type="button" class="sw" data-copy="${esc(hex)}"><i style="background:${esc(hex)}"></i>${esc(label)}<br><b>${esc(hex)}</b></button>`;
      box.innerHTML = `
        <h4>Colores</h4>
        <div class="swatches">${sw("Fondo", c.icono_fondo)}${sw("Tinta", c.icono_tinta)}${sw("Acento", c.acento)}${sw("Error", c.error)}${sw("Acierto", c.acierto)}</div>
        <h4>Tipografía</h4>
        <p class="helper" style="margin:0">Poppins para la app, la web y los Reels (Google Fonts, licencia libre OFL). El logo va en trazados: no necesita tipografía instalada.</p>
        <h4>Así se ve en una pestaña del navegador</h4>
        <div style="background:#e9e7e1;border-radius:10px;padding:8px 8px 0"><span class="tab-mock">${icon(d, "", true)}Ortografía10</span></div>
        <h4>Descargas</h4>
        <div class="dl">
          <button type="button" data-png="full:1024">Icono tiendas 1024 PNG</button>
          <button type="button" data-png="sq:512">Icono redondeado 512 PNG</button>
          <button type="button" data-png="ci:512">Avatar círculo 512 PNG</button>
          <button type="button" data-png="sq:180">Apple touch 180 PNG</button>
          <button type="button" data-png="fav:32">Favicon 32 PNG</button>
          <button type="button" data-png="wm:1600">Nombre PNG</button>
          <button type="button" data-png="peg:1500">Pegatina PNG</button>
          <button type="button" data-svg="peg">Pegatina SVG</button>
          <button type="button" data-svg="sq">Icono SVG</button>
          <button type="button" data-svg="wm">Nombre SVG</button>
          <button type="button" data-tokens>Copiar tokens CSS</button>
        </div>
        <p class="helper">El icono de tiendas va a sangre y sin esquinas (App Store y Google Play las recortan). La pegatina en SVG es vectorial: vale para imprenta o imán de coche a cualquier tamaño.</p>`;
      box.querySelectorAll("[data-copy]").forEach((b) => b.onclick = () => copy(b.dataset.copy, "Color copiado"));
      box.querySelectorAll("[data-png]").forEach((b) => b.onclick = () => { const [k, s] = b.dataset.png.split(":"); exportPng(d, k, +s); });
      box.querySelectorAll("[data-svg]").forEach((b) => b.onclick = () => exportSvg(d, b.dataset.svg));
      box.querySelector("[data-tokens]").onclick = () => copy(`:root {\n  --o10-fondo: ${c.icono_fondo};\n  --o10-tinta: ${c.icono_tinta};\n  --o10-acento: ${c.acento};\n  --o10-error: ${c.error};\n  --o10-acierto: ${c.acierto};\n  --o10-fuente: "Poppins", system-ui, sans-serif;\n}\n/* Ortografía10, logo nº ${d.numero}: ${d.titulo} */`, "Tokens copiados");
    }
    async function copy(t, msg) { try { await navigator.clipboard.writeText(t); showToast("📋 " + msg); } catch { prompt("Copia:", t); } }

    // SVG autónomo: los logos son trazados, así que basta con resolver los
    // colores (tinta, acento, fondo) y, en los iconos, poner el fondo.
    function resolved(src, ink, acento, fondo) {
      return safeSvg(src).replace(/(fill|stroke)="currentColor"/g, `$1="${ink}"`)
        .replace(/class="acento"/g, `fill="${acento}"`).replace(/class="acento-trazo"/g, `stroke="${acento}"`)
        .replace(/class="fondo"/g, `fill="${fondo}"`).replace(/class="fondo-trazo"/g, `stroke="${fondo}"`);
    }
    const inner = (svg) => svg.replace(/^[\s\S]*?<svg[^>]*>/, "").replace(/<\/svg>\s*$/, "");
    // kind: sq (redondeado) · full (a sangre) · ci (círculo) · fav · herm · wm · peg
    function standaloneSvg(d, kind) {
      const c = C(d);
      let text;
      if (kind === "peg") text = safeSvg(d.svg_pegatina);
      else if (kind === "wm") text = resolved(d.svg_wordmark, c.wordmark, c.acento, c.wordmark_fondo);
      else {
        const src = kind === "fav" ? (d.svg_favicon || d.svg_marca) : kind === "herm" ? d.svg_hermano : d.svg_marca;
        const bg = kind === "ci" ? `<circle cx="50" cy="50" r="50" fill="${c.icono_fondo}"/>` : `<rect width="100" height="100" rx="${kind === "full" ? 0 : 22}" fill="${c.icono_fondo}"/>`;
        text = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">${bg}${inner(resolved(src, c.icono_tinta, c.acento, c.icono_fondo))}</svg>`;
      }
      const vb = ((text.match(/viewBox="([^"]*)"/) || [])[1] || "0 0 100 100").split(/[\s,]+/).map(Number);
      return { text, ratio: vb[2] / vb[3] };
    }
    async function svgImage(text, w, h) {
      const img = new Image();
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(text.replace("<svg ", `<svg width="${w}" height="${h}" `));
      await img.decode();
      return img;
    }
    function download(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
    const KIND_NAME = { wm: "nombre", fav: "favicon", ci: "avatar", peg: "pegatina", full: "icono-tiendas", sq: "icono" };
    function exportSvg(d, kind) {
      download(new Blob([standaloneSvg(d, kind).text], { type: "image/svg+xml" }), `ortografia10-${d.numero}-${KIND_NAME[kind]}.svg`);
    }
    async function exportPng(d, kind, size) {
      try {
        const { text, ratio } = standaloneSvg(d, kind);
        const cv = document.createElement("canvas");
        cv.width = size; cv.height = Math.round(size / ratio);
        cv.getContext("2d").drawImage(await svgImage(text, cv.width, cv.height), 0, 0, cv.width, cv.height);
        cv.toBlob((b) => download(b, `ortografia10-${d.numero}-${KIND_NAME[kind]}-${size}.png`), "image/png");
      } catch (e) { showMsg("No se pudo exportar: " + e.message); }
    }

    // ---------- A4 para imprimir (PDF de una página) ----------
    // Se dibuja en un lienzo a 200 ppp y se mete como JPEG en un PDF mínimo.
    async function a4Canvas(d) {
      // 300 ppp. Todo en milímetros reales: si se imprime al 100 %, el iPhone y sus

    }
    // A4 con los favoritos como favicon a tamaño real: 16 px de pantalla = 4,2 mm
    // (a 96 px por pulgada). Los títulos van como texto de verdad en el PDF.
    async function exportFavsA4(list, btn) {
      const old = btn.textContent; btn.disabled = true;
      try {
        const K = 3508 / 297, mm = (v) => v * K, PX = 25.4 / 96, px = (v) => v * PX;
        const cv = document.createElement("canvas"); cv.width = 2480; cv.height = 3508;
        const g = cv.getContext("2d"); g.imageSmoothingQuality = "high";
        const text = (t, x, y, size, weight = 500, color = "#141413", align = "left") => { g.font = `${weight} ${mm(size)}px Poppins, sans-serif`; g.fillStyle = color; g.textAlign = align; g.textBaseline = "alphabetic"; g.fillText(t, mm(x), mm(y)); };
        const rr = (x, y, w, h, r, fill, stroke, lw = 0.2) => { g.beginPath(); g.roundRect(mm(x), mm(y), mm(w), mm(h), mm(r)); if (fill) { g.fillStyle = fill; g.fill(); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = mm(lw); g.stroke(); } };
        const osc = !!state.favOsc, nums = !!state.numsPhone, POR = 4, FILAS = 8;
        const col = osc ? { vent: "#292a2d", tira: "#1b1c1f", tinta: "#e8eaed", gris: "#9aa0a6", caja: "#1b1c1f", borde: "#3c4043" } : { vent: "#ffffff", tira: "#dfe3ee", tinta: "#1f1f1f", gris: "#5f6368", caja: "#f1f3f4", borde: "#c9ccd3" };
        const favicon = async (d, x, y, lado) => { const c = C(d), p = Math.round(mm(lado)); g.drawImage(await svgImage(standaloneSvg(d, "fav").text, p, p), mm(x), mm(y), mm(lado), mm(lado)); if (lum(c.icono_fondo) > 225) rr(x, y, lado, lado, lado * 0.22, null, "rgba(0,0,0,.25)", 0.06); };
        const pages = [], textos = [], porHoja = POR * FILAS, total = Math.ceil(list.length / porHoja);
        for (let p = 0; p < list.length; p += porHoja) {
          btn.textContent = `Preparando hoja ${p / porHoja + 1} de ${total}…`; await new Promise((r) => setTimeout(r, 30));
          const vt = [];
          g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height);
          text("Ortografía10", 15, 21, 6.2, 800);
          text("tus favoritos como favicon", 15 + g.measureText("Ortografía10 ").width / K + 1, 21, 6.2, 400, "#6b6a66");
          text(total > 1 ? `hoja ${p / porHoja + 1} de ${total}` : "ortografia10.com", 195, 21, 3.4, 600, "#6b6a66", "right");
          text("Pestañas de navegador a tamaño real: el favicon mide 16 píxeles (4,2 mm). Es lo que se ve cuando alguien tiene tu web abierta.", 15, 28.5, 2.9, 500, "#3b3a37");
          g.fillStyle = "#141413"; g.fillRect(mm(15), mm(32), mm(180), mm(0.35));
          const W = 180, tw = W / POR;
          for (let f = 0; f < FILAS; f++) {
            const grupo = list.slice(p + f * POR, p + f * POR + POR); if (!grupo.length) break;
            const Y = 38 + f * 29.5;
            rr(15, Y, W, px(98), 2.4, col.vent, col.borde);
            g.save(); g.beginPath(); g.roundRect(mm(15), mm(Y), mm(W), mm(px(98)), mm(2.4)); g.clip();
            g.fillStyle = col.tira; g.fillRect(mm(15), mm(Y), mm(W), mm(px(40)));
            rr(15 + px(8), Y + px(6), tw - px(8), px(40), px(8), col.vent);
            g.restore();
            for (let k = 0; k < grupo.length; k++) {
              const d = grupo[k], x = 15 + k * tw + px(8) + px(10);
              await favicon(d, x, Y + px(15), px(16));
              // el título se corta con «…» donde lo cortaría el navegador
              let t = (nums ? `nº ${d.numero} · ` : "") + "Ortografía10 · Una regla. Un minuto.";
              g.font = `400 ${mm(px(12))}px Helvetica, Arial, "Liberation Sans", sans-serif`;
              if (g.measureText(t).width > mm(tw - px(66))) { while (t.length > 4 && g.measureText(t + "…").width > mm(tw - px(66))) t = t.slice(0, -1); t = t.trimEnd() + "…"; }
              vtexto(g, K, vt, t, x + px(24), Y + px(27.5), px(12), col.tinta);
              vtexto(g, K, vt, "x", 15 + (k + 1) * tw - px(16), Y + px(27.5), px(11), col.gris);
              await favicon(d, 15 + px(12) + k * px(150), Y + px(76), px(16));
              vtexto(g, K, vt, nums ? "nº " + d.numero : "Ortografía10", 15 + px(12) + k * px(150) + px(22), Y + px(88.5), px(12), col.tinta);
            }
            rr(15 + px(92), Y + px(46), W - px(130), px(24), px(12), col.caja);
            vtexto(g, K, vt, "https://ortografia10.com", 15 + px(106), Y + px(62.5), px(12), col.tinta);
            vtexto(g, K, vt, "<    >    o", 15 + px(14), Y + px(62.5), px(12), col.gris);
            text("nº " + grupo.map((d) => d.numero).join(" · "), 195, Y + px(98) + 3.2, 2.1, 500, "#6b6a66", "right");
          }
          text("Arriba, el favicon en la pestaña; abajo, en la barra de marcadores. Ordenados de mejor a peor nota.", 15, 277, 2.6, 500, "#6b6a66");
          g.fillStyle = "#141413"; g.fillRect(mm(15), mm(283), mm(50), mm(0.3)); g.fillRect(mm(15), mm(281.5), mm(0.3), mm(3)); g.fillRect(mm(65 - 0.3), mm(281.5), mm(0.3), mm(3));
          text("Esta línea mide 5 cm si has impreso al 100 % (sin «ajustar a la página»).", 68, 284, 2.6, 500, "#6b6a66");
          pages.push(jpegBytes(cv)); textos.push(vt);
        }
        download(jpegPdf(pages, cv.width, cv.height, textos), "ortografia10-favoritos-favicon-A4.pdf");
        showToast(`⬇️ A4 con ${list.length} favicons en ${total} ${total === 1 ? "hoja" : "hojas"}`);
      } catch (e) { showMsg("No se pudo preparar el A4: " + e.message); }
      finally { btn.disabled = false; btn.textContent = old; }
    }
    function emptyHTML() {
      return `<div class="empty"><div class="big">${state.tab === "pendiente" ? "✅" : "📭"}</div><div>${state.tab === "pendiente" ? "No queda nada por decidir." : "Nada por aquí todavía."}</div><p class="helper">${state.tab === "pendiente" ? "Comenta alguno o pide algo general y la rutina te traerá propuestas nuevas." : ""}</p></div>`;
    }

    // ---------- utilidades ----------
    function showMsg(t) { el("msg").textContent = t; }
    function showToast(t, undo, ms = 5000) {
      el("toast-text").textContent = t;
      const u = el("toast-undo");
      u.textContent = undo ? "Deshacer" : "";
      u.onclick = undo ? () => { hideToast(); undo(); } : null;
      el("toast").classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(hideToast, ms);
    }
    function hideToast() { el("toast").classList.remove("show"); }

    async function refresh(btn) {
      btn && btn.classList.add("spin");
      try { await load(); showMsg(""); render(); }
      catch (err) { showMsg("Sin conexión con Supabase: " + (err.message || err)); }
      finally { btn && btn.classList.remove("spin"); }
    }

    async function init() {
      document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", async () => {
        resetRec(); stopDictate(); state.tab = t.dataset.tab; state.detail = null; state.snap = null; state.favs = false; state.phone = false;
        if ((state.tab === "no_gusta" || state.tab === "todos") && !restoCargado) {
          document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("active", x === t));
          el("view").innerHTML = `<p class="eyebrow">Cargando…</p>`;
          try { await loadResto(); } catch (e) { showMsg("Sin conexión con Supabase: " + (e.message || e)); }
        }
        if (state.tab === "pendiente") buildQueue(true);
        render(); window.scrollTo(0, 0);
      }));
      WIDE.addEventListener("change", () => { resetRec(); stopDictate(); render(); });
      // teclado (pantalla grande): ← → para moverse, N no · O otra · G me gusta · F final
      document.addEventListener("keydown", (e) => {
        if (!inQueue() || e.metaKey || e.ctrlKey || e.altKey || /^(TEXTAREA|INPUT|SELECT)$/.test(e.target.tagName)) return;
        if (e.key === "ArrowLeft") return go(-1);
        if (e.key === "ArrowRight") return go(1);
        const k = { n: "no_gusta", o: "revisar", g: "gusta", f: "definitivo" }[e.key.toLowerCase()], d = byId(state.queue[state.idx]);
        if (k && d) decide(d, d.decision === k ? null : k, null);
      });
      el("btn-refresh").addEventListener("click", (e) => refresh(e.currentTarget));
      el("btn-grid").addEventListener("click", () => {
        if (state.tab === "todos") return; // «Todos» siempre va en cuadrícula
        state.grid = !state.grid; state.detail = null; state.snap = null;
        try { localStorage.setItem("ortologo.grid", state.grid ? "1" : "0"); } catch {}
        if (!state.grid && state.tab === "pendiente") buildQueue(true);
        resetRec(); stopDictate(); render(); window.scrollTo(0, 0);
      });
      if (!url || !anonKey) { showMsg("Faltan credenciales en config.js"); return; }
      client = supabase.createClient(url, anonKey);
      // las marcas se miden con la fuente ya cargada (si no, el encaje sale mal)
      try { await Promise.all(["500", "600", "700", "800", "900", "italic 700", "italic 800", "italic 900"].map((v) => document.fonts.load(`${v.includes("italic") ? v : "normal " + v} 40px Poppins`, "Ortografía10"))); } catch {}
      await refresh(null);
      const m = location.hash.match(/^#(\d+)$/);
      if (m) {
        let d = disenos.find((x) => x.numero === +m[1]);
        if (!d) { const one = await client.from(T_DISENOS).select(LIGERO).eq("numero", +m[1]).maybeSingle(); if (one.data) { d = one.data; disenos.push(d); disenos.sort((x, y) => x.numero - y.numero); } }
        if (d) openDetail(d.id);
      }
    }
    init();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>

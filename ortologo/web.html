<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ortografía10 · el logo en una web</title>
  <meta name="theme-color" content="#141839" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="fonts/poppins.css" />
  <style>
    @font-face { font-family: "Inter"; font-weight: 400; src: url(fonts/inter-400.woff2) format("woff2"); font-display: swap; }
    @font-face { font-family: "Inter"; font-weight: 600; src: url(fonts/inter-600.woff2) format("woff2"); font-display: swap; }
    @font-face { font-family: "Inter"; font-weight: 700; src: url(fonts/inter-700.woff2) format("woff2"); font-display: swap; }
    :root { --tinta: #141413; --gris: #6b6a66; --linea: #e6e4dd; --papel: #f6f2ea; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #ecebe7; color: var(--tinta); font-family: "Inter", "Poppins", system-ui, sans-serif; font-size: 14px; }
    a { color: inherit; }
    .top { position: sticky; top: 0; z-index: 5; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(6px); border-bottom: 1px solid var(--linea); }
    .top .in { max-width: 1500px; margin: 0 auto; padding: 10px 18px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
    .top a.back { font-weight: 700; text-decoration: none; white-space: nowrap; }
    .top h1 { font-family: "Poppins", sans-serif; font-size: 1rem; margin: 0; flex: 1; min-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .top h1 span { font-weight: 500; color: var(--gris); }
    .estilos { display: flex; gap: 6px; flex-wrap: wrap; }
    .estilos button, .nav-n button { border: 1px solid var(--linea); background: #fff; border-radius: 999px; padding: 7px 14px; font: inherit; font-weight: 600; font-size: 0.82rem; cursor: pointer; }
    .estilos button.on { background: var(--tinta); border-color: var(--tinta); color: #fff; }
    .favs { max-width: 1500px; margin: 0 auto; padding: 10px 18px 0; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: thin; }
    .favs a { flex: none; width: 46px; text-decoration: none; text-align: center; font-size: 0.62rem; color: var(--gris); }
    .favs a .mini { width: 46px; height: 46px; border-radius: 22.5%; overflow: hidden; outline: 3px solid transparent; outline-offset: 2px; }
    .favs a.on .mini { outline-color: var(--tinta); }
    .favs .mini svg { display: block; width: 100%; height: 100%; }
    .nota { max-width: 1500px; margin: 0 auto; padding: 8px 18px 0; color: var(--gris); font-size: 0.8rem; }
    .escena { max-width: 1500px; margin: 0 auto; padding: 16px 18px 40px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px; align-items: start; }
    @media (max-width: 900px) { .escena { grid-template-columns: 1fr; } .movil-wrap { justify-self: center; } }
    .cap { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gris); margin: 0 0 8px; }
    /* navegador de escritorio */
    .browser { border-radius: 12px; overflow: hidden; background: #fff; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.18), 0 0 0 1px rgba(0, 0, 0, 0.08); }
    .chrome { background: #dfe3ee; padding: 7px 10px 0; display: flex; align-items: flex-end; gap: 8px; }
    .dots { display: flex; gap: 6px; padding: 0 6px 10px; } .dots i { width: 11px; height: 11px; border-radius: 50%; display: block; }
    .tab { background: #fff; border-radius: 9px 9px 0 0; padding: 8px 12px; display: flex; align-items: center; gap: 8px; font-size: 12px; min-width: 0; max-width: 260px; }
    .tab .fv { width: 16px; height: 16px; border-radius: 22%; overflow: hidden; flex: none; } .tab .fv svg { display: block; width: 100%; height: 100%; }
    .tab span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .barra { display: flex; align-items: center; gap: 12px; padding: 7px 12px; border-bottom: 1px solid #eceef1; color: #5f6368; font-size: 12px; }
    .barra b { flex: 1; font-weight: 400; background: #f1f3f4; border-radius: 99px; padding: 5px 14px; color: #1f1f1f; }
    .vista { position: relative; overflow: hidden; background: #fff; }
    .vista iframe { border: 0; transform-origin: 0 0; position: absolute; left: 0; top: 0; background: #fff; }
    /* iPhone */
    .movil-wrap { width: 330px; }
    .iph { width: 330px; height: 690px; border-radius: 52px; background: #1b1b1f; padding: 12px; box-shadow: 0 0 0 2px #3a3a40 inset, 0 24px 50px rgba(0, 0, 0, 0.28); position: relative; }
    .iph .pant { width: 100%; height: 100%; border-radius: 41px; overflow: hidden; position: relative; background: #fff; }
    .iph .isla { position: absolute; top: 10px; left: 50%; width: 98px; height: 29px; margin-left: -49px; border-radius: 99px; background: #000; z-index: 3; }
    .iph iframe { border: 0; width: 390px; height: 790px; transform-origin: 0 0; position: absolute; left: 0; top: 42px; }
    .iph .estado { position: absolute; left: 0; right: 0; top: 0; height: 42px; z-index: 2; display: flex; justify-content: space-between; align-items: center; padding: 4px 30px 0; font: 600 13px -apple-system, "SF Pro Text", Helvetica, Arial, sans-serif; }
    .ayuda { font-size: 0.75rem; color: var(--gris); margin-top: 10px; line-height: 1.45; }
    .tipos { max-width: 1500px; margin: 0 auto; padding: 0 18px 40px; }
    .tipos .card { background: #fff; border-radius: 16px; padding: 18px 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px 28px; }
    .tipos h3 { margin: 0 0 4px; font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gris); }
    .tipos p { margin: 0; line-height: 1.5; }
    .vacio { padding: 80px 20px; text-align: center; color: var(--gris); }
  </style>
</head>
<body>
  <div class="top"><div class="in">
    <a class="back" href="./">← Los logos</a>
    <h1 id="titulo">Cargando…</h1>
    <div class="estilos" id="estilos"></div>
  </div></div>
  <div class="favs" id="favs"></div>
  <p class="nota">Arriba, tus 👍 y ⭐: toca uno para verlo en la web. Las dos pantallas son la misma página, de verdad: puedes hacer scroll dentro de cada una.</p>

  <div class="escena" id="escena"><div class="vacio">Cargando el diseño…</div></div>
  <div class="tipos"><div class="card" id="tipos"></div></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script>
    // Maquetas de la web de Ortografía10 con cada logo: escritorio (1280 px) y móvil
    // (390 px), en cuatro estilos. La página es HTML de verdad dentro de un iframe,
    // así que se puede hacer scroll y se ve con la tipografía real.
    const Y = "#FECB3B", N = "#141839", K = "#111111", R = "#E8443A", V = "#3FD480";
    const ESTILOS = {
      simple: { nombre: "Simple", tipos: ["Títulos: Inter Bold, grande y apretada.", "Texto: Inter Regular a 17 px.", "Botones negros redondos, mucho blanco y una sola llamada a la acción. Inspirado en Easlo y en webs de producto tipo Notion."] },
      calida: { nombre: "Cálida", tipos: ["Títulos: Fraunces (una serifa de libro, cercana).", "Texto: Inter Regular.", "Fondo papel muy claro, botones azul noche. Tranquila y de confianza, en la línea de Claude."] },
      oscura: { nombre: "Oscura", tipos: ["Títulos: Poppins ExtraBold, la misma letra del logo y de los Reels.", "Texto: Inter en gris claro.", "Fondo azul noche, amarillo para lo importante. Continúa la estética de los vídeos, como Metalmaniac."] },
      sangre: { nombre: "A todo color", tipos: ["Títulos: Poppins ExtraBold.", "Texto: Inter.", "La página entera en el amarillo de la marca, como el icono. Es la más reconocible y la más cansada si se abusa."] },
    };
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const hex = (h, d) => (/^#[0-9a-f]{3,8}$/i.test(h || "") ? h : d);
    const lum = (h) => { h = (h || "").replace("#", ""); if (h.length < 6) return 0; const [r, g, b] = [0, 2, 4].map((i) => parseInt(h.substr(i, 2), 16)); return 0.299 * r + 0.587 * g + 0.114 * b; };
    function safe(str) {
      try {
        const doc = new DOMParser().parseFromString(str || "", "image/svg+xml"), svg = doc.documentElement;
        if (!svg || svg.nodeName.toLowerCase() !== "svg" || doc.querySelector("parsererror")) return "";
        svg.querySelectorAll("script,foreignObject,iframe,image,a,animate,set,style").forEach((n) => n.remove());
        for (const n of [svg, ...svg.querySelectorAll("*")]) for (const a of [...n.attributes]) { const k = a.name.toLowerCase(); if (k.startsWith("on") || ((k === "href" || k === "xlink:href") && !a.value.startsWith("#"))) n.removeAttribute(a.name); }
        svg.removeAttribute("width"); svg.removeAttribute("height");
        return new XMLSerializer().serializeToString(svg);
      } catch { return ""; }
    }
    // colores resueltos dentro del SVG (en el iframe no hay clases de la app)
    const colorea = (svg, tinta, acento, fondo) => safe(svg).replace(/(fill|stroke)="currentColor"/g, `$1="${tinta}"`).replace(/class="acento"/g, `fill="${acento}"`).replace(/class="acento-trazo"/g, `stroke="${acento}"`).replace(/class="fondo"/g, `fill="${fondo}"`).replace(/class="fondo-trazo"/g, `stroke="${fondo}"`);
    const dentro = (svg) => svg.replace(/^[\s\S]*?<svg[^>]*>/, "").replace(/<\/svg>\s*$/, "");
    function icono(d, px, radio = "22.5%", sombra = "") {
      const c = d.colores || {}, f = hex(c.icono_fondo, N), t = hex(c.icono_tinta, Y), a = hex(c.acento, Y);
      return `<span style="display:inline-block;width:${px}px;height:${px}px;border-radius:${radio};overflow:hidden;background:${f};flex:none;${sombra}"><svg viewBox="0 0 100 100" style="display:block;width:100%;height:100%">${dentro(colorea(d.svg_marca, t, a, f))}</svg></span>`;
    }
    // el nombre en una línea, en el color que pida el fondo de la web
    function nombre(d, alto, tinta) {
      const c = d.colores || {}, a = hex(c.acento, Y);
      const s = colorea(d.svg_wordmark, tinta, lum(a) > 160 && lum(tinta) < 100 ? tinta : a, "transparent");
      return s.replace("<svg ", `<svg style="height:${alto}px;width:auto;display:block" `);
    }

    function landing(d, est) {
      const c = d.colores || {}, fondoLogo = hex(c.icono_fondo, N), tintaLogo = hex(c.icono_tinta, Y);
      const oscuroLogo = lum(fondoLogo) < 100;            // el logo es de fondo oscuro
      const marcaOsc = oscuroLogo ? fondoLogo : tintaLogo;  // el color «oscuro» de la marca (azul noche o negro)
      const P = {
        simple: { bg: "#ffffff", alt: "#f7f7f7", tx: "#111111", sub: "#555555", btn: "#111111", btx: "#ffffff", btn2: "#f1f1f1", btx2: "#111111", h: "'Inter', sans-serif", hw: 700, hs: "-0.035em", nombre: "#111111", card: "#ffffff", borde: "#ececec", subr: Y },
        calida: { bg: "#faf8f3", alt: "#f2eee4", tx: "#1d1b16", sub: "#5c574c", btn: marcaOsc, btx: "#ffffff", btn2: "#ebe6d9", btx2: "#1d1b16", h: "'Fraunces', Georgia, serif", hw: 600, hs: "-0.02em", nombre: marcaOsc, card: "#ffffff", borde: "#e6e0d2", subr: Y },
        oscura: { bg: oscuroLogo ? fondoLogo : N, alt: oscuroLogo ? "rgba(255,255,255,.05)" : "rgba(255,255,255,.05)", tx: "#f3f1ea", sub: "#aeb3cc", btn: Y, btx: N, btn2: "rgba(255,255,255,.1)", btx2: "#f3f1ea", h: "'Poppins', sans-serif", hw: 800, hs: "-0.025em", nombre: Y, card: "rgba(255,255,255,.06)", borde: "rgba(255,255,255,.1)", subr: Y },
        sangre: { bg: Y, alt: "#f5bf27", tx: marcaOsc, sub: "#3b3a37", btn: marcaOsc, btx: Y, btn2: "rgba(0,0,0,.08)", btx2: marcaOsc, h: "'Poppins', sans-serif", hw: 800, hs: "-0.025em", nombre: marcaOsc, card: "#fff3cc", borde: "rgba(0,0,0,.08)", subr: "#fff" },
      }[est];
      const reels = [["Busca el error", "Ayer conduje mi cami<u>on</u>."], ["¿Bien o mal?", "Haber si nos vemos."], ["La regla", "si no · sino"], ["¿Lleva tilde?", "Aún no ha llegado."]];
      const css = `
        @font-face{font-family:Inter;font-weight:400;src:url(fonts/inter-400.woff2)}@font-face{font-family:Inter;font-weight:500;src:url(fonts/inter-500.woff2)}@font-face{font-family:Inter;font-weight:600;src:url(fonts/inter-600.woff2)}@font-face{font-family:Inter;font-weight:700;src:url(fonts/inter-700.woff2)}@font-face{font-family:Inter;font-weight:800;src:url(fonts/inter-800.woff2)}
        @font-face{font-family:Fraunces;font-weight:600;src:url(fonts/fraunces-600.woff2)}@font-face{font-family:Fraunces;font-weight:700;src:url(fonts/fraunces-700.woff2)}
        *{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:${P.bg};color:${P.tx};font-family:Inter,system-ui,sans-serif;font-size:17px;line-height:1.55}
        a{color:inherit;text-decoration:none}.w{max-width:1120px;margin:0 auto;padding:0 28px}
        h1,h2,h3{font-family:${P.h};font-weight:${P.hw};letter-spacing:${P.hs};line-height:1.06;margin:0}
        header{position:sticky;top:0;z-index:3;background:${P.bg}ee;backdrop-filter:blur(8px);border-bottom:1px solid ${P.borde}}
        header .w{display:flex;align-items:center;gap:28px;height:72px}.logo{display:flex;align-items:center;gap:10px}
        nav{display:flex;gap:26px;flex:1;font-size:15px;color:${P.sub};${est === "oscura" ? "text-transform:uppercase;letter-spacing:.08em;font-size:12.5px;font-weight:600;" : ""}}
        .b{display:inline-flex;align-items:center;gap:9px;border-radius:999px;padding:13px 24px;font-weight:600;font-size:16px;background:${P.btn};color:${P.btx};white-space:nowrap}
        .b.s{background:${P.btn2};color:${P.btx2}}.b.p{padding:9px 18px;font-size:14px}
        .hero{text-align:center;padding:84px 0 70px}.hero .ic{margin:0 auto 34px;display:block;width:max-content}
        .hero h1{font-size:68px;max-width:860px;margin:0 auto}.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,${P.subr} 62%)}
        .hero p{font-size:20px;color:${P.sub};max-width:600px;margin:22px auto 34px}.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
        .peq{font-size:13px;color:${P.sub};margin-top:16px}
        .demo{padding:20px 0 90px}.tarj{max-width:560px;margin:0 auto;background:${est === "oscura" ? "#0b0d1f" : N};color:#f6f2ea;border-radius:28px;padding:34px 30px 30px;text-align:center;box-shadow:0 30px 60px rgba(0,0,0,.18)}
        .pill{display:inline-block;font-family:Poppins,sans-serif;font-weight:700;font-size:13px;border-radius:99px;padding:4px 14px;background:#FE5F5E;color:#fff}
        .tarj .fr{font-family:Poppins,sans-serif;font-weight:800;font-size:30px;line-height:1.2;margin:18px 0 10px}.tarj u{text-decoration:none;color:${Y};background:rgba(255,255,255,.12);border-radius:5px;padding:0 1px}
        .tarj .ok{font-family:Poppins,sans-serif;font-weight:800;color:${V};font-size:24px}.tarj small{display:block;color:#aeb4d6;font-size:13px;margin-top:4px}
        .sec{padding:84px 0;background:${P.alt}}.sec h2{font-size:44px;text-align:center;max-width:720px;margin:0 auto 46px}
        .tres{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.tres div{background:${P.card};border:1px solid ${P.borde};border-radius:20px;padding:26px}
        .tres b{display:block;font-family:${P.h};font-weight:${P.hw};font-size:22px;margin-bottom:6px;letter-spacing:${P.hs}}.tres p{margin:0;color:${P.sub};font-size:15.5px}
        .tres .n{width:38px;height:38px;border-radius:12px;background:${est === "sangre" ? marcaOsc : Y};color:${est === "sangre" ? Y : N};font-family:Poppins,sans-serif;font-weight:800;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
        .reels{padding:84px 0}.reels h2{font-size:44px;margin:0 0 10px}.reels .lead{color:${P.sub};margin:0 0 30px}
        .fila{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.reel{aspect-ratio:9/16;border-radius:18px;background:${N};color:#f6f2ea;display:flex;flex-direction:column;align-items:center;padding:30px 14px;text-align:center;gap:16px;font-family:Poppins,sans-serif}
        .reel .fr{font-weight:800;font-size:19px;line-height:1.25}.reel u{text-decoration:none;color:${Y}}
        .fin{padding:96px 0;text-align:center;background:${est === "sangre" ? marcaOsc : est === "oscura" ? "rgba(0,0,0,.25)" : P.alt};color:${est === "sangre" ? Y : P.tx}}
        .fin h2{font-size:54px;margin:28px 0 14px}.fin p{color:${est === "sangre" ? "#f6f2ea" : P.sub};margin:0 0 30px}
        ${est === "sangre" ? `.fin .b{background:${Y};color:${marcaOsc}}.fin .b.s{background:rgba(255,255,255,.12);color:${Y}}` : ""}
        footer{padding:34px 0;border-top:1px solid ${P.borde};font-size:14px;color:${P.sub}}footer .w{display:flex;align-items:center;gap:22px;flex-wrap:wrap}footer .sp{flex:1}
        @media(max-width:700px){.w{padding:0 20px}header .w{height:60px;gap:12px}nav{display:none}.logo{flex:1}
          .hero{padding:48px 0 46px}.hero .ic{margin-bottom:26px}.hero h1{font-size:40px}.hero p{font-size:17px;margin:16px auto 26px}.cta .b{width:100%;justify-content:center}
          .tarj{border-radius:22px;padding:26px 18px}.tarj .fr{font-size:23px}.sec,.reels{padding:56px 0}.sec h2,.reels h2{font-size:31px}.sec h2{margin-bottom:28px}
          .tres{grid-template-columns:1fr}.fila{grid-template-columns:repeat(2,1fr)}.fin{padding:64px 0}.fin h2{font-size:36px}footer .w{flex-direction:column;align-items:flex-start;gap:10px}}`;
      const tiendas = `<a class="b" href="#">App Store</a><a class="b s" href="#">▶ Google Play</a>`;
      return `<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="fonts/poppins.css"><style>${css}</style></head><body>
        <header><div class="w"><a class="logo" href="#">${icono(d, 36, "26%")}${nombre(d, 22, P.nombre)}</a><nav><a href="#">Cómo funciona</a><a href="#">Reglas</a><a href="#">Reels</a><a href="#">EBAU y oposiciones</a></nav><a class="b p" href="#">Descargar</a></div></header>
        <section class="hero"><div class="w"><span class="ic">${icono(d, 132, "22.5%", `box-shadow:0 20px 44px rgba(0,0,0,.22)${lum(fondoLogo) > 225 || (est === "oscura" && oscuroLogo) || (est === "sangre" && !oscuroLogo) ? ",0 0 0 1px rgba(255,255,255,.14),inset 0 0 0 1px rgba(0,0,0,.06)" : ""}`)}</span>
          <h1>Cero faltas el día del <em>examen</em>.</h1>
          <p>Una regla de ortografía cada día, en un minuto. Para la EBAU, las oposiciones y para escribir sin miedo.</p>
          <div class="cta">${tiendas}</div><div class="peq">Gratis para empezar · iPhone y Android</div></div></section>
        <section class="demo"><div class="w"><div class="tarj"><span class="pill">Busca el error</span><div class="fr">Ayer conduje mi cami<u>on</u>.</div><div class="ok">camión</div><small>Aguda acabada en n: lleva tilde</small></div></div></section>
        <section class="sec"><div class="w"><h2>Una regla. Un minuto. Todos los días.</h2><div class="tres">
          <div><span class="n">1</span><b>Busca el error</b><p>Una frase con una falta escondida. La encuentras o te la enseñamos.</p></div>
          <div><span class="n">2</span><b>Aprende la regla</b><p>La explicación más corta posible, con ejemplos que se te quedan.</p></div>
          <div><span class="n">3</span><b>Llega al 10</b><p>Diez aciertos seguidos y la regla es tuya. Mañana, otra.</p></div></div></div></section>
        <section class="reels"><div class="w"><h2>Síguenos en Reels</h2><p class="lead">Una regla al día en Instagram, TikTok y YouTube Shorts.</p><div class="fila">
          ${reels.map(([p, f]) => `<div class="reel">${nombre(d, 13, Y)}<span class="pill">${p}</span><div class="fr">${f}</div></div>`).join("")}</div></div></section>
        <section class="fin"><div class="w">${icono(d, 96, "22.5%")}<h2>Mañana, otra regla.</h2><p>Descarga Ortografía10 y empieza hoy.</p><div class="cta">${tiendas}</div></div></section>
        <footer><div class="w">${nombre(d, 18, P.nombre)}<span class="sp"></span><a href="#">Instagram</a><a href="#">TikTok</a><a href="#">YouTube</a><span>ortografia10.com · © 2026</span></div></footer>
      </body></html>`;
    }

    // ---------- página ----------
    const el = (id) => document.getElementById(id);
    let estilo = "simple"; try { estilo = localStorage.getItem("ortologo.webEstilo") || "simple"; } catch {}
    let actual = null, favoritos = [];
    function pintaEstilos() {
      el("estilos").innerHTML = Object.entries(ESTILOS).map(([k, v]) => `<button type="button" data-e="${k}" class="${k === estilo ? "on" : ""}">${v.nombre}</button>`).join("");
      el("estilos").querySelectorAll("button").forEach((b) => b.onclick = () => { estilo = b.dataset.e; try { localStorage.setItem("ortologo.webEstilo", estilo); } catch {} pintaEstilos(); pinta(); });
      el("tipos").innerHTML = `<div><h3>Estilo «${ESTILOS[estilo].nombre}»</h3><p>${ESTILOS[estilo].tipos.map(esc).join("<br>")}</p></div>
        <div><h3>Qué mirar</h3><p>¿El logo se lee en la cabecera, a 36 px? ¿Destaca en grande en la portada sin pelearse con el titular? ¿La letra del logo (Poppins) convive con la de los textos?</p></div>
        <div><h3>Ojo</h3><p>Los textos, las tiendas y las secciones son de ejemplo para ver el logo en contexto: no son la web definitiva.</p></div>`;
    }
    function ajusta() {
      const v = document.querySelector(".vista"), f = v && v.querySelector("iframe");
      if (f) { const k = v.clientWidth / 1280; f.style.transform = `scale(${k})`; v.style.height = `${Math.round(800 * k)}px`; f.style.height = `${Math.round(v.clientHeight / k)}px`; }
      const m = document.querySelector(".iph iframe"); if (m) m.style.transform = `scale(${306 / 390})`;
    }
    function pinta() {
      if (!actual) return;
      const oscuroLogo = lum(hex((actual.colores || {}).icono_fondo, N)) < 100, marcaOsc = oscuroLogo ? hex(actual.colores.icono_fondo, N) : hex((actual.colores || {}).icono_tinta, N);
      window.FONDO = { simple: ["#ffffff", "#111"], calida: ["#faf8f3", "#111"], oscura: [oscuroLogo ? hex(actual.colores.icono_fondo, N) : N, "#fff"], sangre: [Y, marcaOsc] };
      const d = actual, html = landing(d, estilo), c = d.colores || {};
      el("titulo").innerHTML = `nº ${d.numero} <span>· ${esc(d.titulo)}</span>`;
      document.title = `Web con el nº ${d.numero} · Ortografía10`;
      el("escena").innerHTML = `<div><p class="cap">Ordenador · 1280 px</p><div class="browser"><div class="chrome"><div class="dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
          <div class="tab"><span class="fv" style="background:${hex(c.icono_fondo, N)}"><svg viewBox="0 0 100 100">${dentro(colorea(d.svg_favicon || d.svg_marca, hex(c.icono_tinta, Y), hex(c.acento, Y), hex(c.icono_fondo, N)))}</svg></span><span>Ortografía10 · Una regla. Un minuto.</span></div></div>
          <div class="barra">←&nbsp;&nbsp;→&nbsp;&nbsp;↻<b>https://ortografia10.com</b>☆</div><div class="vista"><iframe title="Web en escritorio" width="1280" height="800"></iframe></div></div></div>
        <div class="movil-wrap"><p class="cap">Móvil · 390 px</p><div class="iph"><div class="pant"><div class="isla"></div><div class="estado" style="background:${FONDO[estilo][0]};color:${FONDO[estilo][1]}"><span>9:41</span><span>●●● ▮</span></div><iframe title="Web en el móvil"></iframe></div></div>
          <p class="ayuda">Haz scroll dentro del teléfono o del navegador para ver la página entera.</p></div>`;
      document.querySelector(".vista iframe").srcdoc = html;
      document.querySelector(".iph iframe").srcdoc = html;
      el("favs").querySelectorAll("a").forEach((a) => a.classList.toggle("on", +a.dataset.n === d.numero));
      ajusta();
    }
    window.addEventListener("resize", ajusta);

    (async () => {
      pintaEstilos();
      const { url, anonKey, tablePrefix } = window.ORTOLOGO_CONFIG;
      const client = supabase.createClient(url, anonKey);
      const CAMPOS = "numero,titulo,decision,svg_marca,svg_favicon,svg_wordmark,colores";
      const n = +(location.hash.replace("#", "") || new URLSearchParams(location.search).get("n") || 0);
      const [fv, one] = await Promise.all([
        client.from(tablePrefix + "disenos").select(CAMPOS).in("decision", ["gusta", "definitivo"]).order("decidido_en", { ascending: false }).limit(300),
        n ? client.from(tablePrefix + "disenos").select(CAMPOS).eq("numero", n).maybeSingle() : Promise.resolve({ data: null }),
      ]);
      favoritos = fv.data || [];
      // primero los logotipos con la palabra (los que van a la web), luego el resto
      favoritos.sort((a, b) => (/orto|grafía|cartel|bandera/i.test(b.titulo) - /orto|grafía|cartel|bandera/i.test(a.titulo)));
      el("favs").innerHTML = favoritos.map((d) => `<a href="#${d.numero}" data-n="${d.numero}" title="nº ${d.numero}: ${esc(d.titulo)}"><div class="mini">${icono(d, 46, "0")}</div>${d.decision === "definitivo" ? "⭐" : ""}${d.numero}</a>`).join("");
      actual = one.data || favoritos[0] || null;
      if (!actual) { el("escena").innerHTML = `<div class="vacio">Marca algún logo con 👍 y vuelve: aquí lo verás en una web.</div>`; el("titulo").textContent = "Sin favoritos todavía"; return; }
      pinta();
      window.addEventListener("hashchange", async () => {
        const m = +location.hash.replace("#", "");
        let d = favoritos.find((x) => x.numero === m);
        if (!d && m) { const r = await client.from(tablePrefix + "disenos").select(CAMPOS).eq("numero", m).maybeSingle(); d = r.data; }
        if (d) { actual = d; pinta(); window.scrollTo({ top: 0, behavior: "smooth" }); }
      });
    })();
  </script>
  <div style="text-align:center;font-size:0.7rem;color:#b5b3ac;padding:0 0 24px">build __BUILD_ID__</div>
</body>
</html>

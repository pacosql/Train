<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ortografía 10</title>
  <meta name="description" content="Aprende ortografía jugando y di qué ejercicios te gustan.">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <style>
    @font-face { font-family: "P10"; src: url("fonts/poppins-800.woff2") format("woff2"); font-weight: 800; font-display: swap; }
    @font-face { font-family: "P10"; src: url("fonts/poppins-600.woff2") format("woff2"); font-weight: 600; font-display: swap; }
    :root {
      --bg: #ffffff; --ink: #000000; --soft: #f2f2f2; --line: #d9d9d9; --mute: #6b6b6b;
      --mal: #e0261b; --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.45;
      padding: max(14px, env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); }
    .wrap { max-width: 560px; margin: 0 auto; }
    button { font: inherit; color: inherit; cursor: pointer; }

    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 6px 0 14px; border-bottom: 2px solid var(--ink); }
    .logo { font-family: "P10", var(--sans); font-weight: 800; line-height: 1.02; font-size: 25px; letter-spacing: -.02em; display: flex; flex-direction: column; align-items: flex-start; }
    .tabs { display: flex; gap: 4px; background: var(--soft); border-radius: 999px; padding: 4px; }
    .tabs button { border: 0; background: transparent; padding: 8px 11px; border-radius: 999px; font-weight: 700; font-size: 15px; }
    .tabs button.on { background: var(--ink); color: var(--bg); }

    main { padding-top: 18px; }
    h2 { font-family: "P10", var(--sans); font-weight: 800; font-size: 26px; line-height: 1.1; margin: 4px 0 8px; letter-spacing: -.01em; }
    p.sub { color: var(--mute); margin: 0 0 16px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 2px solid var(--ink); background: var(--bg);
      border-radius: 14px; padding: 13px 18px; font-weight: 700; font-size: 17px; min-height: 52px; }
    .btn.neg { background: var(--ink); color: var(--bg); }
    .btn.big { width: 100%; font-size: 20px; min-height: 64px; font-family: "P10", var(--sans); font-weight: 800; }
    .btn:disabled { opacity: .45; }
    .fila { display: flex; gap: 10px; flex-wrap: wrap; }
    .fila > .btn { flex: 1 1 0; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 18px 0; }
    .stat { border: 1.5px solid var(--line); border-radius: 14px; padding: 10px; }
    .stat b { display: block; font-family: "P10", var(--sans); font-size: 24px; line-height: 1.1; }
    .stat span { color: var(--mute); font-size: 13px; }
    label.chk { display: flex; gap: 10px; align-items: center; padding: 12px 0; font-size: 15px; }
    label.chk input { width: 20px; height: 20px; accent-color: #000; }

    /* Juego */
    .barra { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .prog { flex: 1; height: 6px; background: var(--soft); border-radius: 9px; overflow: hidden; }
    .prog i { display: block; height: 100%; background: var(--ink); transition: width .3s; }
    .x { border: 0; background: none; font-size: 22px; padding: 4px 6px; }
    .tipo { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); margin-bottom: 8px; }
    .enun { font-family: "P10", var(--sans); font-weight: 800; font-size: 22px; line-height: 1.2; margin: 0 0 16px; }
    .palabra { font-family: "P10", var(--sans); font-weight: 800; font-size: 40px; line-height: 1.1; text-align: center; margin: 18px 0 22px; word-break: break-word; }
    .palabra .hueco { display: inline-block; min-width: 1.2em; border-bottom: 4px solid var(--ink); }
    .frase { font-size: 21px; line-height: 1.7; margin: 6px 0 18px; }
    .tok { display: inline; border: 0; background: none; padding: 2px 1px; border-radius: 6px; font-size: inherit; }
    .tok:hover { background: var(--soft); }
    .tok.ok { background: var(--ink); color: var(--bg); }
    .tok.mal { background: var(--mal); color: #fff; }
    .tok.era { outline: 2px solid var(--ink); }
    .ops { display: grid; gap: 10px; }
    .ops.dos { grid-template-columns: 1fr 1fr; }
    .op { border: 2px solid var(--ink); background: var(--bg); border-radius: 14px; padding: 14px; font-size: 19px; font-weight: 700; text-align: left; min-height: 56px; }
    .ops.dos .op { text-align: center; }
    .op.ok { background: var(--ink); color: var(--bg); }
    .op.mal { background: var(--mal); border-color: var(--mal); color: #fff; }
    .op.fr { font-weight: 500; font-size: 17px; }
    .vocales { display: flex; justify-content: center; flex-wrap: wrap; gap: 2px; margin: 18px 0 22px; font-family: "P10", var(--sans); font-weight: 800; font-size: 40px; }
    .vocales button { border: 0; background: none; font-size: inherit; font-weight: inherit; font-family: inherit; padding: 0 2px; border-bottom: 3px dotted var(--ink); border-radius: 0; }
    .vocales span { padding: 0 1px; }
    .vocales button.ok { background: var(--ink); color: var(--bg); }
    .vocales button.mal { background: var(--mal); color: #fff; }
    .sils { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 18px 0 22px; }
    .sils button { border: 2px solid var(--ink); background: var(--bg); border-radius: 12px; padding: 10px 14px; font-family: "P10", var(--sans); font-weight: 800; font-size: 28px; }
    .sils button.ok { background: var(--ink); color: var(--bg); }
    .sils button.mal { background: var(--mal); border-color: var(--mal); color: #fff; }
    input.esc { width: 100%; font: inherit; font-size: 24px; font-weight: 700; padding: 14px; border: 2px solid var(--ink); border-radius: 14px; text-align: center; margin-bottom: 10px; }
    .parejas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .parejas > div { display: grid; gap: 8px; align-content: start; }
    .pz { border: 2px solid var(--ink); background: var(--bg); border-radius: 12px; padding: 10px; font-size: 16px; font-weight: 600; min-height: 50px; }
    .pz.sel { background: var(--soft); outline: 3px solid var(--ink); }
    .pz.hecho { background: var(--ink); color: var(--bg); opacity: .85; }
    .pz.mal { background: var(--mal); border-color: var(--mal); color: #fff; }
    .cartel { background: #111; color: #fff; border: 6px solid #fff; outline: 2px solid #111; border-radius: 6px; padding: 22px 16px; text-align: center;
      font-family: "Arial Black", "P10", var(--sans); font-weight: 800; font-size: 24px; line-height: 1.5; margin: 6px 4px 20px; box-shadow: 0 6px 0 #0002; }
    .cartel .tok:hover { background: #333; }
    .cartel .tok.ok { background: #fff; color: #000; }
    .reloj { font-family: "P10", var(--sans); font-weight: 800; font-size: 18px; text-align: center; }
    .refran { font-style: italic; }

    .fb { margin-top: 18px; border-top: 2px solid var(--ink); padding-top: 14px; animation: in .2s ease; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } }
    .fb h3 { font-family: "P10", var(--sans); font-weight: 800; font-size: 22px; margin: 0 0 6px; }
    .fb h3.mal { color: var(--mal); }
    .fb p { margin: 0 0 8px; font-size: 16px; }
    .fb .regla { background: var(--soft); border-radius: 12px; padding: 10px 12px; font-size: 15px; }
    .fb .regla b { display: block; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--mute); }
    .mini { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 14px 0; color: var(--mute); font-size: 14px; }
    .votos { display: flex; gap: 8px; }
    .voto { border: 1.5px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 12px; font-size: 18px; min-width: 52px; }
    .voto.on { border-color: var(--ink); background: var(--ink); }
    .estrellas { display: inline-flex; align-items: center; gap: 0; margin-left: 4px; }
    .estrellas button { border: 0; background: none; font-size: 24px; line-height: 1; padding: 2px 1px; color: #cfcfcf; }
    .estrellas button.on { color: #000; }
    .estrellas small { font-size: 12px; color: var(--mute); margin-left: 4px; }
    .votos { flex-wrap: wrap; align-items: center; justify-content: flex-end; }
    .voto small { font-size: 12px; margin-left: 4px; color: var(--mute); }
    .voto.on small { color: #ddd; }

    /* Valorar */
    .tarjeta { border: 1.5px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
    .tarjeta.like { border: 2px solid var(--ink); }
    .tarjeta.dislike { opacity: .55; }
    .tarjeta h3 { margin: 0; font-size: 18px; display: flex; gap: 8px; align-items: baseline; }
    .tarjeta .orig { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--mute); margin: 2px 0 6px; }
    .tarjeta p { margin: 0 0 6px; font-size: 15px; }
    .tarjeta .ej { color: var(--mute); font-size: 14px; }
    .tarjeta .pie { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
    .tarjeta .probar { border: 1.5px solid var(--ink); background: var(--bg); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 14px; }
    .filtros { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 14px; }
    .filtros button { border: 1.5px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 600; }
    .filtros button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .va { font-size: 13px; color: var(--ink); background: var(--soft); border-radius: 10px; padding: 7px 10px; }
    .va span { font-weight: 700; margin-right: 12px; letter-spacing: .02em; }
    .fichas-l { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 16px 0 20px; }
    .fichas-l span { width: 44px; height: 50px; display: grid; place-items: center; border: 2px solid var(--ink); border-radius: 10px; font-family: "P10", var(--sans); font-weight: 800; font-size: 24px; }
    .teclado { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; margin-top: 14px; }
    .teclado button { border: 1.5px solid var(--ink); background: var(--bg); border-radius: 8px; padding: 9px 0; font-size: 17px; font-weight: 700; }
    .teclado button.ok { background: var(--ink); color: var(--bg); }
    .teclado button.mal { background: var(--soft); color: #aaa; border-color: #ddd; text-decoration: line-through; }
    .buscar { font-size: 17px; text-align: left; font-weight: 500; padding: 11px 14px; }
    .ficha { border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
    .ficha[open] { border: 2px solid var(--ink); }
    .ficha summary { cursor: pointer; font-weight: 700; font-size: 16px; list-style: none; }
    .ficha summary::-webkit-details-marker { display: none; }
    .fb-b { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--mute); margin-bottom: 2px; }
    .ficha p, .ficha li { font-size: 15px; margin: 0 0 6px; }
    .ficha ul { padding-left: 18px; margin: 0 0 6px; }
    .ficha .lab { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--mute); margin: 10px 0 2px; }
    .nota { font-size: 13px; color: var(--mute); margin: 18px 0 0; }
    .build-id { margin-top: 30px; font-size: 11px; color: #aaa; text-align: center; }
    .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #000; color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 14px; z-index: 9; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo" aria-label="Ortografía 10"><span class="a">Orto</span><span class="b">grafía</span><span class="c">10</span></div>
      <nav class="tabs">
        <button data-tab="jugar" class="on">Jugar</button>
        <button data-tab="valorar">Valorar</button>
        <button data-tab="fichas">Fichas</button>
      </nav>
    </header>
    <main id="main"></main>
    <div class="build-id">build __BUILD_ID__</div>
  </div>
  <script src="config.js"></script>
  <script type="module" src="app.js?v=__BUILD_ID__"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
      navigator.serviceWorker.addEventListener("message", (e) => { if (e.data && e.data.type === "new-version") location.reload(); });
    }
  </script>
</body>
</html>

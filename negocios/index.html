<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Negocios</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b0d10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Negocios" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" />

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d10;
      --glass: linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.025));
      --surface-2: rgba(255, 255, 255, 0.08);
      --line: rgba(255, 255, 255, 0.08);
      --line-strong: rgba(255, 255, 255, 0.16);
      --text: #f4f5f7;
      --text-2: #9aa3ad;
      --accent: #f2b840;
      --accent-2: #ffd66e;
      --accent-soft: rgba(242, 184, 64, 0.14);
      --accent-glow: rgba(242, 184, 64, 0.32);
      --accent-ink: #241700;
      --good: #43d391;
      --mid: #f2b840;
      --bad: #ff5470;
      --blue: #72a9ff;
      --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", -apple-system, sans-serif;
      --body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --lift: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 12px 32px rgba(0, 0, 0, 0.35);
      padding-top: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text); font-family: var(--body);
      padding: 16px 16px calc(112px + env(safe-area-inset-bottom, 0px));
      -webkit-font-smoothing: antialiased; line-height: 1.45;
    }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(70% 42% at 50% -6%, rgba(242, 184, 64, 0.16), transparent 70%),
        radial-gradient(45% 30% at 105% 25%, rgba(114, 169, 255, 0.06), transparent 70%);
    }
    .wrap { max-width: 520px; margin: 0 auto; }

    h1, h2 { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.3px; line-height: 0.98; margin: 0 0 6px; }
    h1 { font-size: 2rem; font-weight: 800; }
    h3 { font-family: var(--display); font-size: 0.95rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.3px; color: var(--accent); margin: 18px 0 6px; }
    .eyebrow { font-family: var(--display); font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.4px; color: var(--text-2); margin: 0 0 4px; }
    .sub { color: var(--text-2); font-size: 0.95rem; margin: 0 0 14px; }
    p { margin: 0 0 8px; }

    /* barra superior */
    .top-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
    .brand { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-size: 1.25rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.2px; }
    .brand-mark {
      width: 1.6rem; height: 1.6rem; border-radius: 9px; display: grid; place-items: center; font-size: 0.85rem;
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      box-shadow: 0 0 18px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }
    .icon-btn { background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line-strong); color: var(--text); border-radius: 12px; width: 40px; height: 40px; font-size: 1.1rem; cursor: pointer; display: grid; place-items: center; }
    .icon-btn:active { transform: scale(0.94); }
    .icon-btn.spin { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* pestañas */
    .tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-bottom: 14px; }
    .tab {
      font-family: var(--display); font-size: 0.74rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
      color: var(--text-2); background: rgba(255, 255, 255, 0.04); border: 1px solid var(--line); border-radius: 12px;
      padding: 8px 2px; text-align: center; cursor: pointer; line-height: 1.1;
    }
    .tab .n { display: block; font-size: 1.2rem; color: var(--text); }
    .tab.active { border-color: rgba(242, 184, 64, 0.5); background: var(--accent-soft); color: var(--accent); }
    .tab.active .n { color: var(--accent-2); }

    /* tarjetas */
    .card {
      background: var(--glass); border: 1px solid var(--line); border-radius: 22px; padding: 18px; margin-bottom: 12px; box-shadow: var(--lift);
      animation: card-in 0.3s cubic-bezier(0.2, 0.7, 0.2, 1) both;
    }
    @keyframes card-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
    .chip { font-family: var(--display); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.9px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--text-2); }
    .chip.accent { color: var(--accent); border-color: rgba(242, 184, 64, 0.45); background: var(--accent-soft); }
    .chip.blue { color: var(--blue); border-color: rgba(114, 169, 255, 0.45); }
    .chip.good { color: var(--good); border-color: rgba(67, 211, 145, 0.45); }
    .chip.bad { color: var(--bad); border-color: rgba(255, 84, 112, 0.45); }

    /* puntuación */
    .score-row { display: flex; align-items: center; gap: 16px; margin: 14px 0 12px; }
    .ring { position: relative; width: 92px; height: 92px; flex-shrink: 0; border-radius: 50%; display: grid; place-items: center;
      background: conic-gradient(var(--ring-color, var(--accent)) calc(var(--pct, 0) * 1%), rgba(255, 255, 255, 0.07) 0); }
    .ring::before { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: #14171c; }
    .ring .v { position: relative; font-family: var(--display); font-size: 2rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
    .ring .l { position: relative; font-family: var(--display); font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-2); }
    .ring.ia { width: 72px; height: 72px; }
    .ring.ia .v { font-size: 1.45rem; }
    .score-row.ia { margin: 0 0 12px; }
    .score-row.ia .verdict { font-size: 1.1rem; color: var(--blue); }
    .score-text { flex: 1; min-width: 0; }
    .score-text .verdict { font-family: var(--display); font-size: 1.35rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.4px; line-height: 1.05; }
    .score-text .why { color: var(--text-2); font-size: 0.82rem; margin-top: 4px; }

    /* métricas 1-10 */
    .metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 8px; }
    .metric { background: rgba(255, 255, 255, 0.04); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; }
    .metric .l { font-family: var(--display); font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-2); }
    .metric .v { font-family: var(--display); font-size: 1.6rem; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; margin: 2px 0 6px; }
    .metric .v small { font-size: 0.9rem; color: var(--text-2); font-weight: 700; }
    .bar { height: 5px; background: rgba(255, 255, 255, 0.07); border-radius: 999px; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0%; border-radius: 999px; background: var(--bar-color, var(--accent)); box-shadow: 0 0 10px var(--bar-color, var(--accent)); }

    /* datos económicos */
    .facts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 4px; }
    .fact { display: flex; flex-direction: column; padding: 8px 12px; border-left: 3px solid var(--accent); background: rgba(255, 255, 255, 0.03); border-radius: 0 12px 12px 0; }
    .fact .l { font-family: var(--display); font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-2); }
    .fact .v { font-family: var(--display); font-size: 1.25rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }

    /* secciones desplegables */
    details { border-top: 1px solid var(--line); padding: 10px 0; }
    details:last-of-type { border-bottom: 1px solid var(--line); }
    summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-family: var(--display); font-size: 1.05rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.9px; color: var(--text); }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: "+"; color: var(--accent); font-size: 1.3rem; font-weight: 800; }
    details[open] summary::after { content: "–"; }
    details .body { padding-top: 8px; font-size: 0.93rem; color: #d6dbe1; }
    details .body .note { color: var(--text-2); font-size: 0.85rem; margin-top: 2px; }
    ul.pros, ul.cons { margin: 4px 0 0; padding: 0; list-style: none; }
    ul.pros li, ul.cons li { position: relative; padding-left: 20px; margin-bottom: 5px; font-size: 0.9rem; }
    ul.pros li::before { content: "✓"; position: absolute; left: 0; color: var(--good); font-weight: 800; }
    ul.cons li::before { content: "!"; position: absolute; left: 4px; color: var(--bad); font-weight: 800; }
    .kv { display: grid; grid-template-columns: 1fr; gap: 6px; }
    .kv .k { font-family: var(--display); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); }

    textarea {
      width: 100%; min-height: 72px; resize: vertical; font-family: var(--body); font-size: 0.95rem; color: var(--text);
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line-strong); border-radius: 14px; padding: 10px 12px; margin-top: 6px;
    }
    textarea:focus { outline: none; border-color: var(--accent); }

    /* navegación entre pendientes */
    .pager { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0 10px; color: var(--text-2); font-family: var(--display); font-size: 0.9rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .pager button { width: auto; margin: 0; padding: 8px 14px; font-size: 1rem; }

    /* botones */
    button {
      font-family: var(--display); font-size: 1.2rem; font-weight: 700; letter-spacing: 0.7px; text-transform: uppercase;
      background: linear-gradient(135deg, var(--accent-2), var(--accent) 55%, #d99a1e); color: var(--accent-ink);
      border: none; border-radius: 16px; padding: 14px 16px; width: 100%; cursor: pointer;
      box-shadow: 0 8px 24px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      transition: transform 0.08s ease, filter 0.15s ease;
    }
    button:active { transform: scale(0.97); filter: brightness(1.06); }
    button.secondary { background: rgba(255, 255, 255, 0.06); color: var(--text); border: 1px solid var(--line-strong); box-shadow: none; }
    button.ghost { background: transparent; color: var(--text-2); border: 1px solid var(--line); box-shadow: none; font-size: 1rem; }
    button:disabled { opacity: 0.32; cursor: default; box-shadow: none; }

    .actions {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
      padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(180deg, rgba(11, 13, 16, 0), rgba(11, 13, 16, 0.92) 30%, var(--bg));
    }
    .actions .inner { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .actions button { padding: 12px 6px; font-size: 1rem; white-space: nowrap; letter-spacing: 0.4px; }
    .actions button.review { background: rgba(114, 169, 255, 0.12); color: var(--blue); border: 1px solid rgba(114, 169, 255, 0.45); box-shadow: none; }
    .actions button.like { background: linear-gradient(135deg, #7af0b8, var(--good) 55%, #2fb877); color: #04200f; box-shadow: 0 8px 24px rgba(67, 211, 145, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.3); }
    .actions button.dislike { background: rgba(255, 84, 112, 0.12); color: var(--bad); border: 1px solid rgba(255, 84, 112, 0.45); box-shadow: none; }
    .actions button.final { background: linear-gradient(135deg, var(--accent-2), var(--accent) 55%, #d99a1e); color: var(--accent-ink); }
    .actions.hidden { display: none; }

    /* explorar */
    .explore-btn { width: 100%; margin: -6px 0 12px; padding: 11px 12px; font-size: 1rem; }
    .explore-btn.active { border-color: rgba(242, 184, 64, 0.5); background: var(--accent-soft); color: var(--accent); }
    .explore-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 0 0 8px; }
    .explore-head .eyebrow { margin: 0; }
    .explore-head button { width: auto; margin: 0; padding: 7px 10px; font-size: 0.85rem; }
    .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
    .filters .full { grid-column: 1 / -1; }
    .filters label { display: block; font-family: var(--display); font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-2); margin: 0 0 2px 4px; }
    .filters select, .filters input {
      width: 100%; font-family: var(--body); font-size: 0.88rem; color: var(--text);
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line-strong); border-radius: 10px; padding: 8px 10px;
      -webkit-appearance: none; appearance: none;
    }
    .filters select { background-image: linear-gradient(45deg, transparent 50%, var(--text-2) 50%), linear-gradient(135deg, var(--text-2) 50%, transparent 50%); background-position: calc(100% - 16px) 55%, calc(100% - 11px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 26px; }
    .filters select.set { border-color: rgba(242, 184, 64, 0.55); color: var(--accent-2); }
    .filters select:focus, .filters input:focus { outline: none; border-color: var(--accent); }
    .item .d { font-size: 0.95rem; flex-shrink: 0; }
    .item .sel { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line-strong); background: transparent; flex-shrink: 0; margin: 0; padding: 0; display: grid; place-items: center; font-size: 0.85rem; color: var(--accent-ink); box-shadow: none; }
    .item .sel.on { background: linear-gradient(135deg, var(--accent-2), var(--accent)); border-color: var(--accent); }
    .cmp-bar { position: sticky; top: 8px; z-index: 10; display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 0 0 10px; padding: 8px 10px 8px 14px; border-radius: 14px; background: #1c2027; border: 1px solid rgba(242, 184, 64, 0.45); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; font-size: 0.9rem; }
    .cmp-bar button { width: auto; margin: 0; padding: 8px 12px; font-size: 0.95rem; }
    .cmp-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -16px; padding: 0 16px 8px; }
    table.cmp { border-collapse: separate; border-spacing: 0; min-width: 100%; font-size: 0.85rem; }
    table.cmp th, table.cmp td { padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: top; text-align: left; }
    table.cmp th { font-family: var(--display); font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-2); position: sticky; left: 0; background: var(--bg); min-width: 96px; max-width: 120px; }
    table.cmp thead th { position: sticky; top: 0; left: auto; background: var(--bg); color: var(--text); font-size: 0.95rem; text-transform: none; letter-spacing: 0; min-width: 150px; max-width: 200px; cursor: pointer; line-height: 1.15; }
    table.cmp thead th:first-child { left: 0; z-index: 2; min-width: 96px; }
    table.cmp td { min-width: 150px; max-width: 200px; }
    table.cmp td.big { font-family: var(--display); font-size: 1.4rem; font-weight: 800; }
    table.cmp td.best { color: var(--good); font-weight: 700; }
    table.cmp tr.sep td, table.cmp tr.sep th { border-bottom: 2px solid var(--line-strong); }

    /* listas */
    .item {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; border: 1px solid var(--line);
      background: var(--glass); margin-bottom: 8px; cursor: pointer; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      animation: card-in 0.3s both; animation-delay: calc(var(--i, 0) * 30ms);
    }
    .item:active { background: var(--surface-2); }
    .item .s { font-family: var(--display); font-size: 1.5rem; font-weight: 800; width: 44px; text-align: center; flex-shrink: 0; font-variant-numeric: tabular-nums; }
    .item .m { flex: 1; min-width: 0; }
    .item .name { font-family: var(--display); font-size: 1.15rem; font-weight: 700; line-height: 1.05; }
    .item .meta { color: var(--text-2); font-size: 0.78rem; margin-top: 3px; }
    .item .arrow { color: var(--text-2); }
    .empty { text-align: center; color: var(--text-2); padding: 36px 12px; }
    .empty .big { font-size: 2.4rem; margin-bottom: 8px; }

    .msg { color: var(--bad); font-size: 0.85rem; margin: 0 0 10px; min-height: 1em; }
    .toast {
      position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30;
      background: #1c2027; border: 1px solid var(--line-strong); color: var(--text); padding: 10px 14px; border-radius: 999px; font-size: 0.9rem;
      display: flex; gap: 12px; align-items: center; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); opacity: 0; pointer-events: none; transition: opacity 0.2s;
      max-width: calc(100vw - 32px); width: max-content;
    }
    .toast span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .toast.no-undo button { display: none; }
    .toast.show { opacity: 1; pointer-events: auto; }
    .toast button { width: auto; padding: 4px 10px; font-size: 0.9rem; background: transparent; color: var(--accent); box-shadow: none; }
    .build-id { text-align: center; font-size: 0.7rem; color: var(--text-2); margin-top: 24px; font-family: ui-monospace, monospace; }
    .back { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem; cursor: pointer; margin-bottom: 10px; }
    .decision-tag { font-family: var(--display); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem; margin-bottom: 8px; }
    .decision-tag.gusta { color: var(--good); }
    .decision-tag.no_gusta { color: var(--bad); }
    .decision-tag.definitivo { color: var(--accent); }
    .decision-tag.revisar { color: var(--blue); }
    .helper { font-size: 0.8rem; color: var(--text-2); margin-top: 8px; }

    /* revisión */
    .revision { border: 1px solid rgba(114, 169, 255, 0.45); background: rgba(114, 169, 255, 0.1); border-radius: 14px; padding: 10px 12px; margin: 0 0 12px; font-size: 0.9rem; }
    .revision .t { font-family: var(--display); font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--blue); margin-bottom: 3px; }
    .tags { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0 0; }
    .tag { font-size: 0.72rem; color: var(--text-2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; }
    .calc { font-size: 0.85rem; color: var(--text-2); }
    .calc b { color: var(--text); }
    button.dictate { background: rgba(114, 169, 255, 0.12); color: var(--blue); border: 1px solid rgba(114, 169, 255, 0.45); box-shadow: none; }
    button.dictate.on { background: linear-gradient(135deg, #a9c8ff, var(--blue) 55%, #3f7fe0); color: #051233; animation: rec-pulse 1.2s ease-in-out infinite; }
    .rec-row.three { grid-template-columns: 1fr 1fr 1fr; }
    .rec-row.three button { padding: 12px 6px; font-size: 0.95rem; white-space: nowrap; }

    /* comentarios (texto y audio) */
    .comment { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; background: rgba(255, 255, 255, 0.03); font-size: 0.9rem; }
    .comment .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: var(--display); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-2); margin-bottom: 4px; }
    .comment .estado { padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line-strong); }
    .comment .estado.pendiente { color: var(--accent); border-color: rgba(242, 184, 64, 0.45); }
    .comment .estado.transcrito { color: var(--blue); border-color: rgba(114, 169, 255, 0.45); }
    .comment .estado.procesado { color: var(--good); border-color: rgba(67, 211, 145, 0.45); }
    .comment audio { width: 100%; height: 36px; margin-top: 4px; }
    .comment .trans { color: var(--text-2); font-size: 0.85rem; margin-top: 4px; font-style: italic; }
    .rec-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .rec-row button { margin: 0; padding: 12px 10px; font-size: 1.05rem; }
    button.rec { background: rgba(255, 84, 112, 0.12); color: var(--bad); border: 1px solid rgba(255, 84, 112, 0.45); box-shadow: none; }
    button.rec.on { background: linear-gradient(135deg, #ff8fa3, var(--bad) 55%, #d92e50); color: #fff; animation: rec-pulse 1.2s ease-in-out infinite; }
    @keyframes rec-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 84, 112, 0.5); } 50% { box-shadow: 0 0 0 10px rgba(255, 84, 112, 0); } }
    .rec-preview { margin-top: 8px; padding: 10px 12px; border: 1px dashed rgba(242, 184, 64, 0.5); border-radius: 14px; }
    .rec-preview audio { width: 100%; height: 36px; }
    .rec-preview .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .rec-preview .row button { margin: 0; padding: 11px 10px; font-size: 1rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top-bar">
      <div class="brand"><span class="brand-mark">📈</span> Negocios</div>
      <button class="icon-btn" id="btn-refresh" title="Buscar fichas nuevas">↻</button>
    </div>
    <p class="msg" id="msg"></p>

    <div class="tabs" id="tabs">
      <div class="tab active" data-tab="pendiente"><span class="n" id="n-pendiente">–</span>Pendientes</div>
      <div class="tab" data-tab="gusta"><span class="n" id="n-gusta">–</span>Me gustan</div>
      <div class="tab" data-tab="no_gusta"><span class="n" id="n-no_gusta">–</span>No</div>
      <div class="tab" data-tab="definitivo"><span class="n" id="n-definitivo">–</span>Definitivo</div>
      <div class="tab" data-tab="revisar"><span class="n" id="n-revisar">–</span>A revisar</div>
    </div>

    <button class="secondary explore-btn" id="btn-explore" type="button">🔎 Explorar y filtrar todas las fichas</button>

    <div id="view"></div>

    <div class="build-id">build __BUILD_ID__</div>
  </div>

  <div class="actions hidden" id="actions">
    <div class="inner">
      <button class="dislike" id="btn-no_gusta">👎 No me gusta</button>
      <button class="like" id="btn-gusta">👍 Me gusta</button>
      <button class="review" id="btn-revisar">🔁 A revisar</button>
      <button class="final" id="btn-definitivo">⭐ Definitivo</button>
    </div>
  </div>

  <div class="toast" id="toast"><span id="toast-text"></span><button id="toast-undo">Deshacer</button></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script>
    const { url, anonKey, tablePrefix } = window.NEGOCIOS_CONFIG;
    const T_IDEAS = tablePrefix + "ideas";
    const T_COMENTARIOS = tablePrefix + "comentarios";
    const BUCKET = "negocios-audios";
    let client = null;
    let ideas = [];
    let comentarios = []; // todos, de todas las fichas
    const state = { tab: "pendiente", index: 0, detailId: null };
    const EXPLORE_KEY = "negocios.explorar";
    const DEF_FILTERS = { q: "", decision: "", sector: "", modelo: "", tipo: "", venta: "", efecto_red: "", impacto_ia: "", exito_min: "", inv_max: "", claude_min: "", ltvcac_min: "", sort: "score" };
    let filters = loadFilters();
    const COMPARE_KEY = "negocios.comparar";
    let compare = (() => { try { return JSON.parse(localStorage.getItem(COMPARE_KEY) || "[]").slice(0, 3); } catch { return []; } })();
    function saveCompare() { try { localStorage.setItem(COMPARE_KEY, JSON.stringify(compare)); } catch {} }
    function toggleCompare(id) {
      if (compare.includes(id)) compare = compare.filter((x) => x !== id);
      else if (compare.length >= 3) { showToast("Máximo 3 fichas para comparar"); return; }
      else compare.push(id);
      saveCompare();
    }
    function loadFilters() { try { return { ...DEF_FILTERS, ...JSON.parse(localStorage.getItem(EXPLORE_KEY) || "{}") }; } catch { return { ...DEF_FILTERS }; } }
    function saveFilters() { try { localStorage.setItem(EXPLORE_KEY, JSON.stringify(filters)); } catch {} }
    let lastChange = null; // { id, prev: {decision, decidido_en} }
    const rec = { recorder: null, stream: null, chunks: [], blob: null, mime: "", startedAt: 0, timer: null, url: "", sr: null, texto: [] };
    let toastTimer = null;

    const el = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const money = (n) => n == null ? "–" : (Math.abs(n) >= 1000 ? (Math.round(n / 100) / 10).toLocaleString("es-ES") + " k€" : n.toLocaleString("es-ES") + " €");
    const rango = (a, b) => (a == null && b == null) ? "–" : (a != null && b != null ? `${money(a)} – ${money(b)}` : money(a ?? b));

    // ---------- puntuación (0-100): "probabilidad de éxito para ti" ----------
    // Lo que el usuario entiende por éxito: compra desasistida (×2), cliente
    // individual sin efecto de red (×1,5), poca inversión (×2), LTV muy por
    // encima del CAC (×2), viralidad (×1) y la probabilidad de éxito de
    // mercado que estima el analista (×1,5). El encaje con el perfil y la
    // durabilidad se muestran pero no puntúan.
    const IA_SCORE = { palanca: 10, neutral: 6, amenaza: 2 };
    const VENTA_SCORE = { desasistida: 10, mixta: 5, asistida: 1 };
    const RED_SCORE = { individual: 10, red: 2 };
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    function ltvCac(i) {
      const ltv = i.ltv_eur ?? i.ticket_medio_eur;
      if (!ltv || !i.cac_eur) return 5;
      return clamp(5 * Math.log10(ltv / i.cac_eur) + 2.5, 0, 10);
    }
    function inversion(i) {
      const max = i.inversion_max_eur ?? i.inversion_min_eur;
      if (!max) return 5;
      return clamp(10 - 4 * Math.log10(max / 10000), 0, 10);
    }
    const parts = (i) => ({
      venta: VENTA_SCORE[i.venta] ?? 5, red: RED_SCORE[i.efecto_red] ?? 6, inversion: inversion(i),
      ltvcac: ltvCac(i), viralidad: i.viralidad ?? 5, exito: i.exito,
    });
    function score(i) {
      const p = parts(i);
      return Math.round(p.venta * 2 + p.red * 1.5 + p.inversion * 2 + p.ltvcac * 2 + p.viralidad * 1 + p.exito * 1.5);
    }
    function verdict(s) {
      if (s >= 75) return ["Alta probabilidad para ti", "var(--good)"];
      if (s >= 60) return ["Buena, con reservas", "var(--mid)"];
      if (s >= 45) return ["Floja para ti", "var(--accent)"];
      return ["Descartable", "var(--bad)"];
    }
    const f1 = (n) => (Math.round(n * 10) / 10).toLocaleString("es-ES");
    const barColor = (v) => v >= 7 ? "var(--good)" : v >= 5 ? "var(--mid)" : "var(--bad)";
    const IA_LABEL = { palanca: ["🚀 Palanca", "good"], neutral: ["⚖️ Neutral", ""], amenaza: ["⚠️ Amenaza", "bad"] };
    const MODELO_LABEL = { B2C: "B2C · a consumidor", B2B: "B2B · a empresas", B2B2C: "B2B2C · vía empresas al consumidor", B2G: "B2G · a administración" };
    const TIPO_LABEL = { innovador: "Innovador", tradicional: "Tradicional", hibrido: "Híbrido" };
    const DECISION_LABEL = { gusta: "👍 Me gusta", no_gusta: "👎 No me gusta", definitivo: "⭐ Definitivo", revisar: "🔁 A revisar" };
    const VENTA_LABEL = { desasistida: ["🛒 Compra desasistida", "good"], asistida: ["🤝 Venta humana", "bad"], mixta: ["🛒/🤝 Venta mixta", ""] };
    const RED_LABEL = { individual: ["👤 Cliente individual", "good"], red: ["👥 Necesita masa crítica", "bad"] };
    const ESTADO_LABEL = { pendiente: "Pendiente de procesar", transcrito: "Transcrito · pendiente", procesado: "Procesado" };

    // ---------- datos ----------
    async function load() {
      const { data, error } = await client.from(T_IDEAS).select("*").order("created_at", { ascending: true });
      if (error) throw error;
      ideas = data || [];
      ideas.forEach((i) => { i._score = score(i); });
      const c = await client.from(T_COMENTARIOS).select("*").order("created_at", { ascending: true });
      if (c.error) throw c.error;
      comentarios = c.data || [];
    }
    const commentsOf = (id) => comentarios.filter((c) => c.idea_id === id);
    // Pendientes: primero las que la rutina ha revisado (para que el usuario
    // vea el "He tenido en cuenta" y vuelva a etiquetar), luego por puntuación.
    const isRevised = (i) => !!i.revision_nota;
    const pending = () => ideas.filter((i) => !i.decision).sort((a, b) => (isRevised(b) - isRevised(a)) || (b._score - a._score) || a.created_at.localeCompare(b.created_at));
    const byDecision = (d) => ideas.filter((i) => i.decision === d).sort((a, b) => (b.decidido_en || "").localeCompare(a.decidido_en || ""));

    async function decide(idea, decision) {
      lastChange = { id: idea.id, prev: { decision: idea.decision, decidido_en: idea.decidido_en } };
      const patch = { decision, decidido_en: decision ? new Date().toISOString() : null };
      const { error } = await client.from(T_IDEAS).update(patch).eq("id", idea.id);
      if (error) { showMsg("No se pudo guardar: " + error.message); return; }
      Object.assign(idea, patch);
      resetRec();
      showMsg("");
      showToast(decision === "revisar" ? `🔁 A revisar · la rutina la ampliará en menos de una hora` : decision ? `${DECISION_LABEL[decision]} · ${idea.nombre}` : `Devuelta a pendientes · ${idea.nombre}`, true);
      if (state.tab === "pendiente") { state.index = Math.min(state.index, Math.max(0, pending().length - 1)); }
      state.detailId = null;
      render();
    }
    async function undo() {
      if (!lastChange) return;
      const idea = ideas.find((i) => i.id === lastChange.id);
      if (!idea) return;
      const { error } = await client.from(T_IDEAS).update(lastChange.prev).eq("id", idea.id);
      if (error) { showMsg("No se pudo deshacer: " + error.message); return; }
      Object.assign(idea, lastChange.prev);
      lastChange = null;
      hideToast();
      render();
    }

    // ---------- explorar: filtros, orden, búsqueda, CSV ----------
    const ratioOf = (i) => (i.ltv_eur && i.cac_eur) ? i.ltv_eur / i.cac_eur : null;
    const SORTS = {
      score: (a, b) => b._score - a._score,
      claude: (a, b) => (b.claude_pct ?? -1) - (a.claude_pct ?? -1),
      exito: (a, b) => b.exito - a.exito,
      inversion: (a, b) => (a.inversion_max_eur ?? a.inversion_min_eur ?? 1e12) - (b.inversion_max_eur ?? b.inversion_min_eur ?? 1e12),
      cac: (a, b) => (a.cac_eur ?? 1e12) - (b.cac_eur ?? 1e12),
      ltvcac: (a, b) => (ratioOf(b) ?? -1) - (ratioOf(a) ?? -1),
      payback: (a, b) => (a.payback_meses ?? 1e9) - (b.payback_meses ?? 1e9),
      fecha: (a, b) => b.created_at.localeCompare(a.created_at),
      nombre: (a, b) => a.nombre.localeCompare(b.nombre, "es"),
    };
    const SORT_LABELS = [["score", "Puntuación"], ["claude", "IA Score"], ["exito", "Éxito de mercado"], ["inversion", "Menor inversión"], ["cac", "Menor CAC"], ["ltvcac", "Mayor LTV/CAC"], ["payback", "Retorno más rápido"], ["fecha", "Más recientes"], ["nombre", "Nombre"]];
    function applyFilters() {
      const q = (filters.q || "").trim().toLowerCase();
      const arr = ideas.filter((i) => {
        if (filters.decision === "pendiente") { if (i.decision) return false; }
        else if (filters.decision && i.decision !== filters.decision) return false;
        for (const k of ["sector", "modelo", "tipo", "venta", "efecto_red", "impacto_ia"]) if (filters[k] && i[k] !== filters[k]) return false;
        if (filters.exito_min && i.exito < +filters.exito_min) return false;
        if (filters.inv_max && (i.inversion_max_eur ?? i.inversion_min_eur ?? 0) > +filters.inv_max) return false;
        if (filters.claude_min && (i.claude_pct ?? -1) < +filters.claude_min) return false;
        if (filters.ltvcac_min && (ratioOf(i) ?? -1) < +filters.ltvcac_min) return false;
        if (q) { const hay = [i.nombre, i.resumen, i.sector, ...(i.etiquetas || [])].join(" ").toLowerCase(); if (!hay.includes(q)) return false; }
        return true;
      });
      return arr.sort(SORTS[filters.sort] || SORTS.score);
    }
    const DECISION_ICON = { gusta: "👍", no_gusta: "👎", definitivo: "⭐", revisar: "🔁" };
    function itemHTML(i, idx, showDecision) {
      const r = ratioOf(i);
      return `
        <div class="item" data-id="${i.id}" style="--i:${idx}">
          ${showDecision ? `<button class="sel ${compare.includes(i.id) ? "on" : ""}" data-sel="${i.id}" type="button" title="Comparar">${compare.includes(i.id) ? "✓" : ""}</button>` : ""}
          <div class="s" style="color:${verdict(i._score)[1]}">${i._score}</div>
          <div class="m"><div class="name">${esc(i.nombre)}</div><div class="meta">${i.claude_pct != null ? "🤖 " + i.claude_pct + " % · " : ""}${esc(i.sector)} · ${esc(i.modelo)}${showDecision ? (r ? " · LTV/CAC " + f1(r) + "×" : "") + (i.inversion_max_eur != null ? " · " + money(i.inversion_max_eur) : "") : " · " + (i.decidido_en ? new Date(i.decidido_en).toLocaleDateString("es-ES") : "")}${commentsOf(i.id).length ? " · 💬 " + commentsOf(i.id).length : ""}</div></div>
          ${showDecision ? `<div class="d">${i.decision ? DECISION_ICON[i.decision] || "" : "·"}</div>` : ""}
          <div class="arrow">›</div>
        </div>`;
    }
    function wireItems(root, onSelect) {
      root.querySelectorAll(".item").forEach((n) => n.onclick = () => { state.detailId = n.dataset.id; render(); });
      root.querySelectorAll(".sel").forEach((b) => b.onclick = (e) => { e.stopPropagation(); toggleCompare(b.dataset.sel); b.classList.toggle("on", compare.includes(b.dataset.sel)); b.textContent = compare.includes(b.dataset.sel) ? "✓" : ""; onSelect && onSelect(); });
    }
    function renderExplore(view) {
      const opts = (k) => [...new Set(ideas.map((i) => i[k]).filter(Boolean))].sort((a, b) => a.localeCompare(b, "es"));
      const sel = (k, label, options, labels = {}) => `<div><label>${label}</label><select data-f="${k}" class="${filters[k] ? "set" : ""}"><option value="">Todas</option>${options.map((o) => `<option value="${esc(o)}" ${filters[k] === String(o) ? "selected" : ""}>${esc(labels[o] || o)}</option>`).join("")}</select></div>`;
      view.innerHTML = `
        <div class="explore-head"><p class="eyebrow">Explorar · <span id="ex-count">–</span></p><div><button class="ghost" id="ex-csv" type="button">⬇ CSV</button> <button class="ghost" id="ex-reset" type="button">Limpiar</button></div></div>
        <div class="filters">
          <div class="full"><input type="search" data-f="q" placeholder="Buscar por nombre, resumen, sector o etiqueta…" value="${esc(filters.q)}"></div>
          ${sel("decision", "Etiqueta", ["pendiente", "gusta", "no_gusta", "definitivo", "revisar"], { pendiente: "Pendiente", gusta: "👍 Me gusta", no_gusta: "👎 No me gusta", definitivo: "⭐ Definitivo", revisar: "🔁 A revisar" })}
          ${sel("sector", "Sector", opts("sector"))}
          ${sel("modelo", "Modelo", opts("modelo"))}
          ${sel("tipo", "Tipo", opts("tipo"), TIPO_LABEL)}
          ${sel("venta", "Venta", ["desasistida", "mixta", "asistida"], { desasistida: "Desasistida", mixta: "Mixta", asistida: "Asistida (humana)" })}
          ${sel("efecto_red", "Cliente", ["individual", "red"], { individual: "Individual", red: "Necesita masa crítica" })}
          ${sel("impacto_ia", "Impacto de la IA", ["palanca", "neutral", "amenaza"], { palanca: "Palanca", neutral: "Neutral", amenaza: "Amenaza" })}
          ${sel("exito_min", "Éxito mínimo", ["4", "6", "8"], { 4: "≥ 4", 6: "≥ 6", 8: "≥ 8" })}
          ${sel("inv_max", "Inversión máxima", ["10000", "25000", "50000", "100000"], { 10000: "≤ 10 k€", 25000: "≤ 25 k€", 50000: "≤ 50 k€", 100000: "≤ 100 k€" })}
          ${sel("claude_min", "IA Score mínimo", ["50", "80", "95"], { 50: "≥ 50 %", 80: "≥ 80 %", 95: "≥ 95 %" })}
          ${sel("ltvcac_min", "LTV/CAC mínimo", ["3", "5", "10"], { 3: "≥ 3×", 5: "≥ 5×", 10: "≥ 10×" })}
          <div class="full"><label>Ordenar por</label><select data-f="sort">${SORT_LABELS.map(([v, l]) => `<option value="${v}" ${filters.sort === v ? "selected" : ""}>${l}</option>`).join("")}</select></div>
        </div>
        <div id="cmp-bar"></div>
        <div id="ex-list"></div>`;
      const updateBar = () => {
        const sel = compare.map((id) => ideas.find((i) => i.id === id)).filter(Boolean);
        el("cmp-bar").innerHTML = sel.length ? `<div class="cmp-bar"><span>⚖️ ${sel.length} de 3 seleccionadas</span><div><button class="ghost" id="cmp-clear" type="button">Quitar</button> <button id="cmp-go" type="button" ${sel.length < 2 ? "disabled" : ""}>Comparar</button></div></div>` : `<p class="helper" style="margin:0 0 8px">Marca el círculo de 2 o 3 fichas para compararlas lado a lado.</p>`;
        if (sel.length) {
          el("cmp-clear").onclick = () => { compare = []; saveCompare(); update(); };
          el("cmp-go").onclick = () => { state.tab = "comparar"; render(); };
        }
      };
      const update = () => {
        const arr = applyFilters();
        el("ex-count").textContent = `${arr.length} de ${ideas.length} fichas`;
        el("ex-list").innerHTML = arr.length ? arr.map((i, idx) => itemHTML(i, idx, true)).join("") : `<div class="empty"><div class="big">🔎</div><div>Ninguna ficha cumple los filtros.</div></div>`;
        wireItems(el("ex-list"), updateBar);
        updateBar();
      };
      view.querySelectorAll("[data-f]").forEach((n) => n.addEventListener(n.tagName === "INPUT" ? "input" : "change", () => {
        filters[n.dataset.f] = n.value; saveFilters();
        if (n.tagName === "SELECT") n.classList.toggle("set", !!n.value && n.dataset.f !== "sort");
        update();
      }));
      el("ex-reset").onclick = () => { filters = { ...DEF_FILTERS }; saveFilters(); renderExplore(view); };
      el("ex-csv").onclick = exportCSV;
      update();
    }
    function renderCompare(view) {
      const sel = compare.map((id) => ideas.find((i) => i.id === id)).filter(Boolean);
      if (sel.length < 2) { state.tab = "explorar"; return render(); }
      const num = (v, suf = "") => v == null ? "–" : v + suf;
      const bestOf = (vals, higher = true) => { const ok = vals.filter((v) => typeof v === "number"); if (ok.length < 2) return null; return higher ? Math.max(...ok) : Math.min(...ok); };
      const rows = [
        ["Puntuación", sel.map((i) => i._score), (i) => i._score, true, "big"],
        ["Veredicto", sel.map((i) => verdict(i._score)[0])],
        ["IA Score", sel.map((i) => num(i.claude_pct, " %")), (i) => i.claude_pct, true],
        ["Etiqueta", sel.map((i) => i.decision ? DECISION_LABEL[i.decision] : "Pendiente"), null, null, null, true],
        ["Venta", sel.map((i) => VENTA_LABEL[i.venta] ? VENTA_LABEL[i.venta][0] : "–")],
        ["Cliente", sel.map((i) => RED_LABEL[i.efecto_red] ? RED_LABEL[i.efecto_red][0] : "–")],
        ["Sector", sel.map((i) => i.sector)],
        ["Modelo · tipo", sel.map((i) => `${i.modelo} · ${TIPO_LABEL[i.tipo] || i.tipo}`), null, null, null, true],
        ["Éxito de mercado", sel.map((i) => num(i.exito, "/10")), (i) => i.exito, true],
        ["Viralidad", sel.map((i) => num(i.viralidad, "/10")), (i) => i.viralidad, true],
        ["Aguanta con el tiempo", sel.map((i) => num(i.durabilidad, "/10")), (i) => i.durabilidad, true],
        ["Uso de la IA", sel.map((i) => num(i.uso_ia, "/10")), (i) => i.uso_ia, true],
        ["Impacto de la IA", sel.map((i) => (IA_LABEL[i.impacto_ia] || ["–"])[0])],
        ["Encaje con tu perfil", sel.map((i) => num(i.encaje_perfil, "/10")), (i) => i.encaje_perfil, true, null, true],
        ["Inversión inicial", sel.map((i) => rango(i.inversion_min_eur, i.inversion_max_eur)), (i) => i.inversion_max_eur ?? i.inversion_min_eur, false],
        ["Coste de adquisición", sel.map((i) => money(i.cac_eur)), (i) => i.cac_eur, false],
        ["LTV por cliente", sel.map((i) => money(i.ltv_eur)), (i) => i.ltv_eur, true],
        ["LTV / CAC", sel.map((i) => ratioOf(i) ? f1(ratioOf(i)) + "×" : "–"), (i) => ratioOf(i), true],
        ["Ticket medio / año", sel.map((i) => money(i.ticket_medio_eur)), (i) => i.ticket_medio_eur, true],
        ["Retorno de la inversión", sel.map((i) => num(i.payback_meses, " meses")), (i) => i.payback_meses, false],
        ["Primeros ingresos", sel.map((i) => num(i.meses_hasta_ingresos, " meses")), (i) => i.meses_hasta_ingresos, false, null, true],
        ["Primer paso", sel.map((i) => i.primer_paso || "–")],
      ];
      const body = rows.map(([label, cells, getter, higher, cls, sep]) => {
        const best = getter ? bestOf(sel.map(getter), higher) : null;
        return `<tr class="${sep ? "sep" : ""}"><th>${label}</th>${cells.map((c, k) => `<td class="${cls || ""} ${best != null && getter(sel[k]) === best ? "best" : ""}">${esc(c)}</td>`).join("")}</tr>`;
      }).join("");
      view.innerHTML = `<div class="back" id="back">← Volver a Explorar</div>
        <p class="eyebrow">Comparar ${sel.length} fichas · en verde, la mejor de cada fila</p>
        <div class="cmp-wrap"><table class="cmp"><thead><tr><th></th>${sel.map((i) => `<th data-id="${i.id}">${esc(i.nombre)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>
        <button class="ghost" id="cmp-clear2" type="button">Quitar selección</button>`;
      el("back").onclick = () => { state.tab = "explorar"; render(); };
      el("cmp-clear2").onclick = () => { compare = []; saveCompare(); state.tab = "explorar"; render(); };
      view.querySelectorAll("thead th[data-id]").forEach((h) => h.onclick = () => { state.detailId = h.dataset.id; render(); });

    }
    function exportCSV() {
      const cols = ["nombre", "_score", "claude_pct", "decision", "sector", "modelo", "tipo", "venta", "efecto_red", "exito", "viralidad", "durabilidad", "uso_ia", "impacto_ia", "encaje_perfil", "inversion_min_eur", "inversion_max_eur", "cac_eur", "ltv_eur", "ticket_medio_eur", "payback_meses", "meses_hasta_ingresos", "fuente", "version", "created_at", "resumen"];
      const head = cols.map((c) => c === "_score" ? "puntuacion" : c);
      const cell = (v) => { if (v == null) return ""; const t = Array.isArray(v) ? v.join(" | ") : String(v); return /[;"\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
      const rows = [head.join(";"), ...applyFilters().map((i) => cols.map((c) => cell(i[c])).join(";"))];
      const blob = new Blob(["\ufeff" + rows.join("\r\n")], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `negocios-${new Date().toISOString().slice(0, 10)}.csv`; a.click();

    }

    function cardHTML(i) {

        ${i.revision_nota ? `<div class="revision"><div class="t">🔁 Revisada${i.revisado_en ? " el " + new Date(i.revisado_en).toLocaleDateString("es-ES") : ""} · versión ${i.version || 2}</div>${esc(i.revision_nota)}</div>` : ""}

          ${venta ? `<span class="chip ${venta[1]}">${venta[0]}</span>` : ""}
          ${red ? `<span class="chip ${red[1]}">${red[0]}</span>` : ""}

        <div class="score-row">
          <div class="ring" style="--pct:${s};--ring-color:${color}"><div class="v">${s}</div><div class="l">de 100</div></div>
          <div class="score-text">
            <div class="verdict" style="color:${color}">${v}</div>
            <div class="why">Probabilidad de éxito para ti: compra desasistida, cliente individual, poca inversión, LTV frente a CAC, viralidad y éxito de mercado.</div>
          </div>

        <div class="score-row ia">
          <div class="ring ia" style="--pct:${i.claude_pct ?? 0};--ring-color:var(--blue)"><div class="v">${i.claude_pct != null ? i.claude_pct + "%" : "–"}</div><div class="l">IA score</div></div>
          <div class="score-text">
            <div class="verdict">${i.claude_pct != null ? i.claude_pct + " % del trabajo con Claude" : "IA score sin estimar"}</div>
            <div class="why">${esc(i.claude_nota || "Qué parte de montar y operar el negocio podrías hacer tú solo con Claude.")}</div>
          </div>
        </div>

        <div class="metrics">
          ${metric("Éxito de mercado", i.exito)}
          ${metric("Viralidad", i.viralidad ?? "–")}
          ${metric("Uso de la IA", i.uso_ia ?? "–")}
          ${metric("Encaje con tu perfil", i.encaje_perfil)}
          ${metric("Aguanta con el tiempo", i.durabilidad)}
          <div class="metric"><div class="l">Impacto de la IA</div><div class="v" style="font-size:1.25rem;margin-top:6px"><span class="chip ${ia[1]}" style="font-size:0.95rem">${ia[0]}</span></div></div>
        </div>

        <div class="facts">
          <div class="fact"><span class="l">Inversión inicial</span><span class="v">${rango(i.inversion_min_eur, i.inversion_max_eur)}</span></div>
          <div class="fact"><span class="l">Retorno de la inversión</span><span class="v">${i.payback_meses != null ? i.payback_meses + " meses" : "–"}</span></div>
          <div class="fact"><span class="l">Coste de adquisición</span><span class="v">${money(i.cac_eur)}</span></div>
          <div class="fact"><span class="l">LTV por cliente${ratio ? " · " + f1(ratio) + "× el CAC" : ""}</span><span class="v">${money(ltv)}</span></div>
          <div class="fact"><span class="l">Ticket medio / cliente / año</span><span class="v">${money(i.ticket_medio_eur)}</span></div>
          <div class="fact"><span class="l">Primeros ingresos</span><span class="v">${i.meses_hasta_ingresos != null ? i.meses_hasta_ingresos + " meses" : "–"}</span></div>
        </div>
        ${i.etiquetas && i.etiquetas.length ? `<div class="tags">${i.etiquetas.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
        <details><summary>Cómo se calcula el ${s}</summary><div class="body calc">
          Compra desasistida <b>${f1(p.venta)}</b> ×2 · Cliente individual <b>${f1(p.red)}</b> ×1,5 · Poca inversión <b>${f1(p.inversion)}</b> ×2 · LTV/CAC <b>${f1(p.ltvcac)}</b> ×2 · Viralidad <b>${f1(p.viralidad)}</b> ×1 · Éxito de mercado <b>${f1(p.exito)}</b> ×1,5. Cada factor va de 0 a 10; el total es de 0 a 100. El encaje con tu perfil y la durabilidad se muestran pero no puntúan.
        </div></details>

        <h3>La ficha</h3>
        <details open><summary>Qué sería el negocio</summary><div class="body">${esc(i.descripcion)}</div></details>
        <details><summary>Mercado y competencia</summary><div class="body kv">
          <div><div class="k">Mercado</div>${esc(i.mercado || "—")}</div>
          <div><div class="k">Competencia</div>${esc(i.competencia || "—")}</div>
          <div><div class="k">Cómo se cobra</div>${esc(i.modelo_ingresos || "—")}</div>
          <div><div class="k">Coste de adquisición</div>${esc(i.cac_nota || "—")}</div>
        </div></details>
        <details><summary>Por qué esas notas</summary><div class="body kv">
          <div><div class="k">Éxito · ${i.exito}/10</div>${esc(i.exito_nota || "—")}</div>
          <div><div class="k">Durabilidad · ${i.durabilidad}/10</div>${esc(i.durabilidad_nota || "—")}</div>
          <div><div class="k">IA · ${esc(i.impacto_ia)}</div>${esc(i.impacto_ia_nota || "—")}</div>
          <div><div class="k">Encaje con tu perfil · ${i.encaje_perfil}/10</div>${esc(i.encaje_nota || "—")}</div>
        </div></details>
        <details><summary>A favor / en contra</summary><div class="body">
          <div class="k" style="font-family:var(--display);font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--good)">A favor</div>${list(i.fortalezas, "pros")}
          <div class="k" style="font-family:var(--display);font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--bad);margin-top:10px">Riesgos</div>${list(i.riesgos, "cons")}
        </div></details>
        <details open><summary>Primer paso para validarla</summary><div class="body">${esc(i.primer_paso || "—")}</div></details>

        <h3>Mis comentarios</h3>
        <div id="comments">${commentsHTML(i)}</div>
        <textarea id="nota" placeholder="Escribe o dicta una nota sobre este negocio…"></textarea>
        <div class="rec-row three">
          <button class="dictate" id="btn-dictar" type="button">🎙️ Dictar</button>
          <button class="rec" id="btn-rec" type="button">🎤 Grabar</button>
          <button class="secondary" id="btn-nota" type="button">📝 Guardar</button>
        </div>
        <div id="rec-preview"></div>
        <p class="helper">Dictar convierte tu voz en texto aquí mismo (revísalo y pulsa Guardar). Grabar guarda el audio tal cual. Cada hora una rutina lee tus notas, modifica la ficha o crea ideas nuevas y la devuelve a Pendientes con un «He tenido en cuenta…» arriba.</p>
      </div>`;
    }

    function commentsHTML(i) {
      const cs = commentsOf(i.id);
      if (!cs.length) return `<p class="helper" style="margin:0 0 6px">Todavía no has dicho nada sobre esta idea.</p>`;
      return cs.map((c) => `
        <div class="comment">
          <div class="head"><span>${c.tipo === "audio" ? "🎤 Audio" : "📝 Nota"} · ${new Date(c.created_at).toLocaleString("es-ES", { dateStyle: "short", timeStyle: "short" })}${c.duracion_seg ? " · " + c.duracion_seg + " s" : ""}</span><span class="estado ${c.estado}">${ESTADO_LABEL[c.estado] || c.estado}</span></div>
          ${c.tipo === "texto" ? `<div>${esc(c.texto)}</div>` : `<audio controls preload="none" src="${audioUrl(c.audio_path)}"></audio>`}
          ${c.transcripcion ? `<div class="trans">“${esc(c.transcripcion)}”</div>` : (c.tipo === "audio" && c.estado === "pendiente" ? `<div class="trans">Sin transcripción: la rutina no puede oírlo. Para que lo procese, usa Dictar o escribe la idea.</div>` : "")}
        </div>`).join("");
    }
    const audioUrl = (path) => `${url}/storage/v1/object/public/${BUCKET}/${path}`;

    // ---------- comentarios: texto ----------
    async function saveText(idea) {
      const texto = el("nota").value.trim();
      if (!texto) return;
      const { data, error } = await client.from(T_COMENTARIOS).insert({ idea_id: idea.id, tipo: "texto", texto }).select().single();
      if (error) { showMsg("No se pudo guardar la nota: " + error.message); return; }
      comentarios.push(data);
      el("nota").value = "";
      el("comments").innerHTML = commentsHTML(idea);
      showToast("📝 Nota guardada");
    }

    // ---------- reconocimiento de voz (dictado) ----------
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
    const dict = { rec: null, on: false, finals: [], target: null };
    function startSR(onFinal, onEnd) {
      if (!SR) return null;
      const r = new SR();
      r.lang = "es-ES"; r.continuous = true; r.interimResults = true;
      r.onresult = (e) => {
        let interim = "";
        for (let k = e.resultIndex; k < e.results.length; k++) {
          const t = e.results[k][0].transcript;
          if (e.results[k].isFinal) onFinal(t.trim()); else interim += t;
        }
        if (dict.target && interim) dict.target.dataset.interim = interim;
      };
      r.onerror = () => {};
      r.onend = () => onEnd && onEnd();
      try { r.start(); } catch { return null; }
      return r;
    }
    function toggleDictate() {
      if (dict.on) return stopDictate();
      if (!SR) { showMsg("Este navegador no permite dictar; usa Grabar o escribe."); return; }
      const ta = el("nota"); dict.target = ta; dict.finals = [];
      const base = ta.value.trim();
      dict.rec = startSR((t) => { dict.finals.push(t); ta.value = (base ? base + " " : "") + dict.finals.join(" "); }, () => { if (dict.on) { try { dict.rec.start(); } catch {} } });
      if (!dict.rec) { showMsg("No se pudo iniciar el dictado."); return; }
      dict.on = true;
      const b = el("btn-dictar"); b.classList.add("on"); b.textContent = "⏹ Parar dictado";
      showMsg("");
    }
    function stopDictate() {
      dict.on = false;
      if (dict.rec) { try { dict.rec.stop(); } catch {} dict.rec = null; }
      const b = el("btn-dictar"); if (b) { b.classList.remove("on"); b.textContent = "🎙️ Dictar"; }
    }

    // ---------- comentarios: audio ----------
    function pickMime() {
      if (!window.MediaRecorder) return "";
      for (const m of ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus", "audio/ogg"]) {
        if (MediaRecorder.isTypeSupported(m)) return m;
      }
      return "";
    }
    const extOf = (mime) => mime.includes("webm") ? "webm" : mime.includes("mp4") ? "m4a" : mime.includes("ogg") ? "ogg" : "bin";
    async function toggleRec(idea) {
      if (rec.recorder && rec.recorder.state === "recording") return stopRec();
      if (!navigator.mediaDevices || !window.MediaRecorder) { showMsg("Este navegador no permite grabar audio."); return; }
      try { rec.stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
      catch (err) { showMsg("Sin acceso al micrófono: " + err.message); return; }
      rec.mime = pickMime();
      rec.chunks = [];
      rec.recorder = new MediaRecorder(rec.stream, rec.mime ? { mimeType: rec.mime } : undefined);
      rec.recorder.ondataavailable = (e) => { if (e.data && e.data.size) rec.chunks.push(e.data); };
      rec.recorder.onstop = () => {
        rec.stream.getTracks().forEach((t) => t.stop());
        rec.blob = new Blob(rec.chunks, { type: rec.recorder.mimeType || rec.mime || "audio/webm" });
        rec.mime = rec.blob.type;
        rec.url = URL.createObjectURL(rec.blob);
        showPreview(idea);
      };
      rec.startedAt = Date.now();
      rec.recorder.start(1000);
      // Intento de transcripción simultánea con el reconocimiento del navegador
      // (funciona en Chrome/Android; si el sistema no lo permite, falla en silencio).
      rec.texto = [];
      rec.sr = startSR((t) => rec.texto.push(t), () => { if (rec.recorder && rec.recorder.state === "recording" && rec.sr) { try { rec.sr.start(); } catch {} } });
      const b = el("btn-rec"); b.classList.add("on");
      rec.timer = setInterval(() => { const sec = Math.round((Date.now() - rec.startedAt) / 1000); b.textContent = `⏹ Parar · ${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`; }, 250);
      b.textContent = "⏹ Parar · 0:00";
      el("rec-preview").innerHTML = "";
    }
    function stopRec() {
      clearInterval(rec.timer);
      if (rec.sr) { const r = rec.sr; rec.sr = null; try { r.stop(); } catch {} }
      const b = el("btn-rec"); if (b) { b.classList.remove("on"); b.textContent = "🎤 Grabar audio"; }
      if (rec.recorder && rec.recorder.state !== "inactive") rec.recorder.stop();
    }
    function resetRec() {
      stopDictate();
      stopRec();
      if (rec.url) URL.revokeObjectURL(rec.url);
      Object.assign(rec, { recorder: null, stream: null, chunks: [], blob: null, url: "" });
      const pv = el("rec-preview"); if (pv) pv.innerHTML = "";
    }
    function showPreview(idea) {
      const sec = Math.max(1, Math.round((Date.now() - rec.startedAt) / 1000));
      el("rec-preview").innerHTML = `<div class="rec-preview">
        <div class="eyebrow">Audio grabado · ${sec} s</div>
        <audio controls src="${rec.url}"></audio>
        <div class="row"><button class="ghost" id="btn-rec-discard" type="button">Descartar</button><button id="btn-rec-save" type="button">💾 Guardar audio</button></div>
      </div>`;
      el("btn-rec-discard").onclick = resetRec;
      el("btn-rec-save").onclick = () => saveAudio(idea, sec);
    }
    async function saveAudio(idea, sec) {
      const btn = el("btn-rec-save"); btn.disabled = true; btn.textContent = "Subiendo…";
      const path = `${idea.id}/${new Date().toISOString().replace(/[:.]/g, "-")}.${extOf(rec.mime)}`;
      const up = await client.storage.from(BUCKET).upload(path, rec.blob, { contentType: rec.mime || "audio/webm", upsert: false });
      if (up.error) { showMsg("No se pudo subir el audio: " + up.error.message); btn.disabled = false; btn.textContent = "💾 Guardar audio"; return; }
      const transcripcion = rec.texto.join(" ").trim() || null;
      const { data, error } = await client.from(T_COMENTARIOS).insert({ idea_id: idea.id, tipo: "audio", audio_path: path, audio_mime: rec.mime, duracion_seg: sec, transcripcion, estado: transcripcion ? "transcrito" : "pendiente" }).select().single();
      if (error) { showMsg("Audio subido pero no se pudo registrar: " + error.message); btn.disabled = false; btn.textContent = "💾 Guardar audio"; return; }
      comentarios.push(data);
      resetRec();
      el("comments").innerHTML = commentsHTML(idea);
      showMsg("");
      showToast(transcripcion ? "🎤 Audio guardado con transcripción" : "🎤 Audio guardado (sin transcripción)");
    }
    function wireComments(idea) {
      el("btn-nota").onclick = () => { stopDictate(); saveText(idea); };
      el("btn-rec").onclick = () => { stopDictate(); toggleRec(idea); };
      el("btn-dictar").onclick = toggleDictate;
    }

    function render() {
      counts();
      document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t.dataset.tab === state.tab));
      el("btn-explore").classList.toggle("active", state.tab === "explorar" || state.tab === "comparar");
      const view = el("view");
      const actions = el("actions");

      // detalle de una ficha ya decidida
      if (state.detailId) {
        const i = ideas.find((x) => x.id === state.detailId);
        if (!i) { state.detailId = null; return render(); }
        actions.classList.add("hidden");
        const others = ["no_gusta", "gusta", "revisar", "definitivo"].filter((d) => d !== i.decision);
        view.innerHTML = `<div class="back" id="back">← Volver</div>${cardHTML(i)}
          <p class="eyebrow">Cambiar etiqueta</p>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
            ${others.map((d) => `<button class="${d === "definitivo" ? "" : "secondary"}" data-d="${d}" style="padding:12px 6px;font-size:1rem">${DECISION_LABEL[d]}</button>`).join("")}
          </div>
          <button class="ghost" id="btn-reabrir">↩ Devolver a pendientes</button>`;
        el("back").onclick = () => { resetRec(); state.detailId = null; render(); };
        el("btn-reabrir").onclick = () => decide(i, null);
        view.querySelectorAll("button[data-d]").forEach((b) => b.onclick = () => decide(i, b.dataset.d));
        wireComments(i);
        window.scrollTo(0, 0);
        return;
      }

      if (state.tab === "pendiente") {
        const p = pending();
        if (!p.length) {
          actions.classList.add("hidden");
          view.innerHTML = `<div class="empty"><div class="big">✅</div><div>No queda ninguna ficha pendiente.</div><div class="helper">Cuando la rutina añada ideas nuevas aparecerán aquí. Pulsa ↻ para comprobarlo.</div></div>`;
          return;
        }
        state.index = clamp(state.index, 0, p.length - 1);
        const i = p[state.index];
        view.innerHTML = `
          <div class="pager">
            <button class="ghost" id="prev" ${state.index === 0 ? "disabled" : ""}>‹</button>
            <span>${isRevised(i) ? "🔁 Revisada · " : ""}Ficha ${state.index + 1} de ${p.length}${p.filter(isRevised).length ? " · " + p.filter(isRevised).length + " revisadas primero" : " · por puntuación"}</span>
            <button class="ghost" id="next" ${state.index >= p.length - 1 ? "disabled" : ""}>›</button>
          </div>
          ${cardHTML(i)}`;
        el("prev").onclick = () => { resetRec(); state.index--; render(); };
        el("next").onclick = () => { resetRec(); state.index++; render(); };
        wireComments(i);
        actions.classList.remove("hidden");
        el("btn-gusta").onclick = () => decide(i, "gusta");
        el("btn-no_gusta").onclick = () => decide(i, "no_gusta");
        el("btn-definitivo").onclick = () => decide(i, "definitivo");
        el("btn-revisar").onclick = () => decide(i, "revisar");
        window.scrollTo(0, 0);
        return;
      }

      actions.classList.add("hidden");
      if (state.tab === "explorar") { renderExplore(view); return; }
      if (state.tab === "comparar") { renderCompare(view); return; }

      // listas de decididas
      const arr = byDecision(state.tab);
      const titles = { gusta: "Las que me gustan", no_gusta: "Las que no me gustan", definitivo: "Definitivo: las que voy a hacer", revisar: "A revisar: la rutina ampliará la información y las devolverá a Pendientes" };
      if (!arr.length) { view.innerHTML = `<div class="empty"><div class="big">📭</div><div>Nada por aquí todavía.</div></div>`; return; }
      view.innerHTML = `<p class="eyebrow">${titles[state.tab]}</p>` + arr.map((i, idx) => itemHTML(i, idx, false)).join("");
      wireItems(view);
    }

    // ---------- utilidades UI ----------
    function showMsg(t) { el("msg").textContent = t; }
    function showToast(t, undoable = false) {
      el("toast-text").textContent = t;
      el("toast").classList.toggle("no-undo", !undoable);
      el("toast").classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(hideToast, 6000);
    }
    function hideToast() { el("toast").classList.remove("show"); }

    async function refresh(btn) {
      btn && btn.classList.add("spin");
      try { await load(); showMsg(""); render(); }
      catch (err) { showMsg("Sin conexión con Supabase: " + err.message); }
      finally { btn && btn.classList.remove("spin"); }
    }

    async function init() {
      document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => { resetRec(); state.tab = t.dataset.tab; state.detailId = null; state.index = 0; render(); }));
      el("btn-refresh").addEventListener("click", (e) => refresh(e.currentTarget));
      el("btn-explore").addEventListener("click", () => { resetRec(); state.tab = (state.tab === "explorar" || state.tab === "comparar") ? "pendiente" : "explorar"; state.detailId = null; state.index = 0; render(); });
      el("toast-undo").addEventListener("click", undo);
      if (!url || !anonKey) { showMsg("Faltan credenciales en config.js"); return; }
      client = supabase.createClient(url, anonKey);
      await refresh(null);
    }
    init();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
